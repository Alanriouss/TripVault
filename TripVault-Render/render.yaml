services:
  - name: tripvault
    type: web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: bun --version
    startCommand: 'TRIPVAULT_PORT="$PORT" TRIPVAULT_ORIGIN="$RENDER_EXTERNAL_URL" bun TripVault_Room_Server.mjs'
    healthCheckPath: /api/health
    envVars:
      - key: BUN_VERSION
        value: "1.4.2"
      - key: TRIPVAULT_HOST
        value: 0.0.0.0
      - key: TRIPVAULT_DB
        value: /var/data/tripvault-rooms.sqlite3
    disk:
      name: tripvault-data
      mountPath: /var/data
      sizeGB: 1

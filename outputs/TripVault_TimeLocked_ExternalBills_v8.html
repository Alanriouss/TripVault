  function billItem(b){const payer=member(b.payer);return `<button type="button" class="bill-row" data-act="bill-detail" data-id="${b.id}"><span class="row-label"><span class="bill-badge">${icon('bill')}</span><span><span class="bill-name">${safe(b.label)}</span><span class="bill-sub">Paid by ${safe(payer?.name||'Unknown')} outside · ${b.participants.length} people · ${b.status==='approved'?'Approved':'Pending approval'}</span></span></span><span class="row-value">${vnd(b.amount)}</span></button>`}
  function overview(){const t=state.trip,ss=stats(),me=ss.find(m=>m.id===state.actor),approved=t.bills.filter(b=>b.status==='approved'),total=approved.reduce((a,b)=>a+b.amount,0);return `<section class="hero"><span class="chip">${phase()} · Time-locked USDC vault</span><div><h1>${safe(t.name)}</h1><div class="hero-meta"><span class="avatar-stack">${t.members.slice(0,4).map(avatar).join('')}</span><span>${t.members.length} travelers · ${safe(t.location)}</span></div></div></section><section class="metrics"><div class="metric"><span class="metric-name">${icon('wallet')}Vault deposits</span><strong>${fmt(Object.values(t.depositUnits).reduce((a,b)=>a+b,0) / USDC_SCALE)} USDC</strong></div><div class="metric"><span class="metric-name">${icon('bill')}Approved expenses</span><strong>${vnd(total)}</strong></div><div class="metric"><span class="metric-name">${icon('wallet')}You paid</span><strong>${vnd(me.paid)}</strong></div><div class="metric"><span class="metric-name">${icon('split')}Your net</span><strong>${vnd(me.net)}</strong></div></section><div class="overview-grid"><section class="panel"><div class="panel-head"><h2>Recent bills</h2>${btn('View all','navigate',{tone:'ghost',data:'data-view="bills"'})}</div>${t.bills.length?t.bills.slice(-3).reverse().map(billItem).join(''):'<p class="empty">No bills yet.</p>'}</section><section class="panel next-card"><span class="next-mark">${icon('bill')}</span><h2>Record a payment</h2><p>Paid for something in VND? Add it here. No USDC is moved when recording a bill.</p>${btn('Add a bill','new-bill',{symbol:'plus',disabled:t.settled})}</section></div><section class="panel"><div class="panel-head"><h2>Trip settings</h2></div>${row('Bill approval',t.approvalMode==='everyone'?'All members':'Organizer only')}${row('Minimum deposit',money(t.minimumUnits))}${row('Starts',safe(t.startTime.replace('T',' ')))}${row('Ends',safe(t.endTime.replace('T',' ')))}${row('Exchange rate',safe(fxLabel(t.reviewQuote || fx)))}${row('Settlement','USDC from vault deposits at trip end')}<p class="notice">Final split locks a USD/VND reference before approval. Deposits and payouts are simulated.</p></section>`}
  function people(){const t=state.trip;return `<div class="section-head"><div><h1>People</h1><p>Who paid, who owes, and each member's net position.</p></div></div><section class="panel"><div class="panel-head"><h2>Travelers</h2><span class="chip">${t.members.length} members</span></div>${stats().map(m=>`<div class="row"><div class="row-label">${avatar(member(m.id))}<span><span class="row-name">${safe(m.name)}${m.id===state.actor?' · You':''}</span><span class="row-sub">Paid ${vnd(m.paid)} · Owes ${vnd(m.owed)} · Deposited ${fmt(depositOf(m.id))} USDC</span></span></div><span class="row-value ${m.net>=0?'money-positive':'money-negative'}">${vnd(m.net)}<small>Net balance</small></span></div>`).join('')}</section>`}
  function bills(){const t=state.trip;return `<div class="section-head"><div><h1>Bills</h1><p>${t.bills.length} recorded · Paid outside the app</p></div>${btn('Add bill','new-bill',{symbol:'plus',disabled:!!t.settled})}</div><section class="panel"><div class="panel-head"><h2>Trip expenses</h2></div>${t.bills.length?t.bills.slice().reverse().map(billItem).join(''):'<p class="empty">No bills yet. Record who paid outside the app.</p>'}</section><p class="notice">Bills are records of real-world payments, not payments from a shared crypto vault.</p>`}
  function wallet(){const t=state.trip,p=phase(),my=depositOf(state.actor),total=Object.values(t.depositUnits).reduce((a,b)=>a+b,0) / USDC_SCALE;return `<div class="section-head"><div><h1>Wallet & vault</h1><p>Fuji testnet and local demo</p></div><span class="chip violet">${p}</span></div><div class="stack">${fujiPanel()}<section class="panel"><h2>Demo vault</h2>${row('Total deposited',fmt(total)+' USDC')}${row('Your deposited balance',fmt(my)+' USDC')}${row('Minimum per member',money(t.minimumUnits))}${row('Start',safe(t.startTime.replace('T',' ')))}${row('End',safe(t.endTime.replace('T',' ')))}${row('Status',p)}<div class="inline" style="margin-top:16px">${btn('Deposit USDC','deposit',{disabled:t.settled})}${btn('Early withdrawal','withdraw',{tone:'secondary',disabled:p!=='Funding'||my<=0})}${t.settled?btn('Claim refund','claim',{tone:'secondary',disabled:my<=0}):''}</div><p class="notice">Early withdrawals use only your own balance. You remain a trip member after withdrawing all. After start, deposits are locked until final settlement; top-ups are allowed.</p></section><section class="panel"><h2>Funding progress</h2>${t.members.map(m=>row(safe(m.name),fmt(depositOf(m.id))+' USDC',depositUnits(t,m.id)>=t.minimumUnits?'Minimum reached':'Below minimum')).join('')}</section><section class="panel"><h2>Demo member</h2>${row('Previewing as',safe(member(state.actor).name))}${btn('Switch demo member','switch-member',{tone:'secondary'})}<p class="notice">These are simulated member balances, not real connected wallets.</p></section><section class="panel"><h2>Exchange rate</h2><p id="fx-status" class="notice">${safe(fxLabel(fx))}</p>${btn('Refresh market reference','refresh-fx',{tone:'secondary'})}</section></div>`}
  function fundsForm(kind){const p=phase(),my=depositOf(state.actor);if(state.trip.settled||(kind==='withdraw'&&p!=='Funding'))return;sheetOpen(kind==='deposit'?'Deposit USDC':'Early withdrawal',kind==='deposit'?'Add USDC to your personal locked balance.':'Withdraw only your own funds before the trip begins.',`<form id="fund-form" class="stack"><label class="field">Amount (USDC)<input name="amount" type="number" min="0.000001" step="0.000001" required placeholder="100"></label><p class="notice">Your deposit: ${fmt(my)} USDC · Minimum: ${money(state.trip.minimumUnits)} · ${p}</p><input type="hidden" name="kind" value="${kind}"><p id="sheet-error" class="form-error"></p></form>`,`<button class="btn full" type="submit" form="fund-form">Confirm demo ${kind}</button>`)}
  function screen(){return ({overview,people,bills,split,wallet}[state.view]||overview)()}
  function render() {
    app.innerHTML = header();
    clearTimeout(phaseTimer);
    if (!state.trip || state.trip.settled) return;
    const now = Date.now();
    const next = [state.trip.startTime, state.trip.endTime].map(value => Date.parse(value)).find(time => time > now);
    if (next) phaseTimer = setTimeout(render, Math.min(next - now, 2_147_483_647));
  }
  function setup(){sheetOpen('Create a trip','Start with an empty workspace. Configure your minimum USDC deposit and trip time lock.',`<form id="create-form" class="stack"><label class="field">Trip name<input name="name" required maxlength="70" placeholder="e.g. Da Lat weekend"></label><label class="field">Destination<input name="location" maxlength="80" placeholder="e.g. Da Lat"></label><label class="field">Your name<input name="yourname" required maxlength="40" placeholder="Your display name"></label><label class="field">Other members (one name per line)<textarea name="others" rows="3" placeholder="Xu&#10;An"></textarea></label><fieldset class="participant-field"><legend>Who approves bills?</legend><label class="participant"><input type="radio" name="mode" value="organizer" checked> Organizer only</label><label class="participant"><input type="radio" name="mode" value="everyone"> Every member must approve</label></fieldset><label class="field">Minimum deposit per member (USDC)<input name="minimum" type="number" min="0.01" step="0.01" required value="20"></label><label class="field">Trip start (locks withdrawals)<input name="startTime" type="datetime-local" required></label><label class="field">Trip end (unlocks settlement)<input name="endTime" type="datetime-local" required></label><div class="notice">The organizer fetches and locks the market reference before the group approves the final split. <span id="fx-status">${safe(fxLabel(fx))}</span></div><p class="notice">Members pay merchants outside the app. TripVault records VND expenses; members deposit USDC in a time-locked vault and settle net debts only at the end.</p><p id="sheet-error" class="form-error"></p></form>`,`<button class="btn full" type="submit" form="create-form">Create trip</button>`)}
  function addBill(){const t=state.trip;if(t.settled)return;sheetOpen('Add a bill','Record a payment made outside TripVault.',`<form id="bill-form" class="stack"><label class="field">Bill name<input name="label" maxlength="70" required placeholder="e.g. Lunch"></label><label class="field">Amount paid (VND)<input name="amount" type="number" inputmode="numeric" min="1" max="1000000000" step="1" required placeholder="300000"></label><label class="field">Who paid the merchant?<select name="payer" required>${t.members.map(m=>`<option value="${m.id}" ${m.id===state.actor?'selected':''}>${safe(m.name)}</option>`).join('')}</select></label><fieldset class="participant-field"><legend>Who shares this cost?</legend><div class="participants">${t.members.map(m=>`<label class="participant">${avatar(m)}<span>${safe(m.name)}</span><input type="checkbox" name="participant" value="${m.id}" checked></label>`).join('')}</div></fieldset><p class="notice">No recipient wallet is needed: the payer is recorded now. USDC recipients are calculated automatically in Final split.</p><p id="sheet-error" class="form-error"></p></form>`,`<button class="btn full" type="submit" form="bill-form">Save bill</button>`)}
  function detail(id){const b=state.trip.bills.find(b=>b.id===id);if(!b)return;const t=state.trip,canApprove=t.approvalMode==='everyone'?true:state.actor===t.owner;const approved=b.approvals.includes(state.actor);const required=t.approvalMode==='everyone'?t.members.length:1;sheetOpen(b.label,`Paid outside · ${b.participants.length} travelers`,`<div class="stack"><div class="metric"><strong>${vnd(b.amount)}</strong></div>${row('Paid by',safe(member(b.payer).name))}${row('Payment method','Outside TripVault')}${row('Status',b.status==='approved'?'Approved':`Pending · ${b.approvals.length}/${required}`)}<div class="split-preview"><p><strong>Equal split</strong></p>${shares(b).map(s=>row(safe(member(s.id).name),vnd(s.amount))).join('')}</div><section class="panel"><h2>Bill approvals</h2>${(t.approvalMode==='everyone'?t.members:[member(t.owner)]).map(m=>row(safe(m.name),b.approvals.includes(m.id)?'Approved':'Pending')).join('')}<div class="inline" style="margin-top:14px">${!t.settled&&canApprove?(approved?btn('Cancel my approval','revoke-bill',{tone:'secondary',data:`data-id="${b.id}"`}):btn('Approve bill','approve-bill',{data:`data-id="${b.id}"`})) : ''}</div></section><p class="notice">The bill can be approved or revoked until the final settlement is completed.</p></div>`)}
  function commit(trip, message) {
    const persisted = save(trip);
    render();
    if (message) notice(persisted ? message : message + ' Changes are only in this tab.');
  }

  function selectTrip(trip) {
    if (sheet.open) sheet.close();
    fallbackReview = null;
    state.trip = trip;
    state.actor = trip?.owner || null;
    state.view = 'overview';
    commit();
    window.scrollTo(0, 0);
  }

  function updateBill(bill, approve) {
    const trip = state.trip;
    if (trip.settled || (trip.approvalMode === 'organizer' && state.actor !== trip.owner)) return;
    if (bill.approvals.includes(state.actor) === approve) return;
    bill.approvals = approve
      ? [...bill.approvals, state.actor]
      : bill.approvals.filter(id => id !== state.actor);
    const required = trip.approvalMode === 'everyone' ? trip.members.map(member => member.id) : [trip.owner];
    bill.status = required.every(id => bill.approvals.includes(id)) ? 'approved' : 'pending';
    invalidateSplit(trip);
    sheet.close();
    commit(trip);
    detail(bill.id);
  }

  document.addEventListener('click', event => {
    const element = event.target.closest('[data-act]');
    if (!element || element.disabled) return;
    const { act, id, view } = element.dataset;
    syncTrips();
    const trip = state.trip;
    if (act === 'close-sheet') return sheet.close();
    if (act === 'guide') return showGuide();
    if (act === 'guide-language') return setGuideLanguage(id);
    if (act.startsWith('fuji-')) return handleFujiAction(act, element.dataset);
    if (act === 'new-trip') return setup();
    if (act === 'trip-list') return selectTrip(null);
    if (act === 'open-trip') {
      const selected = state.trips.find(item => item.id === id);
      if (selected) selectTrip(selected);
      return;
    }
    if (act === 'refresh-fx') return refreshFX();
    if (act === 'join-trip') {
      sheetOpen('Join a trip', 'Demo limitation',
        '<p class="notice">Joining by invite link requires a backend and wallet/member authentication. This standalone prototype supports creating and testing a trip locally.</p>');
      return;
    }
    if (!trip) return;

    switch (act) {
      case 'navigate':
        if (nav.some(([name]) => name === view)) {
          state.view = view;
          commit();
          if (view === 'wallet' || view === 'split') refreshVault();
          window.scrollTo(0, 0);
        }
        break;
      case 'deposit':
      case 'withdraw':
        fundsForm(act);
        break;
      case 'quick-top-up':
        quickTopUp(trip, element.dataset);
        break;
      case 'claim': {
        const units = depositUnits(trip, state.actor);
        if (!trip.settled || units <= 0) break;
        trip.depositUnits[state.actor] = 0;
        commit(trip, 'Claimed ' + money(units) + ' (simulation)');
        break;
      }
      case 'new-bill':
        addBill();
        break;
      case 'bill-detail':
        detail(Number(id));
        break;
      case 'approve-bill':
      case 'revoke-bill': {
        const bill = trip.bills.find(item => item.id === Number(id));
        if (bill) updateBill(bill, act === 'approve-bill');
        break;
      }
      case 'prepare-split':
        prepareSplit(trip);
        break;
      case 'use-fallback':
        if (canUseFallback(fallbackReview)) lockQuote(trip, fallbackReview.quote);
        break;
      case 'reopen-split':
        if (!trip.settled && trip.reviewQuote && state.actor === trip.owner) {
          invalidateSplit(trip);
          commit(trip, 'Split reopened. Prepare a new rate and collect approvals again.');
        }
        break;
      case 'approve-split':
      case 'revoke-split':
        if (!trip.reviewQuote || trip.settled || hasPendingBills(trip)) break;
        if (act === 'approve-split' && settlementPlan(trip, trip.reviewQuote).invalid) break;
        trip.splitApprovals = act === 'approve-split'
          ? [...new Set([...trip.splitApprovals, state.actor])]
          : trip.splitApprovals.filter(memberId => memberId !== state.actor);
        commit(trip);
        break;
      case 'settle':
        settle(trip);
        break;
      case 'switch-member':
        sheetOpen('Switch demo member', 'Preview approvals from another member',
          '<div class="stack">' + trip.members.map(item => btn(
            item.name + (item.id === state.actor ? ' · Current' : ''), 'choose-member',
            { tone: 'secondary full', data: 'data-id="' + safe(item.id) + '"' },
          )).join('') + '</div>');
        break;
      case 'choose-member':
        if (!member(id)) break;
        state.actor = id;
        sheet.close();
        commit();
        break;
    }
  });

  function createTrip(data, fail) {
    const name = String(data.get('name') || '').trim();
    const location = String(data.get('location') || '').trim();
    const names = [String(data.get('yourname') || '').trim(),
      ...String(data.get('others') || '').split('\n').map(item => item.trim()).filter(Boolean)];
    const minimumUnits = parseUnits(data.get('minimum'));
    const startTime = String(data.get('startTime') || '');
    const endTime = String(data.get('endTime') || '');
    const start = Date.parse(startTime);
    const end = Date.parse(endTime);
    if (!name || !names[0] || names.length > 12 || new Set(names.map(item => item.toLowerCase())).size !== names.length
      || !minimumUnits || !Number.isFinite(start) || !Number.isFinite(end) || start <= Date.now() || start >= end) {
      fail('Enter valid trip details, unique member names (up to 12), a positive minimum, and future start/end times.');
      return;
    }
    const members = names.map((memberName, index) => ({ id: 'm' + index, name: memberName }));
    const trip = {
      id: globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + '-' + Math.random().toString(36).slice(2),
      name, location, owner: 'm0', members, minimumUnits, startTime, endTime,
      depositUnits: Object.fromEntries(members.map(item => [item.id, 0])),
      approvalMode: data.get('mode') === 'everyone' ? 'everyone' : 'organizer',
      bills: [], nextBillId: 1, splitApprovals: [], revision: 1, reviewQuote: null, settled: false,
    };
    state.trip = trip;
    state.actor = trip.owner;
    state.view = 'overview';
    fallbackReview = null;
    sheet.close();
    commit(trip, 'Trip created. Deposit USDC before the start.');
  }

  function quickTopUp(trip, selection) {
    const changed = () => {
      render();
      notice('The top-up amount changed. Check the current amount before trying again.');
    };
    if (selection.trip !== trip.id || selection.member !== state.actor
      || selection.revision !== String(trip.revision) || !trip.reviewQuote
      || trip.settled || hasPendingBills(trip)) {
      changed();
      return;
    }
    const plan = settlementPlan(trip, trip.reviewQuote);
    const shortfall = plan.shortfalls.find(item => item.id === state.actor);
    if (plan.invalid || !shortfall || selection.units !== String(shortfall.units)) {
      changed();
      return;
    }
    updateFunds(trip, 'deposit', shortfall.units, notice,
      'Demo top-up recorded: ' + money(shortfall.units));
  }

  function updateFunds(trip, kind, units, fail, message) {
    const existing = depositUnits(trip, state.actor);
    if (!units || trip.settled || !['withdraw', 'deposit'].includes(kind)
      || (kind === 'withdraw' && (phase() !== 'Funding' || units > existing))) {
      fail('Invalid amount or this vault action is unavailable.');
      return;
    }
    const balance = existing + (kind === 'deposit' ? units : -units);
    const total = Object.values(trip.depositUnits).reduce((sum, amount) => sum + amount, 0) - existing + balance;
    if (!Number.isSafeInteger(total)) {
      fail('This amount exceeds the vault balance limit.');
      return;
    }
    trip.depositUnits[state.actor] = balance;
    if (sheet.open) sheet.close();
    commit(trip, message || (kind === 'deposit' ? 'Demo deposit recorded' : 'Demo withdrawal recorded'));
  }

  function recordBill(trip, data, fail) {
    const label = String(data.get('label') || '').trim();
    const amount = Number(data.get('amount'));
    const payer = data.get('payer');
    const participants = data.getAll('participant');
    if (trip.settled || !label || !Number.isSafeInteger(amount) || amount <= 0 || amount > 1e9
      || !member(payer) || !participants.length || new Set(participants).size !== participants.length
      || participants.some(id => !member(id))) {
      fail('Enter a valid amount, payer and at least one participant for an open trip.');
      return;
    }
    trip.bills.push({ id: trip.nextBillId++, label, amount, payer, participants, approvals: [], status: 'pending' });
    invalidateSplit(trip);
    sheet.close();
    state.view = 'bills';
    commit(trip, 'Bill recorded. Waiting for approval.');
  }

  document.addEventListener('submit', event => {
    const form = event.target;
    if (!['create-form', 'fund-form', 'bill-form', 'fuji-deploy-form', 'fuji-funds-form'].includes(form.id)) return;
    event.preventDefault();
    syncTrips();
    const data = new FormData(form);
    const fail = message => { form.querySelector('#sheet-error').textContent = message; };
    if (form.id === 'fuji-deploy-form') deployFuji(data, fail);
    else if (form.id === 'fuji-funds-form') fujiFunds(data, fail);
    else if (form.id === 'create-form') createTrip(data, fail);
    else if (!state.trip) fail('Open a trip first.');
    else if (form.id === 'fund-form') {
      updateFunds(state.trip, data.get('kind'), parseUnits(data.get('amount')), fail);
    }
    else recordBill(state.trip, data, fail);
  });

  window.addEventListener('storage', event => {
    if (event.key !== KEY || storageUnavailable) return;
    const trip = state.trip;
    syncTrips();
    if (trip !== state.trip && sheet.open) sheet.close();
    render();
  });
  restoreWorkspace(loadWorkspace());
  discoverWallets();
  commit();
  showFirstVisitGuide();
  refreshFX();
})();
</script>
</body>
</html>

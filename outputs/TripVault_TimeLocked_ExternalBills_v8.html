<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#f7f7fb" name="theme-color"/>
<meta content="TripVault mobile prototype for shared trip expenses." name="description"/>
<title>TripVault · Trip workspace</title>
<style>:root {
  --page: #f7f7fb;
  --paper: #fff;
  --ink: #211b35;
  --muted: #625b75;
  --subtle: #767085;
  --line: #e8e4ef;
  --accent: #5d45bf;
  --accent-dark: #4a339f;
  --tint: #eee9ff;
  --positive: #146b53;
  --positive-bg: #e7f6ee;
  --warning: #86531a;
  --warning-bg: #fff3dd;
  --danger: #a5374c;
  --danger-bg: #fff0f3;
  --radius: 20px;
  --shadow: 0 4px 16px #211b3506;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
  font-synthesis: none;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 0; line-height: 1.45; }
body:has(dialog[open]) { overflow: hidden; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #a491ed; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.18; letter-spacing: -.035em; }
a { color: var(--accent-dark); }
small { font-size: 12px; }
.skip { position: fixed; z-index: 9; top: 8px; left: 8px; padding: 12px; background: white; transform: translateY(-160%); }
.skip:focus { transform: none; }
.shell { min-height: 100vh; }
.sidebar { display: none; }
.header { position: sticky; top: 0; z-index: 3; background: #f7f7fbf2; border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 65px; padding: 0 18px; }
.wordmark { display: inline-flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 810; letter-spacing: -.05em; }
.brand-mark { display: inline-grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--accent); color: white; font-size: 16px; line-height: 1; }
.brand-mark::before { content: ""; width: 13px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; box-shadow: 3px -3px 0 -1px var(--accent), 4px -4px 0 -1px currentColor; }
.header-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.breadcrumb { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.25; background: #f2eff8; color: #5f547b; }
.chip.green { color: var(--positive); background: var(--positive-bg); }
.chip.warn { color: var(--warning); background: var(--warning-bg); }
.chip.violet { color: var(--accent-dark); background: var(--tint); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.avatar { --av-bg: #e9dfff; --av-ink: #593cb0; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--av-bg); color: var(--av-ink); font-size: 13px; font-weight: 760; flex: 0 0 auto; }
.avatar.tone-1 { --av-bg: #e1f2e8; --av-ink: #21664b; }
.avatar.tone-2 { --av-bg: #ffe9dc; --av-ink: #8f482f; }
.avatar.tone-3 { --av-bg: #e5edff; --av-ink: #365893; }
.avatar-button { display: grid; place-items: center; background: transparent; border: 0; padding: 0; width: 44px; height: 44px; border-radius: 50%; }
.avatar-button:hover { background: var(--tint); }
.main { padding: 18px 16px 102px; width: min(100%, 1140px); margin: 0 auto; }

.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,#17112ae0 0%,#25193694 55%,#25203c2e 100%), linear-gradient(0deg,#18122bb3,transparent 65%); }
.hero .chip { color: #fff; background: #1f163b7f; border: 1px solid #ffffff52; backdrop-filter: blur(10px); }
.hero h1 { font-size: clamp(29px,7vw,49px); font-weight: 780; margin: 0 0 4px; overflow-wrap: anywhere; }
.hero-meta { display: flex; align-items: center; gap: 9px; color: #f1eafa; font-size: 13px; }
.avatar-stack { display: flex; padding-left: 3px; }
.avatar-stack .avatar { width: 24px; height: 24px; font-size: 10px; margin-left: -3px; border: 1.5px solid #3c3255; }
.metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 13px 0 0; }
.metric, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.metric { padding: 13px; }
.metric:last-child { grid-column: 1 / -1; background: #f0ebff; border-color: #e5dbfb; display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.metric-name { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 630; }
.metric strong { display: block; margin-top: 5px; font-size: clamp(20px,5.1vw,29px); letter-spacing: -.055em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.16; }
.metric:last-child strong { margin: 0; }
.metric small { margin-left: 3px; color: var(--muted); font-size: 10px; letter-spacing: 0; font-weight: 650; }
.icon { width: 19px; height: 19px; flex: 0 0 19px; display: inline-grid; place-items: center; position: relative; font-weight: 650; font-size: 18px; line-height: 1; }
.icon::before, .icon::after { box-sizing: border-box; }
.i-home::before { content: ""; width: 13px; height: 12px; border: 1.6px solid; border-top: 0; border-radius: 0 0 3px 3px; position: absolute; bottom: 2px; }
.i-home::after { content: ""; width: 10px; height: 10px; border-top: 1.6px solid; border-left: 1.6px solid; transform: rotate(45deg); position: absolute; top: 2px; }
.i-people::before { content: ""; width: 7px; height: 7px; border: 1.5px solid; border-radius: 50%; position: absolute; left: 4px; top: 1px; box-shadow: 6px 1px 0 -1px currentColor; }
.i-people::after { content: ""; width: 15px; height: 7px; border: 1.5px solid; border-bottom: 0; border-radius: 8px 8px 0 0; position: absolute; bottom: 2px; }
.i-bill::before { content: ""; width: 12px; height: 15px; border: 1.5px solid; border-radius: 2px; }
.i-bill::after { content: ""; position: absolute; width: 6px; height: 5px; border-top: 1.5px solid; border-bottom: 1.5px solid; }
.i-wallet::before { content: ""; width: 15px; height: 11px; border: 1.5px solid; border-radius: 3px; }
.i-wallet::after { content: ""; width: 3px; height: 3px; border-radius: 50%; background: currentColor; position: absolute; right: 4px; }
.i-split::before { content: "⇄"; }
.i-plus::before { content: "+"; }
.i-arrow::before { content: "→"; }
.i-back::before { content: "←"; }
.i-check::before { content: "✓"; }
.i-close::before { content: "×"; font-size: 22px; font-weight: 450; }
.i-link::before { content: "↗"; }
.panel { padding: 16px; }
.panel-head, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-head { margin-bottom: 11px; }
.panel-head h2, .section-head h2 { font-size: 20px; }
.panel-head p, .section-head p { color: var(--muted); font-size: 13px; margin-top: 5px; }
.section-head { margin: 0 0 16px; }
.section-head h1 { font-size: clamp(29px,7vw,40px); }
.section-head > div { min-width: 0; }
.overview-grid { display: grid; gap: 13px; margin-top: 13px; }
.overview-grid .next-card { order: -1; }
.overview-grid .pending-card { order: -1; }
.pending-card { display: grid; align-content: start; gap: 10px; }
.pending-card .panel-head { margin-bottom: 0; flex-wrap: wrap; }
.pending-card > .row { padding-top: 0; }
.next-card { display: grid; align-content: start; gap: 8px; }
.next-card h2 { font-size: 19px; }
.next-card p { color: var(--muted); font-size: 13px; }
.next-card .btn { width: fit-content; margin-top: 4px; }
.next-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--tint); color: var(--accent-dark); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; border: 1px solid transparent; border-radius: 12px; background: var(--accent); color: white; font-weight: 700; font-size: 13px; text-align: center; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--accent-dark); }
.btn.secondary { border-color: var(--line); background: white; color: var(--ink); }
.btn.secondary:hover:not(:disabled) { background: #f4f1fa; }
.btn.soft { background: var(--tint); color: var(--accent-dark); }
.btn.soft:hover:not(:disabled) { background: #e4dbfd; }
.btn.ghost { background: transparent; color: var(--accent-dark); padding: 0 8px; }
.btn.ghost:hover:not(:disabled) { background: var(--tint); }
.btn.danger { background: var(--danger-bg); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: #fbe1e8; }
.btn.full { width: 100%; }
.icon-button { width: 44px; min-width: 44px; min-height: 44px; padding: 0; }
.row, .bill-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; min-width: 0; }
.row + .row, .bill-row + .bill-row { border-top: 1px solid var(--line); }
.row { padding: 12px 0; }
.row:last-child { padding-bottom: 1px; }
.row-name, .bill-name { display: block; font-weight: 730; font-size: 14px; overflow-wrap: anywhere; }
.row-sub, .bill-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.row-label { display: flex; align-items: center; gap: 9px; min-width: 0; }
.row-value { font-size: 14px; font-weight: 760; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.row-value small { display: block; color: var(--muted); font-weight: 530; }
.bill-row { border: 0; width: 100%; background: transparent; text-align: left; color: var(--ink); padding: 12px 0; }
.bill-row:hover { background: #faf8ff; }
.bill-badge { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 12px; color: var(--accent-dark); background: var(--tint); }
.bill-row:nth-child(even) .bill-badge { background: #e4f2ea; color: #22644b; }
.empty { padding: 17px 0; color: var(--muted); font-size: 14px; }
.stack { display: grid; gap: 13px; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.member-progress { height: 5px; margin-top: 8px; border-radius: 99px; background: #eeeaf5; overflow: hidden; }
.member-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.funding-summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.funding-summary strong { display: block; font-size: 29px; letter-spacing: -.045em; }
.funding-summary p { color: var(--muted); font-size: 13px; }
.notice { padding: 12px 13px; border-radius: 12px; font-size: 13px; background: var(--tint); color: #483489; }
.notice.warn { color: var(--warning); background: var(--warning-bg); }
.notice.danger { color: var(--danger); background: var(--danger-bg); }
.notice.green { color: var(--positive); background: var(--positive-bg); }
.vault-alert { display: flex; align-items: center; gap: 11px; }
.vault-alert .next-mark { flex: 0 0 34px; background: #ffebc6; color: var(--warning); }
.vault-alert p { margin-top: 2px; }
.metrics + .vault-alert { margin-top: 12px; }
.money-positive { color: var(--positive); }
.money-negative { color: var(--danger); }
.mobile-nav { position: fixed; z-index: 4; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px; padding: 7px 10px max(7px,env(safe-area-inset-bottom)); background: #fffffffa; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px #211b3508; }
.nav-btn { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; border: 0; border-radius: 13px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 680; min-height: 50px; padding: 6px 4px; }
.nav-btn[aria-current="page"] { color: var(--accent-dark); background: var(--tint); }
.nav-btn:hover:not([aria-current]) { background: #f4f1f9; }
.wizard { max-width: 600px; margin: 18px auto 0; }
.wizard-step { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); list-style: none; margin: 0 0 16px; padding: 0; gap: 6px; }
.wizard-step li { border-bottom: 3px solid #e1dce9; padding: 9px 4px; font-size: 12px; font-weight: 680; color: var(--muted); }
.wizard-step li.current { border-color: var(--accent); color: var(--accent-dark); }
.wizard h1 { font-size: 31px; margin: 0 0 7px; }
.wizard .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.field { display: grid; gap: 5px; font-weight: 700; font-size: 13px; min-width: 0; }
.field > input, .field > select, .input-affix { width: 100%; min-width: 0; min-height: 45px; border: 1px solid #d9d3e5; border-radius: 11px; background: white; color: var(--ink); padding: 9px 11px; font-size: 16px; font-weight: 520; }
.input-affix { display: flex; align-items: center; gap: 6px; padding: 0 11px; }
.input-affix input { background: transparent; padding: 8px 0; border: 0; flex: 1 1 60px; min-width: 0; width: 100%; color: var(--ink); }
.input-affix span { font-size: 11px; color: var(--muted); font-weight: 700; }
.input-affix:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px #e6dbff; }
.input-affix input:focus { outline: 0; }
.form-error { color: var(--danger); font-size: 13px; }
.form-error:empty { display: none; }
.wizard-footer { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 15px; }
.form-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 8px; }
dialog { width: min(100%,540px); max-width: 100%; margin: auto auto 0; padding: 0; border: 0; border-radius: 24px 24px 0 0; color: var(--ink); background: white; box-shadow: 0 12px 56px #221a354d; max-height: min(94dvh,850px); overflow: auto; overscroll-behavior: contain; }
dialog::backdrop { background: #21163472; backdrop-filter: blur(3px); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 17px; border-bottom: 1px solid var(--line); background: white; }
.sheet-head h2 { font-size: 24px; }
.sheet-head p { color: var(--muted); font-size: 12px; margin-top: 4px; }
.sheet-body { padding: 15px 17px; display: grid; gap: 13px; }
.sheet-footer { position: sticky; bottom: 0; z-index: 1; padding: 10px 17px max(11px,env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: white; }
.sheet-footer .btn { min-height: 47px; }
.guide-steps { display: grid; gap: 10px; margin: 0; padding-inline-start: 22px; }
.guide-steps li { padding-inline-start: 3px; font-size: 14px; }
.guide-steps li::marker { color: var(--accent-dark); font-weight: 700; }
.guide-steps strong { display: block; }
.guide-steps p { color: var(--muted); margin-top: 3px; }
.top-up-actions { margin-top: 8px; }
.top-up-actions .btn { white-space: normal; }
@media (max-width: 390px) {
  .header-demo { display: none; }
}
.participant-field { border: 0; min-width: 0; margin: 0; padding: 0; }
.participant-field legend { font-size: 13px; font-weight: 750; padding: 0; margin: 0 0 2px; }
.participants-head { display: flex; align-items: center; justify-content: space-between; gap: 7px; color: var(--muted); font-size: 12px; }
.participants { display: grid; gap: 5px; }
.participant { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 45px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); font-size: 13px; font-weight: 680; }
.participant:has(input:checked) { background: #f8f5ff; border-color: #ded3ff; }
.participant .avatar { width: 26px; height: 26px; font-size: 10px; }
.participant input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0 0 0 auto; flex: 0 0 17px; }
.split-preview { padding: 12px; border-radius: 13px; background: #f2edff; border: 1px solid #e6ddfb; }

.split-preview dd { margin: 0; white-space: nowrap; font-weight: 680; }
.projected-shares small { display: block; color: var(--muted); }
.projected-shares dt { min-width: 0; overflow-wrap: anywhere; }
.projected-shares dd { text-align: right; }
.projected-shares .money-negative small { color: var(--danger); }

.split-preview .payment-note.money-negative { color: var(--danger); }

  function walletProviders() {
    const discovered = [...walletSession.providers.values()];
    const legacy = [window.avalanche, ...(window.ethereum?.providers || [window.ethereum])];
    for (const provider of legacy) {
      if (!provider?.request || discovered.some(option => option.provider === provider)) continue;
      discovered.push({ provider, name: provider === window.avalanche ? 'Core' : provider.isMetaMask ? 'MetaMask' : 'Browser wallet' });
    }
    return discovered;
  }

  function discoverWallets() {
    window.addEventListener('eip6963:announceProvider', event => {
      const { info, provider } = event.detail || {};
      if (info?.uuid && typeof provider?.request === 'function') {
        walletSession.providers.set(info.uuid, { provider, name: String(info.name || 'Browser wallet') });
      }
    });
    requestWalletAnnouncements();
  }

  function requestWalletAnnouncements() {
    if (typeof window.dispatchEvent === 'function') {
      window.dispatchEvent(new Event('eip6963:requestProvider'));
    }
  }

  function request(provider, method, params) {
    return provider.request(params ? { method, params } : { method });
  }

  function walletError(error) {
    if (error?.code === 4001 || error?.code === 'ACTION_REJECTED') return 'Request declined in your wallet.';
    if (error?.code === -32002) return 'A wallet request is already open. Check your wallet extension.';
    return String(error?.shortMessage || error?.message || 'Wallet request failed.').slice(0, 260);
  }

  function walletStatus(tripId, phase, label, message = '', hash = '') {
    walletSession.status = { tripId, phase, label, message, hash };
    render();
  }

  function clearWallet() {
    for (const [provider, event, listener] of walletSession.listeners) provider.removeListener?.(event, listener);
    walletSession.listeners = [];
    walletSession.provider = null;
    walletSession.name = '';
    walletSession.account = '';
    walletSession.chain = '';
    walletSession.vault = null;
    walletSession.status = null;
    walletSession.generation++;
  }

  async function syncWallet(provider) {
    if (walletSession.provider !== provider) return;
    const generation = ++walletSession.generation;
    walletSession.vault = null;
    try {
      const [accounts, chain] = await Promise.all([
        request(provider, 'eth_accounts'), request(provider, 'eth_chainId'),
      ]);
      if (walletSession.provider !== provider || walletSession.generation !== generation) return;
      walletSession.account = isAddress(accounts?.[0]) ? accounts[0].toLowerCase() : '';
      walletSession.chain = String(chain).toLowerCase();
      render();
      await refreshVault();
    } catch (error) {
      if (walletSession.provider !== provider || walletSession.generation !== generation) return;
      walletSession.account = '';
      walletSession.chain = '';
      walletStatus(state.trip?.id, 'failed', 'Wallet connection', walletError(error));
    }
  }

  async function connectWallet(option) {
    if (!option || walletSession.busy) return;
    const { provider, name } = option;
    if (sheet.open) sheet.close();
    clearWallet();
    walletSession.busy = true;
    walletStatus(state.trip?.id, 'signature', 'Connect wallet', 'Approve the connection in your wallet.');
    try {
      const accounts = await request(provider, 'eth_requestAccounts');
      if (!isAddress(accounts?.[0])) throw new Error('Your wallet did not provide an account.');
      walletSession.provider = provider;
      walletSession.name = name;
      const changed = () => { syncWallet(provider); };
      const disconnected = () => { clearWallet(); render(); };
      for (const [event, listener] of [['accountsChanged', changed], ['chainChanged', changed], ['disconnect', disconnected]]) {
        provider.on?.(event, listener);
        walletSession.listeners.push([provider, event, listener]);
      }
      walletSession.status = null;
      await syncWallet(provider);
    } catch (error) {
      clearWallet();
      walletStatus(state.trip?.id, error?.code === 4001 ? 'rejected' : 'failed', 'Connect wallet', walletError(error));
    } finally {
      walletSession.busy = false;
      render();
    }
  }

  function chooseWallet() {
    requestWalletAnnouncements();
    const providers = walletProviders();
    walletSession.choices = providers;
    if (!providers.length) {
      const help = window.location?.protocol === 'file:'
        ? 'Open TripVault through the Firefox launcher to use it at http://127.0.0.1:8787/.'
        : 'Check that MetaMask or Core is enabled in this Firefox window, then reload this page.';
      sheetOpen('Connect Wallet', 'Avalanche Fuji testnet',
        '<p class="notice warn">No browser wallet detected. ' + help + '</p>',
        btn('Try again', 'fuji-connect', { tone: 'full' }),
      );
      return;
    }
    sheetOpen('Connect Wallet', 'Choose a wallet', '<div class="stack">' +
      providers.map((option, index) => btn(option.name, 'fuji-wallet-option', {
        tone: 'secondary full', data: 'data-id="' + index + '"',
      })).join('') + '</div>');
  }

  async function switchToFuji() {
    const provider = walletSession.provider;
    if (!provider || walletSession.busy) return;
    walletSession.busy = true;
    walletStatus(state.trip?.id, 'signature', 'Switch to Fuji', 'Approve the network change in your wallet.');
    try {
      try {
        await request(provider, 'wallet_switchEthereumChain', [{ chainId: FUJI.id }]);
      } catch (error) {
        if (Number(error?.code) !== 4902 && Number(error?.data?.originalError?.code) !== 4902) throw error;
        await request(provider, 'wallet_addEthereumChain', [{
          chainId: FUJI.id, chainName: 'Avalanche Fuji C-Chain',
          nativeCurrency: { name: 'Avalanche', symbol: 'AVAX', decimals: 18 },
          rpcUrls: [FUJI.rpc], blockExplorerUrls: [FUJI.explorer],
        }]);
        if (String(await request(provider, 'eth_chainId')).toLowerCase() !== FUJI.id) {
          await request(provider, 'wallet_switchEthereumChain', [{ chainId: FUJI.id }]);
        }
      }
      walletSession.status = null;
      await syncWallet(provider);
    } catch (error) {
      walletStatus(state.trip?.id, error?.code === 4001 ? 'rejected' : 'failed', 'Switch to Fuji', walletError(error));
    } finally {
      walletSession.busy = false;
      render();
    }
  }

  function walletContext() {
    return {
      provider: walletSession.provider, account: walletSession.account, tripId: state.trip?.id,
      vault: state.trip?.fuji?.address,
    };
  }

  async function checkWallet(context) {
    if (!context.provider || !isAddress(context.account) || walletSession.provider !== context.provider) {
      throw new Error('Connect a wallet first.');
    }
    const [accounts, chain] = await Promise.all([
      request(context.provider, 'eth_accounts'), request(context.provider, 'eth_chainId'),
    ]);
    if (String(chain).toLowerCase() !== FUJI.id) throw new Error('Switch your wallet to Avalanche Fuji.');
    if (accounts?.[0]?.toLowerCase() !== context.account) throw new Error('The wallet account changed. Try again.');
  }

  function ethCall(context, address, data) {
    return request(context.provider, 'eth_call', [{ to: address, data }, 'latest']);
  }

  async function fetchVault(context) {
    if (!isAddress(context.vault)) throw new Error('Deploy the Fuji vault first.');
    await checkWallet(context);
    const [code, raw, block, rawUsdc] = await Promise.all([
      request(context.provider, 'eth_getCode', [context.vault, 'latest']),
      ethCall(context, context.vault, vaultCall('snapshot()')),
      request(context.provider, 'eth_getBlockByNumber', ['latest', false]),
      ethCall(context, FUJI.usdc, vaultCall('balanceOf(address)', context.account)),
    ]);
    await checkWallet(context);
    if (code?.toLowerCase() !== '0x' + VAULT.runtime) throw new Error('The stored address is not this TripVault contract.');
    const snapshot = abiDecodeSnapshot(raw);
    if (!snapshot.members.length || snapshot.members.length !== snapshot.balances.length
      || snapshot.members.length !== snapshot.approvals.length
      || (snapshot.net.length && snapshot.members.length !== snapshot.net.length)) {
      throw new Error('Could not read the Fuji vault.');
    }
    return {
      ...snapshot, timestamp: Number(BigInt(block.timestamp)), usdc: BigInt(rawUsdc),
      account: context.account, address: context.vault, tripId: context.tripId,
    };
  }

  function currentVault() {
    const saved = walletSession.vault;
    if (walletSession.chain !== FUJI.id || !saved || saved.tripId !== state.trip?.id
      || saved.address !== state.trip?.fuji?.address || saved.account !== walletSession.account) return null;
    return saved;
  }

  async function refreshVault() {
    const context = walletContext();
    const generation = walletSession.generation;
    if (!context.vault || !context.account || walletSession.chain !== FUJI.id) return;
    try {
      const result = await fetchVault(context);
      if (walletSession.generation === generation && walletSession.account === context.account
        && state.trip?.id === context.tripId && state.trip.fuji?.address === context.vault) {
        walletSession.vault = result;
        render();
      }
    } catch (error) {
      if (walletSession.generation === generation && state.trip?.id === context.tripId) {
        walletSession.vault = null;
        if (!walletSession.busy) walletStatus(context.tripId, 'failed', 'Read Fuji vault', walletError(error));
      }
    }
  }

  function rememberFujiTx(tripId, tx, address) {
    syncTrips();
    const trip = state.trip?.id === tripId ? state.trip : state.trips.find(item => item.id === tripId);
    if (!trip) return;
    trip.fuji = { ...trip.fuji, lastTx: tx };
    if (address) trip.fuji.address = address;
    if (tx.kind === 'fuji-publish' && tx.phase === 'confirmed') trip.fuji.publishedRevision = tx.revision;
    save(trip);
  }

  function transactionStatus(context, tx, phase, message, address) {
    const record = { ...tx, phase, message };
    if (record.hash) rememberFujiTx(context.tripId, record, address);
    walletStatus(context.tripId, phase, record.label, message, record.hash);
  }

  async function checkReceipt(context, tx, wait) {
    try {
      const attempts = wait ? 15 : 1;
      for (let attempt = 0; attempt < attempts; attempt++) {
        if (attempt) await new Promise(resolve => setTimeout(resolve, 1500));
        if (String(await request(context.provider, 'eth_chainId')).toLowerCase() !== FUJI.id) break;
        const receipt = await request(context.provider, 'eth_getTransactionReceipt', [tx.hash]);
        if (!receipt) continue;
        if (receipt.transactionHash?.toLowerCase() !== tx.hash.toLowerCase()
          || receipt.from?.toLowerCase() !== tx.from || !['0x0', '0x1'].includes(receipt.status)) {
          throw new Error('Unexpected Fuji transaction receipt.');
        }
        if (receipt.status === '0x0') {
          transactionStatus(context, tx, 'failed', 'The transaction reverted on Fuji.');
          return false;
        }
        if (tx.kind === 'deploy') {
          if (!isAddress(receipt.contractAddress)) throw new Error('Missing vault address in the Fuji receipt.');
          const code = await request(context.provider, 'eth_getCode', [receipt.contractAddress, 'latest']);
          if (code?.toLowerCase() !== '0x' + VAULT.runtime) {
            transactionStatus(context, tx, 'failed', 'Fuji confirmed the transaction, but the deployed code could not be verified.');
            return false;
          }
        }
        transactionStatus(context, tx, 'confirmed', 'Confirmed on Avalanche Fuji.',
          tx.kind === 'deploy' ? receipt.contractAddress.toLowerCase() : undefined);
        return true;
      }
      transactionStatus(context, tx, 'pending', 'Awaiting a Fuji receipt. Use Check transaction to refresh.');
    } catch (error) {
      transactionStatus(context, tx, 'pending', 'Receipt not available. ' + walletError(error));
    }
    return false;
  }

  async function sendFuji(context, label, kind, to, data, revision) {
    await checkWallet(context);
    if (state.trip?.id !== context.tripId) throw new Error('Return to the original trip to continue.');
    const tx = { kind, label, from: context.account, revision };
    transactionStatus(context, tx, 'signature', 'Review and confirm in your wallet.');
    const params = { from: context.account, data };
    if (to) params.to = to;
    const hash = await request(context.provider, 'eth_sendTransaction', [params]);
    if (!isHash(hash)) throw new Error('The wallet did not return a transaction hash.');
    tx.hash = hash;
    transactionStatus(context, tx, 'pending', 'Submitted. Waiting for a Fuji receipt.');
    return checkReceipt(context, tx, true);
  }

  async function withFuji(label, task, allowPending = false) {
    if (walletSession.busy || !state.trip) return;
    syncTrips();
    if (!allowPending && state.trip?.fuji?.lastTx?.phase === 'pending') {
      notice('Check the pending Fuji transaction first.');
      return;
    }
    const context = walletContext();
    walletSession.busy = true;
    render();
    try {
      await checkWallet(context);
      await task(context);
      await refreshVault();
    } catch (error) {
      walletStatus(context.tripId, error?.code === 4001 ? 'rejected' : 'failed', label, walletError(error));
    } finally {
      walletSession.busy = false;
      render();
    }
  }

  function openFujiDeploy() {
    const trip = state.trip;
    if (!trip || trip.fuji?.address || state.actor !== trip.owner
      || walletSession.chain !== FUJI.id || !walletSession.account) return;
    sheetOpen('Deploy Fuji vault', trip.name,
      `<form id="fuji-deploy-form" class="stack">
        <p class="notice">This deploys a testnet vault for the wallets below. Verify each address before signing. Each wallet is responsible for its own deposits and approvals.</p>
        ${trip.members.map((member, index) =>
          `<label class="field">${safe(member.name)}${index ? '' : ' · Organizer'}
            <input class="wallet-field" name="address" value="${index ? '' : walletSession.account}" placeholder="0x…" required pattern="0x[0-9a-fA-F]{40}" ${index ? '' : 'readonly'}>
          </label>`).join('')}
        <p id="sheet-error" class="form-error"></p>
      </form>`,
      '<button class="btn full" type="submit" form="fuji-deploy-form">Review deployment in wallet</button>',
    );
  }

  function deployFuji(data, fail) {
    const trip = state.trip;
    const members = data.getAll('address').map(value => String(value).trim().toLowerCase());
    if (!trip || trip.fuji?.address || state.actor !== trip.owner || members.length !== trip.members.length
      || members[0] !== walletSession.account || !members.every(isAddress) || new Set(members).size !== members.length) {
      fail('Enter a different valid wallet address for each member, including the connected organizer.');
      return;
    }
    const start = Math.floor(Date.parse(trip.startTime) / 1000);
    const end = Math.floor(Date.parse(trip.endTime) / 1000);
    if (end <= Date.now() / 1000) {
      fail('Choose a trip with an end time in the future.');
      return;
    }
    const calldata = '0x' + VAULT.bytecode + abiWord(128) + abiWord(start) + abiWord(end)
      + abiWord(trip.minimumUnits) + abiArray(members);
    sheet.close();
    withFuji('Deploy Fuji vault', context => sendFuji(context, 'Deploy Fuji vault', 'deploy', null, calldata));
  }

  function openFujiFunds(kind) {
    const vault = currentVault();
    if (!vault || !vault.members.includes(walletSession.account) || walletSession.busy) return;
    const withdraw = kind === 'withdraw';
    sheetOpen(withdraw ? 'Withdraw test USDC' : 'Deposit test USDC', 'Avalanche Fuji',
      `<form class="stack" id="fuji-funds-form">
        <input name="kind" type="hidden" value="${kind}">
        <label class="field">Amount (test USDC)<input name="amount" type="number" min="0.000001" step="0.000001" required></label>
        ${withdraw ? '' : '<p class="notice">Your wallet may first ask you to approve this exact USDC allowance. The deposit is a separate transaction.</p>'}
        <p id="sheet-error" class="form-error"></p>
      </form>`,
      '<button class="btn full" type="submit" form="fuji-funds-form">Continue in wallet</button>',
    );
  }

  function fujiDeposit(units, topUpHash) {
    withFuji('Deposit test USDC', async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (index < 0 || vault.settled || vault.timestamp >= vault.end + REFUND_DELAY) {
        throw new Error('This wallet cannot deposit into the vault.');
      }
      if (topUpHash && (topUpHash !== vault.hash || fujiShortfall(vault, index) !== units
        || state.trip?.id !== context.tripId || !matchesFujiDraft(state.trip, vault))) {
        throw new Error('The amount due changed. Refresh the vault before topping up.');
      }
      if (BigInt(units) > vault.usdc) throw new Error('This wallet needs more Fuji test USDC.');
      const allowance = BigInt(await ethCall(context, FUJI.usdc,
        vaultCall('allowance(address,address)', context.account, context.vault)));
      if (allowance < BigInt(units)) {
        const approved = await sendFuji(context, 'Approve ' + money(units), 'allowance', FUJI.usdc,
          vaultCall('approve(address,uint256)', context.vault, units));
        if (!approved) return;
      }
      const calldata = topUpHash ? vaultCall('depositForPlan(uint256,bytes32)', units, topUpHash)
        : vaultCall('deposit(uint256)', units);
      await sendFuji(context, 'Deposit ' + money(units), 'deposit', context.vault, calldata);
    });
  }

  function fujiFunds(data, fail) {
    const kind = data.get('kind');
    const units = parseUnits(data.get('amount'));
    if (!units || !['deposit', 'withdraw'].includes(kind)) return fail('Enter a valid amount of test USDC.');
    sheet.close();
    if (kind === 'deposit') return fujiDeposit(units);
    withFuji('Withdraw test USDC', async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (index < 0 || vault.timestamp >= vault.start || units > vault.balances[index]) {
        throw new Error('Early withdrawal is unavailable for this amount.');
      }
      await sendFuji(context, 'Withdraw ' + money(units), 'withdraw', context.vault, vaultCall('withdraw(uint256)', units));
    });
  }

  function fujiShortfall(vault, index) {
    return Math.max(0, Math.max(vault.minimum, -(vault.net[index] || 0)) - vault.balances[index]);
  }

  function fujiDraft(trip) {
    if (!trip.reviewQuote || hasPendingBills(trip)) return null;
    const plan = settlementPlan(trip, trip.reviewQuote);
    if (plan.invalid) return null;
    const net = new Map(trip.members.map(member => [member.id, 0n]));
    for (const item of plan.transfers) {
      net.set(item.from, net.get(item.from) - BigInt(item.units));
      net.set(item.to, net.get(item.to) + BigInt(item.units));
    }
    const result = [...net.values()].map(Number);
    return result.every(Number.isSafeInteger) ? result : null;
  }

  function matchesFujiDraft(trip, vault) {
    const draft = fujiDraft(trip);
    return Boolean(draft && trip.fuji?.publishedRevision === String(trip.revision)
      && draft.length === vault.net.length && draft.every((units, index) => units === vault.net[index]));
  }

  function openFujiPlan(vault) {
    const trip = state.trip;
    const draft = trip && fujiDraft(trip);
    if (!draft || vault?.members[0] !== walletSession.account || vault.members.length !== draft.length) return;
    sheetOpen('Review the Fuji split', trip.name,
      `<div class="stack">${draft.map((units, index) => row(
        safe(trip.members[index].name), (units > 0 ? '+' : '') + money(units), safe(vault.members[index]),
      )).join('')}<p class="notice">Publishing records these exact amounts and the organizer’s approval on Fuji. Each other member must approve this proposal before settlement.</p></div>`,
      btn('Publish split on Fuji', 'fuji-publish', {
        tone: 'full', data: `data-revision="${trip.revision}"`,
      }),
    );
  }

  function fujiSettlementAction(action, selection) {
    const trip = state.trip;
    const displayed = currentVault();
    if (!trip || !displayed) return;
    const labels = {
      'fuji-publish': 'Publish Fuji split', 'fuji-approve': 'Approve Fuji split',
      'fuji-revoke': 'Revoke Fuji approval', 'fuji-settle': 'Settle Fuji vault', 'fuji-claim': 'Claim test USDC',
    };
    if (sheet.open) sheet.close();
    withFuji(labels[action], async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (index < 0) throw new Error('Connect a wallet that belongs to this vault.');
      let calldata;
      if (action === 'fuji-publish') {
        syncTrips();
        const latest = state.trip;
        const draft = latest?.id === context.tripId && fujiDraft(latest);
        if (!draft || String(latest.revision) !== selection.revision || draft.length !== vault.members.length
          || index !== 0 || vault.timestamp < vault.end || vault.settled || vault.timestamp >= vault.end + REFUND_DELAY) {
          throw new Error('The split changed or cannot be published. Review the draft again.');
        }
        calldata = vaultCall('propose(int256[])', 32) + abiArray(draft);
      } else if (action === 'fuji-claim') {
        if (vault.balances[index] <= 0 || (!vault.settled && vault.timestamp < vault.end + REFUND_DELAY)) {
          throw new Error('There is no claimable balance yet.');
        }
        calldata = vaultCall('claim()');
      } else {
        if (!vault.net.length || vault.hash !== selection.hash || vault.settled) {
          throw new Error('The Fuji proposal changed. Review the latest amounts.');
        }
        if (vault.timestamp < vault.end || vault.timestamp >= vault.end + REFUND_DELAY) {
          throw new Error('The Fuji settlement window is closed.');
        }
        syncTrips();
        if (action !== 'fuji-revoke' && (state.trip?.id !== context.tripId || !matchesFujiDraft(state.trip, vault))) {
          throw new Error('The local split changed. Publish a replacement before continuing.');
        }
        if (action === 'fuji-settle') {
          if (index !== 0 || !vault.approvals.every(Boolean)
            || vault.members.some((_, position) => fujiShortfall(vault, position) > 0)) {
            throw new Error('The organizer can settle after all members approve and fund the plan.');
          }
          calldata = vaultCall('settle(bytes32)', vault.hash);
        } else {
          calldata = vaultCall('approve(bytes32,bool)', vault.hash, action === 'fuji-approve' ? 1 : 0);
        }
      }
      await sendFuji(context, labels[action], action, context.vault, calldata, selection.revision);
    });
  }

  function checkFujiTransaction() {
    const trip = state.trip;
    const tx = trip?.fuji?.lastTx;
    if (tx?.phase !== 'pending' || !isHash(tx.hash)) return;
    withFuji(tx.label, context => checkReceipt(context, tx, false), true);
  }

  function fujiTransactionCard(trip) {
    const visible = walletSession.status;
    const status = visible && visible.tripId === trip?.id ? visible : trip?.fuji?.lastTx;
    if (!status) return '';
    const names = {
      signature: 'Awaiting signature', pending: 'Pending', confirmed: 'Confirmed', failed: 'Failed', rejected: 'Declined',
    };
    const style = status.phase === 'confirmed' ? ' green' : status.phase === 'signature' ? '' : ' warn';
    const link = isHash(status.hash)
      ? `<p><a href="${FUJI.explorer}/tx/${status.hash}" target="_blank" rel="noopener noreferrer">View on Fuji Explorer</a></p>` : '';
    return `<div class="notice${style}" role="status">
      <p><strong>${safe(names[status.phase])} · ${safe(status.label)}</strong></p>
      <p>${safe(status.message)}</p>${link}
    </div>`;
  }

  function fujiPanel(section = 'wallet') {
    const trip = state.trip;
    const { account, chain, name, busy } = walletSession;
    const onFuji = chain === FUJI.id;
    const pending = trip?.fuji?.lastTx?.phase === 'pending';
    const disabled = busy || pending;
    const vault = currentVault();
    const index = vault?.members.indexOf(account) ?? -1;
    const address = trip?.fuji?.address;
    let controls = '';
    let content = '';
    if (!account) {
      controls = btn('Connect Wallet', 'fuji-connect', { disabled: busy });
    } else {
      content = row(safe(name), onFuji ? 'Avalanche Fuji' : 'Wrong network', safe(account));
      controls = !onFuji ? btn('Switch to Fuji', 'fuji-switch', { disabled: busy })
        : address ? btn('Refresh Fuji', 'fuji-refresh', { tone: 'secondary', disabled: busy }) : '';
      controls += btn('Disconnect', 'fuji-disconnect', { tone: 'ghost', disabled: busy });
    }
    if (pending && account && onFuji) controls += btn('Check transaction', 'fuji-check', { tone: 'secondary', disabled: busy });
    if (!address && account && onFuji && !pending && trip && section === 'wallet' && state.actor === trip.owner) {
      controls += btn('Deploy Fuji vault', 'fuji-deploy', { disabled });
    }
    if (isAddress(address)) {
      content += row('Vault contract',
        `<a href="${FUJI.explorer}/address/${safe(address)}" target="_blank" rel="noopener noreferrer">View on Fuji</a>`,
        safe(address),
      );
    }
    if (vault && index < 0) {
      content += '<p class="notice warn">This wallet is not a member of the vault. Switch accounts in your wallet.</p>';
    } else if (vault && index >= 0) {
      const now = vault.timestamp;
      const expired = now >= vault.end + REFUND_DELAY;
      const hasPlan = vault.net.length > 0;
      const stalePlan = hasPlan && !matchesFujiDraft(trip, vault);
      const shortage = fujiShortfall(vault, index);
      content += row('Your Fuji vault balance', money(vault.balances[index]));
      if (section === 'wallet') {
        if (vault.usdc <= BigInt(Number.MAX_SAFE_INTEGER)) {
          content += row('Test USDC in your wallet', money(Number(vault.usdc)));
        }
        if (!vault.settled && !expired) controls += btn('Deposit test USDC', 'fuji-deposit', { disabled });
        if (now < vault.start && vault.balances[index] > 0) {
          controls += btn('Withdraw test USDC', 'fuji-withdraw', { tone: 'secondary', disabled });
        }
        if ((vault.settled || expired) && vault.balances[index] > 0) {
          controls += btn('Claim test USDC', 'fuji-claim', { disabled });
        }
        if (!vault.settled && !expired) {
          content += '<p class="notice">Early withdrawal closes at trip start. If settlement is missed, each member can reclaim their own deposit seven days after the trip ends.</p>';
        }
      } else {
        if (hasPlan) {
          content += vault.members.map((member, position) => {
            const amount = vault.net[position];
            const due = fujiShortfall(vault, position);
            const status = vault.approvals[position] ? 'Approved on Fuji' : 'Awaiting approval';
            const label = safe(trip.members[position]?.name || member);
            return row(label, (amount > 0 ? '+' : '') + money(amount),
              status + (!vault.settled && due > 0 ? ' · Top up ' + money(due) : ''),
            );
          }).join('');
        } else {
          content += '<p class="notice">No split published to Fuji. Prepare the local Final split first. The organizer can publish after the trip ends.</p>';
        }
        if (!vault.settled && !expired && now >= vault.end) {
          if (stalePlan) {
            content += '<p class="notice warn">The local split changed. Prepare and publish a replacement before settling.</p>';
          }
          if (index === 0 && fujiDraft(trip)) controls += btn(hasPlan ? 'Review replacement split' : 'Review Fuji split', 'fuji-plan', { disabled });
          if (hasPlan) {
            const hash = 'data-hash="' + safe(vault.hash) + '"';
            controls += btn(vault.approvals[index] ? 'Revoke Fuji approval' : 'Approve Fuji split',
              vault.approvals[index] ? 'fuji-revoke' : 'fuji-approve',
              { data: hash, tone: 'secondary', disabled: disabled || (stalePlan && !vault.approvals[index]) });
            if (shortage > 0 && !stalePlan) {
              controls += btn('Top up ' + money(shortage) + ' on Fuji', 'fuji-top-up', {
                data: hash + ' data-units="' + shortage + '"', disabled,
              });
            }
            if (index === 0) {
              controls += btn('Settle on Fuji', 'fuji-settle', {
                data: hash, disabled: disabled || stalePlan || !vault.approvals.every(Boolean)
                  || vault.members.some((_, position) => fujiShortfall(vault, position) > 0),
              });
            }
          }
        }
        if (vault.settled) content += '<p class="notice green">Settled on Fuji. Claim your test USDC in Wallet.</p>';
        else if (expired) content += '<p class="notice">The settlement window ended. Reclaim any deposit in Wallet.</p>';
        else if (now < vault.end) content += '<p class="notice">Publish and settle after the trip ends. Refresh Fuji to update the status.</p>';
      }
    }
    return `<section class="panel stack">
      <div><h2>${section === 'split' ? 'Fuji settlement' : 'Fuji testnet wallet'}</h2>
        <p class="subtitle">Transactions use test USDC on Avalanche Fuji. Local demo balances are separate.</p>
      </div>
      ${content}
      ${controls ? '<div class="inline">' + controls + '</div>' : ''}

  function handleFujiAction(action, selection) {
    switch (action) {
      case 'fuji-connect': chooseWallet(); break;
      case 'fuji-wallet-option': connectWallet(walletSession.choices[Number(selection.id)]); break;
      case 'fuji-switch': switchToFuji(); break;
      case 'fuji-disconnect': clearWallet(); render(); break;
      case 'fuji-refresh': refreshVault(); break;
      case 'fuji-check': checkFujiTransaction(); break;
      case 'fuji-deploy': openFujiDeploy(); break;
      case 'fuji-deposit': openFujiFunds('deposit'); break;
      case 'fuji-withdraw': openFujiFunds('withdraw'); break;
      case 'fuji-top-up': {
        const units = Number(selection.units);
        if (isHash(selection.hash) && Number.isSafeInteger(units) && units > 0) fujiDeposit(units, selection.hash);
        break;
      }
      case 'fuji-plan': openFujiPlan(currentVault()); break;
      case 'fuji-publish':
      case 'fuji-approve':
      case 'fuji-revoke':
      case 'fuji-settle':
      case 'fuji-claim':
        fujiSettlementAction(action, selection);
        break;
    }
  }


  function readStorage(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch {
      return null;
    }
  }

  function loadWorkspace() {
    const workspace = readStorage(KEY);
    if (Array.isArray(workspace?.trips)) return workspace;

    const legacy = readStorage(LEGACY_KEY);
    if (!Array.isArray(legacy?.trip?.members)) return { trips: [] };
    const trip = legacy.trip;
    trip.id = 'v7-trip';
    trip.minimumUnits = toUnits(trip.minimum);
    trip.depositUnits = Object.fromEntries(trip.members.map(member => [
      member.id, toUnits(trip.deposits?.[member.id] || 0),
    ]));
    delete trip.minimum;
    delete trip.deposits;
    if (trip.settled) {
      trip.reviewQuote = {
        rate: trip.rate, source: 'Saved v7 settlement', updated: '',
        live: false, historical: true,
      };
    } else {
      if (trip.splitApprovals.length) trip.revision++;
      trip.splitApprovals = [];
    }
    delete trip.rate;
    delete trip.rateLocked;
    delete trip.reviewing;
    return { trips: [trip], activeTripId: trip.id, actor: legacy.actor, view: legacy.view };
  }

  function restoreWorkspace(workspace) {
    state.trips = workspace.trips;
    state.trip = state.trips.find(trip => trip.id === workspace.activeTripId) || null;
    state.actor = state.trip?.members.some(member => member.id === workspace.actor)
      ? workspace.actor : state.trip?.owner || null;
    state.view = nav.some(([view]) => view === workspace.view) ? workspace.view : 'overview';
  }

  function save(changedTrip) {
    // Apply changes to the selected trip without rewriting other tabs' trips from a stale list.
    const saved = storageUnavailable ? null : readStorage(KEY);
    const trips = Array.isArray(saved?.trips) ? saved.trips : state.trips.slice();
    if (changedTrip) {
      const index = trips.findIndex(trip => trip.id === changedTrip.id);
      if (index === -1) trips.push(changedTrip);
      else trips[index] = changedTrip;
    }
    state.trips = trips;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        trips, activeTripId: state.trip?.id || null, actor: state.actor, view: state.view,
      }));
      storageUnavailable = false;
    } catch {
      // Keep the current tab usable when the browser disallows local persistence.
      storageUnavailable = true;
      return false;
    }
    return true;
  }

  function syncTrips() {
    if (storageUnavailable) return;
    const saved = readStorage(KEY);
    if (!Array.isArray(saved?.trips)) return;
    state.trips = saved.trips;
    if (!state.trip) return;
    const updated = saved.trips.find(trip => trip.id === state.trip.id);
    if (updated && JSON.stringify(updated) !== JSON.stringify(state.trip)) {
      state.trip = updated;
      if (!member(state.actor)) state.actor = updated.owner;
    }
  }

  function marketQuote() {
    if (marketRequest) return marketRequest;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 7000);
    marketRequest = (async () => {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD', {
          cache: 'no-store', signal: controller.signal,
        });
        if (!response.ok) return null;
        const data = await response.json();
        const rate = data.rates?.VND;
        if (data.result !== 'success' || !Number.isFinite(rate) || rate <= 0) return null;
        return {
          rate, source: 'ExchangeRate-API USD/VND reference',
          updated: data.time_last_update_utc || 'Timestamp unavailable', live: true,
        };
      } catch {
        return null;
      } finally {
        clearTimeout(timeout);
      }
    })().finally(() => { marketRequest = null; });
    return marketRequest;
  }

  function applyMarketQuote(quote) {
    fx = quote || { ...fx, live: false };
    render();
    const sheetStatus = sheet.querySelector('#fx-status');
    if (sheetStatus) sheetStatus.textContent = fxLabel(fx);
  }

  async function refreshFX() {
    applyMarketQuote(await marketQuote());
  }

  function fxLabel(quote) {
    const rate = new Intl.NumberFormat('en-US', { maximumFractionDigits: 8 }).format(quote.rate);
    return [rate + ' VND / USD', quote.source, quote.updated,
      quote.live || quote.historical ? '' : 'not live'].filter(Boolean).join(' · ');
  }

  function phase() {
    const trip = state.trip;
    if (!trip) return '';
    if (trip.settled) return 'Closed';
    const now = Date.now();
    if (now < Date.parse(trip.startTime)) return 'Funding';
    if (now >= Date.parse(trip.endTime)) return 'Closing';
    return trip.members.every(member => depositUnits(trip, member.id) >= trip.minimumUnits)
      ? 'Active' : 'Awaiting funding';
  }

  function toUnits(usdc) {
    return Math.round(usdc * USDC_SCALE);
  }

  function depositUnits(trip, id) {
    return trip.depositUnits[id] || 0;
  }

  function depositOf(id) {
    return depositUnits(state.trip, id) / USDC_SCALE;
  }

  function parseUnits(value) {
    const match = /^(\d*)(?:\.(\d{0,6}))?$/.exec(String(value ?? '').trim());
    if (!match) return null;
    const units = Number(match[1]) * USDC_SCALE + Number((match[2] || '').padEnd(6, '0'));
    return Number.isSafeInteger(units) && units > 0 ? units : null;
  }

  function fmt(n) {
    return new Intl.NumberFormat('en-US', { maximumFractionDigits: 6, minimumFractionDigits: 2 }).format(n || 0);
  }

  function money(units) {
    return fmt(units / USDC_SCALE) + ' USDC';
  }

  function vnd(n){return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₫'}

  function empty(){return `<div class="section-head"><div><h1>Your trips</h1><p>Organize expenses together. Pay in real life, settle net balances with USDC.</p></div></div><section class="panel stack" style="text-align:center;padding:34px 22px"><div style="font-size:44px">✦</div><h2>No trips yet</h2><p class="subtitle">Create your first trip to track who paid for what. Each member deposits USDC before the trip begins.</p><div class="inline" style="justify-content:center">${btn('Create a trip','new-trip',{symbol:'plus'})}${btn('Join a trip','join-trip',{tone:'secondary'})}</div></section><section class="panel"><h2>How TripVault works</h2>${row('1 · Deposit USDC','Minimum + time lock')}${row('2 · Pay merchants externally','VND / cash / bank')}${row('3 · Record and approve bills','VND')}${row('4 · Settle net debt','From deposits in USDC')}</section>`}
  function shares(bill) {
    const count = bill.participants.length;
    const base = Math.floor(bill.amount / count);
    const remainder = bill.amount - base * count;
    return bill.participants.map((id, index) => ({ id, amount: base + (index < remainder ? 1 : 0) }));
  }

  function stats(trip = state.trip) {
    return trip.members.map(member => {
      let paid = 0;
      let owed = 0;
      for (const bill of trip.bills) {
        if (bill.status !== 'approved') continue;
        if (bill.payer === member.id) paid += bill.amount;
        const share = shares(bill).find(item => item.id === member.id);
        if (share) owed += share.amount;
      }
      return { ...member, paid, owed, net: paid - owed };
    });
  }

  function settlementPlan(trip, quote) {
    const balances = stats(trip);
    const debtors = balances.filter(item => item.net < 0).map(item => ({ id: item.id, amount: -item.net }));
    const creditors = balances.filter(item => item.net > 0).map(item => ({ id: item.id, amount: item.net }));
    const transfers = [];
    const due = new Map();
    let debtorIndex = 0;
    let creditorIndex = 0;
    while (debtorIndex < debtors.length && creditorIndex < creditors.length) {
      const debtor = debtors[debtorIndex];
      const creditor = creditors[creditorIndex];
      const vnd = Math.min(debtor.amount, creditor.amount);
      const units = quote.historical
        ? toUnits(Math.round(vnd / quote.rate * 100) / 100)
        : toUnits(vnd / quote.rate);
      transfers.push({ from: debtor.id, to: creditor.id, vnd, units });
      due.set(debtor.id, (due.get(debtor.id) || 0) + units);
      debtor.amount -= vnd;
      creditor.amount -= vnd;
      if (!debtor.amount) debtorIndex++;
      if (!creditor.amount) creditorIndex++;
    }
    const invalid = transfers.some(transfer => !Number.isSafeInteger(transfer.units) || transfer.units <= 0)
      || [...due.values()].some(units => !Number.isSafeInteger(units));
    const shortfalls = [...due].map(([id, units]) => ({
      id, units: units - depositUnits(trip, id),
    })).filter(item => item.units > 0);
    return { transfers, shortfalls, invalid };
  }

  function hasPendingBills(trip) {
    return trip.bills.some(bill => bill.status !== 'approved');
  }

  function invalidateSplit(trip) {
    trip.reviewQuote = null;
    trip.splitApprovals = [];
    trip.revision++;
  }

  function canPrepare(trip) {
    return state.trip === trip && state.actor === trip.owner && !trip.settled
      && !trip.reviewQuote && !hasPendingBills(trip);
  }

  function canUseFallback(review) {
    return review && canPrepare(review.trip) && review.revision === review.trip.revision;
  }

  function lockQuote(trip, quote) {
    trip.reviewQuote = { ...quote };
    trip.splitApprovals = [];
    fallbackReview = null;
    commit(trip);
  }

  async function prepareSplit(trip) {
    if (!canPrepare(trip) || preparingTrip === trip) return;
    fallbackReview = null;
    preparingTrip = trip;
    const revision = trip.revision;
    render();

    const quote = await marketQuote();
    syncTrips();
    if (preparingTrip !== trip) return;
    preparingTrip = null;
    if (canPrepare(trip) && revision === trip.revision) {
      if (quote) {
        fx = quote;
        lockQuote(trip, quote);
        return;
      }
      fallbackReview = { trip, revision, quote: { ...fx, live: false } };
    }
    applyMarketQuote(quote);
  }

  function canSettle(trip, plan) {
    return Boolean(trip.reviewQuote && !trip.settled && state.actor === trip.owner
      && Date.now() >= Date.parse(trip.endTime) && !hasPendingBills(trip)
      && trip.members.every(member => trip.splitApprovals.includes(member.id))
      && !plan.invalid && !plan.shortfalls.length);
  }

  function settle(trip) {
    if (!trip.reviewQuote || trip.settled) return;
    const plan = settlementPlan(trip, trip.reviewQuote);
    if (!canSettle(trip, plan)) {
      if (plan.shortfalls.length) notice('Top up the full outstanding balance before settlement.');
      return;
    }
    const balances = Object.fromEntries(trip.members.map(member => [member.id, depositUnits(trip, member.id)]));
    for (const transfer of plan.transfers) {
      balances[transfer.from] -= transfer.units;
      balances[transfer.to] += transfer.units;
    }
    if (!Object.values(balances).every(units => Number.isSafeInteger(units) && units >= 0)) {
      notice('Settlement could not be completed with the current balances.');
      return;
    }
    trip.depositUnits = balances;
    trip.settled = true;
    commit(trip, 'Demo settlement completed. Claim remaining USDC in Wallet.');
  }

  function split() {

    const transfers = plan.transfers.map(transfer => row(
      safe(member(transfer.from).name) + ' → ' + safe(member(transfer.to).name),

    const quoteStatus = quote ? (quote.historical ? 'Historical rate' : 'Locked for approval') : 'Estimate';

    return `
      <div class="section-head">
        <div><h1>Final split</h1><p>${safe(trip.name)}</p></div>

          ${!settled && !quote && !pending && !organizer ? '<p class="notice">The organizer prepares the split and locks the rate for approval.</p>' : ''}
          ${fallback}${shortfalls}
          ${!settled && plan.invalid ? '<p class="notice warn">The current transfers cannot be represented in USDC. Reopen the split and check the rate before settling.</p>' : ''}

            'Paid ' + vnd(item.paid) + ' · Owes ' + vnd(item.owed)

    [/^([\d.]+ ₫) equivalent$/, (_, amount) => 'Tương đương ' + amount],
    [/^(Approved|Waiting for approval) · Top up ([\d.,]+ USDC)$/, (_, status, amount) => ui(status) + ' · Nạp thêm ' + amount],
    [/^Requested ([\d.,]+ USDC)$/, (_, amount) => 'Yêu cầu nạp ' + amount],
    [/^Requested ([\d.,]+ USDC)\. Check the current amount before adding funds\.$/, (_, amount) => 'Yêu cầu nạp ' + amount + '. Hãy kiểm tra số tiền hiện tại trước khi nạp.'],
    [/^([\d.,]+ USDC) still needed$/, (_, amount) => 'Còn thiếu ' + amount],
    [/^(\d+) of (\d+) agreed to remove this bill\.$/, (_, count, total) => count + '/' + total + ' người đã đồng ý bỏ hóa đơn này.'],
    [/^Automatically approves at (.+) if nobody requests changes or asks to remove it\.$/, (_, date) => 'Hóa đơn tự duyệt lúc ' + date + ' nếu không ai yêu cầu sửa hoặc bỏ.'],
    [/^Remind (.+) to top up$/, (_, name) => 'Nhắc ' + name + ' nạp thêm'],
    [/^Room code (.+)$/, (_, code) => 'Mã mời ' + code],
    [/^Delete trip (.+)$/, (_, name) => 'Xóa chuyến đi ' + name],
    [/^Top up ([\d.,]+ USDC)$/, (_, amount) => 'Nạp thêm ' + amount],
    [/^Send ([\d.,]+ USDC) to my wallet$/, (_, amount) => 'Chuyển ' + amount + ' về ví của tôi'],
    [/^(Pays|Gets) ([\d.,]+ USDC)$/, (_, kind, amount) => (kind === 'Pays' ? 'Trả ' : 'Nhận ') + amount],
    [/^(Confirmed|Pending|Declined|Failed) · (.+)$/, (_, status, action) => ui(status) + ' · ' + ui(action)],
    [/^(Deposit|Approve|Withdraw) ([\d.,]+ USDC)$/, (_, action, amount) => ({ Deposit: 'Nạp ', Approve: 'Cho phép dùng ', Withdraw: 'Rút ' })[action] + amount],
    [/^Split type: (.+)$/, (_, type) => 'Kiểu chia: ' + ui(type)],
  ];

  function ui(value) {
    if (siteLanguage !== 'vi' || typeof value !== 'string') return value;
    const key = value.trim().replace(/\s+/g, ' ');
    if (!key) return value;
    let translated = vietnameseUI.get(key);
    if (translated === undefined) {
      for (const [pattern, replacement] of vietnamesePatterns) {
        if (!pattern.test(key)) continue;
        translated = key.replace(pattern, replacement);
        break;
      }
    }
    if (translated === undefined) return value;
    return value.match(/^\s*/)[0] + translated + value.match(/\s*$/)[0];
  }

  function localizeUI(root) {
    if (siteLanguage !== 'vi' || !root?.childNodes) return;
    for (const node of root.childNodes) {
      if (node.nodeType === 3) {
        node.nodeValue = ui(node.nodeValue);
      } else if (node.nodeType === 1 && !node.matches('[translate="no"], [data-site-language], [aria-hidden="true"], script, style')) {
        for (const attribute of ['aria-label', 'placeholder', 'title']) {
          if (node.hasAttribute(attribute)) node.setAttribute(attribute, ui(node.getAttribute(attribute)));
        }
        localizeUI(node);
      }
    }
  }

  function userText(value) {
    return siteLanguage === 'vi' ? '<span translate="no">' + safe(value) + '</span>' : safe(value);
  }

  function sheetText(value) {
    return typeof value === 'object' && value?.user !== undefined ? userText(value.user) : safe(value);
  }

  function siteLanguageSelect() {
    return '<span class="language-select">'
      + '<svg class="lang-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20M12 2a14.5 14.5 0 0 1 0 20M2 12h20"></path></svg>'
      + '<select class="ui-language" data-site-language aria-label="' + ui('Language') + '">'
      + '<option value="en" lang="en"' + (siteLanguage === 'en' ? ' selected' : '') + ' title="English">EN</option>'
      + '<option value="vi" lang="vi"' + (siteLanguage === 'vi' ? ' selected' : '') + ' title="Tiếng Việt">VI</option></select></span>';
  }

  document.addEventListener('change', event => {
    const field = event.target;
    if (!field?.matches?.('[data-site-language]') || !['en', 'vi'].includes(field.value)) return;
    siteLanguage = field.value;
    try { localStorage.setItem(SITE_LANGUAGE_KEY, JSON.stringify(siteLanguage)); } catch {}
    render();
    app.querySelector?.('[data-site-language]')?.focus();
  });

  function readStorage(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch {
      return null;
    }
  }

  function loadWorkspace() {
    const workspace = readStorage(KEY);
    if (Array.isArray(workspace?.trips)) return workspace;

    const legacy = demoMode ? null : readStorage(LEGACY_KEY);
    if (!Array.isArray(legacy?.trip?.members)) return { trips: [] };
    const trip = legacy.trip;
    trip.id = 'v7-trip';
    trip.minimumUnits = toUnits(trip.minimum);
    trip.depositUnits = Object.fromEntries(trip.members.map(member => [
      member.id, toUnits(trip.deposits?.[member.id] || 0),
    ]));
    delete trip.minimum;
    delete trip.deposits;
    if (trip.settled) {
      trip.reviewQuote = {
        rate: trip.rate, source: 'Saved v7 settlement', updated: '',
        live: false, historical: true,
      };
    } else {
      if (trip.splitApprovals.length) trip.revision++;
      trip.splitApprovals = [];
    }
    delete trip.rate;
    delete trip.rateLocked;
    delete trip.reviewing;
    return { trips: [trip], activeTripId: trip.id, actor: legacy.actor, view: legacy.view };
  }

  function restoreWorkspace(workspace) {
    state.trips = workspace.trips;
    state.trip = state.trips.find(trip => trip.id === workspace.activeTripId) || null;
    state.actor = state.trip?.members.some(member => member.id === workspace.actor)
      ? workspace.actor : state.trip?.owner || null;
    state.view = nav.some(([view]) => view === workspace.view) ? workspace.view : 'overview';
  }

  function save(changedTrip) {
    // Apply changes to the selected trip without rewriting other tabs' trips from a stale list.
    if (changedTrip?.shared) return true;
    const saved = storageUnavailable ? null : readStorage(KEY);
    const trips = Array.isArray(saved?.trips) ? saved.trips : state.trips.slice();
    if (changedTrip) {
      const index = trips.findIndex(trip => trip.id === changedTrip.id);
      if (index === -1) trips.push(changedTrip);
      else trips[index] = changedTrip;
    }
    state.trips = trips;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        trips, activeTripId: state.trip?.shared ? null : state.trip?.id || null, actor: state.actor, view: state.view,
      }));
      storageUnavailable = false;
    } catch {
      // Keep the current tab usable when the browser disallows local persistence.
      storageUnavailable = true;
      return false;
    }
    return true;
  }

  function syncTrips() {
    if (storageUnavailable) return;
    const saved = readStorage(KEY);
    if (!Array.isArray(saved?.trips)) return;
    state.trips = saved.trips;
    if (!state.trip) return;
    const updated = saved.trips.find(trip => trip.id === state.trip.id);
    if (updated && JSON.stringify(updated) !== JSON.stringify(state.trip)) {
      state.trip = updated;
      if (!member(state.actor)) state.actor = updated.owner;
    }
  }

  function marketQuote() {
    if (marketRequest) return marketRequest;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 7000);
    marketRequest = (async () => {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD', {
          cache: 'no-store', signal: controller.signal,
        });
        if (!response.ok) return null;
        const data = await response.json();
        const rate = data.rates?.VND;
        if (data.result !== 'success' || !Number.isFinite(rate) || rate <= 0) return null;
        return {
          rate, source: 'ExchangeRate-API USD/VND reference',
          updated: data.time_last_update_utc || 'Timestamp unavailable', live: true,
        };
      } catch {
        return null;
      } finally {
        clearTimeout(timeout);
      }
    })().finally(() => { marketRequest = null; });
    return marketRequest;
  }

  function applyMarketQuote(quote) {
    fx = quote || { ...fx, live: false };
    render();
    const sheetStatus = sheet.querySelector('#fx-status');
    if (sheetStatus) sheetStatus.textContent = fxLabel(fx);
  }

  async function refreshFX() {
    applyMarketQuote(await marketQuote());
  }

  function formatFxShortTime(raw) {
    if (!raw) return '';
    const d = new Date(raw);
    if (!isNaN(d.getTime())) {
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    return String(raw);
  }

  function fxLabel(quote) {
    const rate = new Intl.NumberFormat('en-US', { maximumFractionDigits: 8 }).format(quote.rate);
    const shortSource = quote.source ? quote.source.replace(/\s+USD\/VND\s+reference/i, '').replace(/\s+reference/i, '') : '';
    const shortTime = quote.updated ? formatFxShortTime(quote.updated) : '';
    const notLiveLabel = quote.live || quote.historical ? '' : 'not live';
    return [rate + ' VND / USD', shortSource, shortTime, notLiveLabel].filter(Boolean).join(' · ');
  }

  function phase() {
    const trip = state.trip;
    if (!trip) return '';
    if (trip.settled) return 'Closed';
    const now = Date.now();
    if (now < Date.parse(trip.startTime)) return 'Funding';
    if (now >= Date.parse(trip.endTime)) return 'Closing';
    return trip.members.every(member => depositUnits(trip, member.id) >= trip.minimumUnits)
      ? 'Active' : 'Awaiting funding';
  }

  function toUnits(usdc) {
    return Math.round(usdc * USDC_SCALE);
  }

  function depositUnits(trip, id) {
    return trip.depositUnits[id] || 0;
  }

  function depositOf(id) {
    return depositUnits(state.trip, id) / USDC_SCALE;
  }

  function parseUnits(value) {
    const match = /^(\d*)(?:\.(\d{0,6}))?$/.exec(String(value ?? '').trim());
    if (!match) return null;
    const units = Number(match[1]) * USDC_SCALE + Number((match[2] || '').padEnd(6, '0'));
    return Number.isSafeInteger(units) && units > 0 ? units : null;
  }

  function fmt(n) {
    return new Intl.NumberFormat('en-US', { maximumFractionDigits: 6, minimumFractionDigits: 2 }).format(n || 0);
  }

  function money(units) {
    return fmt(units / USDC_SCALE) + ' USDC';
  }
  function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function vnd(n){return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₫'}
  function icon(n){return `<span class="icon i-${n}" aria-hidden="true"></span>`}
  function brand(){return '<span class="wordmark"><span class="brand-mark" aria-hidden="true"></span>TripVault</span>'}
  function btn(label,action,opts={}){return `<button type="button" class="btn ${opts.tone||''}" data-act="${action}" ${opts.data||''} ${opts.disabled?'disabled':''}>${opts.symbol?icon(opts.symbol):''}${safe(label)}</button>`}
  function member(id){return state.trip?.members.find(m=>m.id===id)}
  function avatar(m){return `<span class="avatar tone-${state.trip.members.indexOf(m)%4}">${safe(m.name.slice(0,1).toUpperCase())}</span>`}
  function notice(s){toast.textContent=ui(s);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}
  function sheetOpen(title,subtitle,body,footer='',language=null){sheet.lang=language || siteLanguage;sheet.innerHTML=`<header class="sheet-head"><div><h2 id="sheet-title">${sheetText(title)}</h2><p>${sheetText(subtitle)}</p></div>${btn('×','close-sheet',{tone:'secondary'})}</header><div class="sheet-body">
  <div class="notice" data-sheet-notification hidden><p role="status"></p>${btn('Open notifications', 'room-notifications', { tone: 'secondary' })}</div>
  ${body}
</div>${footer?`<footer class="sheet-footer">${footer}</footer>`:''}`;if(!language)localizeUI(sheet);if(!sheet.open)sheet.showModal();sheet.scrollTop=0}
  function row(label,value,sub=''){return `<div class="row"><span class="row-label"><span><span class="row-name">${label}</span>${sub?`<span class="row-sub">${sub}</span>`:''}</span></span><strong>${value}</strong></div>`}
  function navHtml(cls){return `<nav class="${cls}" aria-label="Trip navigation">${nav.map(([id,label,sym])=>`<button type="button" class="nav-btn" data-act="navigate" data-view="${id}" ${state.view===id?'aria-current="page"':''}>${icon(sym)}${label}</button>`).join('')}</nav>`}
  function empty(){return `<div class="section-head"><div><h1>Your trips</h1><p>Organize expenses together. Pay in real life, settle net balances with USDC.</p></div></div><section class="panel stack" style="text-align:center;padding:34px 22px"><div style="font-size:44px">✦</div><h2>No trips yet</h2><p class="subtitle">Create your first trip to track who paid for what. Each member deposits USDC before the trip begins.</p><div class="inline" style="justify-content:center">${btn('Create a trip','new-trip',{symbol:'plus'})}${btn('Join a trip','join-trip',{tone:'secondary'})}${btn('Explore demo trip','judge-demo-sample',{tone:'secondary'})}</div></section><section class="panel"><h2>How TripVault works</h2>${row('1 · Deposit USDC','Minimum + time lock')}${row('2 · Pay merchants externally','VND / cash / bank')}${row('3 · Record and approve bills','VND')}${row('4 · Settle net debt','From deposits in USDC')}</section>`}
  function shares(bill) {
    if (bill && bill.splitType === 'custom' && bill.customShares && typeof bill.customShares === 'object') {
      return (bill.participants || []).map(id => ({ id, amount: Math.round(Number(bill.customShares[id]) || 0) }));
    }
    const count = bill.participants.length;
    const base = Math.floor(bill.amount / count);
    const remainder = bill.amount - base * count;
    return bill.participants.map((id, index) => ({ id, amount: base + (index < remainder ? 1 : 0) }));
  }

  function stats(trip = state.trip) {
    return trip.members.map(member => {
      let paid = 0;
      let owed = 0;
      for (const bill of trip.bills) {
        if (bill.status !== 'approved') continue;
        if (bill.payer === member.id) paid += bill.amount;
        const share = shares(bill).find(item => item.id === member.id);
        if (share) owed += share.amount;
      }
      return { ...member, paid, owed, net: paid - owed };
    });
  }

  function settlementPlan(trip, quote) {
    const balances = stats(trip);
    const debtors = balances.filter(item => item.net < 0).map(item => ({ id: item.id, amount: -item.net }));
    const creditors = balances.filter(item => item.net > 0).map(item => ({ id: item.id, amount: item.net }));
    const transfers = [];
    const due = new Map();
    let debtorIndex = 0;
    let creditorIndex = 0;
    while (debtorIndex < debtors.length && creditorIndex < creditors.length) {
      const debtor = debtors[debtorIndex];
      const creditor = creditors[creditorIndex];
      const vnd = Math.min(debtor.amount, creditor.amount);
      const units = quote.historical
        ? toUnits(Math.round(vnd / quote.rate * 100) / 100)
        : toUnits(vnd / quote.rate);
      transfers.push({ from: debtor.id, to: creditor.id, vnd, units });
      due.set(debtor.id, (due.get(debtor.id) || 0) + units);
      debtor.amount -= vnd;
      creditor.amount -= vnd;
      if (!debtor.amount) debtorIndex++;
      if (!creditor.amount) creditorIndex++;
    }
    const invalid = transfers.some(transfer => !Number.isSafeInteger(transfer.units) || transfer.units <= 0)
      || [...due.values()].some(units => !Number.isSafeInteger(units));
    const shortfalls = [...due].map(([id, units]) => ({
      id, units: units - depositUnits(trip, id),
    })).filter(item => item.units > 0);
    return { transfers, shortfalls, invalid };
  }

  function hasPendingBills(trip) {
    return trip.bills.some(bill => bill.status !== 'approved' && (!(trip.shared || isDemoTrip(trip)) || bill.status !== 'rejected'));
  }

  function invalidateSplit(trip) {
    trip.reviewQuote = null;
    trip.splitApprovals = [];
    trip.revision++;
  }

  function canPrepare(trip) {
    return state.trip === trip && state.actor === trip.owner && !trip.settled
      && !trip.reviewQuote && !hasPendingBills(trip) && (!(trip.shared || isDemoTrip(trip)) || roomBillsClosed(trip)) && canReviewFundedTrip(trip);
  }

  function canUseFallback(review) {
    return review && canPrepare(review.trip) && review.revision === review.trip.revision;
  }

  function lockQuote(trip, quote) {
    if (trip.shared) {
      fallbackReview = null;
      changeRoom(trip, 'split.lock', { quote });
      return;
    }
    trip.reviewQuote = { ...quote };
    trip.demoPublishedRevision = null;
    trip.splitApprovals = [];
    fallbackReview = null;
    commit(trip);
  }

  async function prepareSplit(trip) {
    if (!canPrepare(trip) || preparingTrip === trip) return;
    fallbackReview = null;
    preparingTrip = trip;
    const revision = trip.revision;
    render();

    const quote = demoMode ? { rate: 25000, source: 'Fixed demo rate', updated: '', live: false, historical: false } : await marketQuote();
    syncTrips();
    if (preparingTrip !== trip) return;
    preparingTrip = null;
    if (canPrepare(trip) && revision === trip.revision) {
      if (quote) {
        if (!demoMode) fx = quote;
        lockQuote(trip, quote);
        return;
      }
      fallbackReview = { trip, revision, quote: { ...fx, live: false } };
    }
    applyMarketQuote(quote);
  }

  function canSettle(trip, plan) {
    return Boolean(trip.reviewQuote && !trip.settled && state.actor === trip.owner
      && (!isDemoTrip(trip) || trip.demoPublishedRevision === trip.revision)
      && Date.now() >= roomEndTime(trip) && !hasPendingBills(trip)
      && trip.members.every(member => trip.splitApprovals.includes(member.id))
      && !plan.invalid && !plan.shortfalls.length);
  }

  function settle(trip) {
    if (!trip.reviewQuote || trip.settled) return;
    const plan = settlementPlan(trip, trip.reviewQuote);
    if (!canSettle(trip, plan)) {
      if (plan.shortfalls.length) notice('Top up the full outstanding balance before settlement.');
      return;
    }
    const balances = Object.fromEntries(trip.members.map(member => [member.id, depositUnits(trip, member.id)]));
    for (const transfer of plan.transfers) {
      balances[transfer.from] -= transfer.units;
      balances[transfer.to] += transfer.units;
    }
    if (!Object.values(balances).every(units => Number.isSafeInteger(units) && units >= 0)) {
      notice('Settlement could not be completed with the current balances.');
      return;
    }
    trip.depositUnits = balances;
    trip.settled = true;
    trip.settledAt = Date.now();
    trip.demoPayouts = { ...balances };
    commit(trip, 'Demo settlement completed. Claim remaining USDC in Wallet.');
  }
  function tripsScreen() {
    const trips = state.trips.slice().reverse();
    const list = trips.map(trip => `

        <span class="row-label">
          <span class="bill-badge">${icon('home')}</span>
          <span>
            <span class="bill-name">${safe(trip.name)}</span>
            <span class="bill-sub">${trip.members.length} travelers · ${trip.settled ? 'Settled' : 'Open'}${trip.location ? ' · ' + safe(trip.location) : ''}</span>
          </span>
        </span>
        <span class="row-value">Open</span>
      </button>`).join('');
    return `
      <div class="section-head">
        <div><h1>Your trips</h1><p>Record shared expenses and settle net balances in USDC.</p></div>
        ${btn('Create a trip', 'new-trip', { symbol: 'plus' })}
      </div>

  let guideLanguage;
  let guideStep = 0;
  let guideOpen = false;
  let pendingGuideInvite = '';
  const joinedRoomGuides = new Set();

  function showGuide() {
    const preferred = guideLanguage || readStorage(GUIDE_LANGUAGE_KEY) || readStorage(SITE_LANGUAGE_KEY);
    const browserLanguage = globalThis.navigator?.language || 'vi';
    const language = preferred === 'vi' || preferred === 'en'
      ? preferred : browserLanguage.toLowerCase().startsWith('vi') ? 'vi' : 'en';
    const guide = GUIDE_CONTENT[language];
    const step = guide.steps[guideStep];
    const last = guideStep === guide.steps.length - 1;
    const languageOptions = [['vi', 'Tiếng Việt'], ['en', 'English']].map(([code, label]) =>
      btn(label, 'guide-language', {
        tone: code === language ? 'soft' : 'secondary',
        data: `data-id="${code}" lang="${code}" aria-pressed="${code === language}"`,
      }),
    ).join('');
    const previous = guideStep > 0
      ? btn(guide.back, 'guide-step', { tone: 'secondary', data: `data-id="${guideStep - 1}"` }) : '';
    const next = last
      ? btn(guide.close, 'close-sheet', { data: 'autofocus' })
      : btn(guide.next, 'guide-step', { data: `data-id="${guideStep + 1}" autofocus` });
    const skip = last ? '' : btn(guide.skip, 'close-sheet', { tone: 'ghost' });
    const stepImage = (GUIDE_PICTURES.length >= 5
      ? [GUIDE_PICTURES[0], GUIDE_PICTURES[1], GUIDE_PICTURES[3], GUIDE_PICTURES[4]][guideStep]
      : GUIDE_PICTURES[guideStep]) || GUIDE_PICTURES[0];
    
    sheet?.classList?.add('guide-modal');
    sheetOpen(guide.title, guide.subtitle,
      `<div class="guide-toolbar">
        <div class="inline" role="group" aria-label="${guide.language}">${languageOptions}</div>
        <span class="chip">${guide.progress(guideStep + 1, guide.steps.length)}</span>
       </div>
       <figure class="guide-illustration">
        <img src="${stepImage}" alt="${safe(step.alt)}" width="968" height="408">
       </figure>
       <div class="guide-description">
        <h3 id="guide-step-title" tabindex="-1">${step.title}</h3>
        <div class="guide-copy">${step.copy}</div>
       </div>`,
      `<div class="guide-actions">${skip}${previous}${next}</div>`,
      language,
    );
  }

  function openGuide() {
    guideStep = 0;
    guideOpen = true;
    showGuide();
  }

  function dismissGuide() {
    guideOpen = false;
    sheet?.classList?.remove('guide-modal');
    sheet.close();
    const invite = pendingGuideInvite;
    pendingGuideInvite = '';
    if (invite) startRoomFlow('join', invite);
  }

  document.addEventListener('cancel', event => {
    if (event.target !== sheet || !guideOpen) return;
    event.preventDefault();
    dismissGuide();
  }, true);

  function moveGuide(value) {
    const step = Number(value);
    if (!Number.isInteger(step) || step < 0 || step >= 4) return;
    guideStep = step;
    showGuide();
    sheet.querySelector('#guide-step-title')?.focus();
  }

  function setGuideLanguage(language) {
    if (language !== 'vi' && language !== 'en') return;
    guideLanguage = language;
    try {
      localStorage.setItem(GUIDE_LANGUAGE_KEY, JSON.stringify(language));
    } catch {
      // Keep the current choice when the browser disallows saving preferences.
    }
    showGuide();

      if (csView) csView.style.display = isCustom ? '' : 'none';

      if (!isCustom) {
        if (t.shared) updateBillFundingForm();
        return;
      }

      const inputs = form.querySelectorAll('.custom-share-input');
      let sum = 0;
      inputs.forEach(inp => {
        const id = inp.dataset.customMember;
        const val = Number(inp.value) || 0;
        sum += val;
        const pctEl = form.querySelector(`.custom-share-pct[data-member-pct="${id}"]`);
        if (pctEl) {
          const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0.0';
          pctEl.textContent = `${pct}% (${vnd(val)})`;
        }
      });

      const statusEl = form.querySelector('#custom-split-status');
      if (statusEl) {
        if (total <= 0) {
          statusEl.textContent = vi ? 'Nhập tổng hóa đơn trước' : 'Enter bill amount first';
          statusEl.style.color = 'var(--muted)';
        } else if (sum === total) {
          statusEl.textContent = `✅ ${vi ? 'Đã chia đủ:' : 'Matched:'} ${vnd(sum)} (100%)`;
          statusEl.style.color = 'var(--positive)';
        } else if (sum < total) {
          statusEl.textContent = `⚠️ ${vi ? 'Còn thiếu:' : 'Remaining:'} ${vnd(total - sum)}`;
          statusEl.style.color = 'var(--warning)';
        } else {
          statusEl.textContent = `❌ ${vi ? 'Dư:' : 'Excess:'} ${vnd(sum - total)}`;
          statusEl.style.color = 'var(--danger)';
        }
      }
      if (t.shared) updateBillFundingForm();
    };

    form.addEventListener('input', updateCustomSplitMath);
    form.addEventListener('change', updateCustomSplitMath);

    const autofillBtn = form.querySelector('.custom-split-autofill');
    if (autofillBtn) {
      autofillBtn.addEventListener('click', () => {
        const total = Number(form.querySelector('#bill-amount-input')?.value) || 0;
        if (total <= 0) return;
        const inputs = Array.from(form.querySelectorAll('.custom-share-input'));
        const emptyInputs = inputs.filter(inp => !(Number(inp.value) > 0));
        let filledSum = 0;
        inputs.forEach(inp => { if (Number(inp.value) > 0) filledSum += Number(inp.value); });
        const remaining = total - filledSum;
        const targets = emptyInputs.length > 0 ? emptyInputs : inputs;
        const base = Math.floor((emptyInputs.length > 0 ? remaining : total) / targets.length);
        const rem = (emptyInputs.length > 0 ? remaining : total) - base * targets.length;
        targets.forEach((inp, idx) => {
          inp.value = Math.max(0, base + (idx < rem ? 1 : 0));
        });
        updateCustomSplitMath();
      });
    }

    updateCustomSplitMath();
    if (t.shared) updateBillFundingForm();
  }
}
  function detail(id){if(state.trip?.shared || isDemoTrip())return roomBillDetail(id);const b=state.trip.bills.find(b=>b.id===id);if(!b)return;const t=state.trip,canApprove=t.approvalMode==='everyone'?true:state.actor===t.owner;const approved=b.approvals.includes(state.actor);const required=t.approvalMode==='everyone'?t.members.length:1;sheetOpen(b.label,`Paid outside · ${b.participants.length} travelers`,`<div class="stack"><div class="metric"><strong>${vnd(b.amount)}</strong></div>${row('Paid by',safe(member(b.payer).name))}${row('Payment method','Outside TripVault')}${row('Status',b.status==='approved'?'Approved':`Pending · ${b.approvals.length}/${required}`)}<div class="split-preview"><p><strong>Equal split</strong></p>${shares(b).map(s=>row(safe(member(s.id).name),vnd(s.amount))).join('')}</div><section class="panel"><h2>Bill approvals</h2>${(t.approvalMode==='everyone'?t.members:[member(t.owner)]).map(m=>row(safe(m.name),b.approvals.includes(m.id)?'Approved':'Pending')).join('')}<div class="inline" style="margin-top:14px">${!t.settled&&canApprove?(approved?btn('Cancel my approval','revoke-bill',{tone:'danger cancel-approval',data:`data-id="${b.id}"`}):btn('Approve bill','approve-bill',{data:`data-id="${b.id}"`})) : ''}</div></section><p class="notice">The bill can be approved or revoked until the final settlement is completed.</p></div>`)}

  function formatShortDateTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso).replace('T', ' ');
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${day}/${month} ${hours}:${mins}`;
    } catch {
      return String(iso).replace('T', ' ');
    }
  }

  function formatFxReference(quote) {
    if (!quote || !quote.rate) return ui('Reference rate unavailable');
    const rounded = new Intl.NumberFormat(siteLanguage === 'vi' ? 'vi-VN' : 'en-US', {
      maximumFractionDigits: 0,
    }).format(quote.rate);
    const source = quote.source || '';
    const time = quote.updated ? formatFxShortTime(quote.updated) : '';
    const details = [source, time].filter(Boolean).join(' · ');
    return ui('Reference rate') + ' · ' + rounded + ' VND / USD' + (details ? ' · ' + details : '');
  }

  function updateBill(bill, approve) {
    const trip = state.trip;
    if (trip.settled || (!trip.shared && trip.approvalMode === 'organizer' && state.actor !== trip.owner)) return;
    if (!trip.shared && bill.approvals.includes(state.actor) === approve) return;
    if (trip.shared || isDemoTrip(trip)) {
      changeRoom(trip, 'bill.approve', { id: bill.id, approve }, updated => {
        if (updated) {
          detail(bill.id);
          notice('Your approval was saved.');
        }
      }, showBillReviewError);
      return;
    }
    bill.approvals = approve
      ? [...bill.approvals, state.actor]
      : bill.approvals.filter(id => id !== state.actor);
    const required = trip.approvalMode === 'everyone' ? trip.members.map(member => member.id) : [trip.owner];
    bill.status = required.every(id => bill.approvals.includes(id)) ? 'approved' : 'pending';
    invalidateSplit(trip);
    sheet.close();
    commit(trip);
    detail(bill.id);
  }

  function createTrip(data, fail) {
    const name = String(data.get('name') || '').trim();
    const location = String(data.get('location') || '').trim();
    const names = [String(data.get('yourname') || '').trim(),
      ...String(data.get('others') || '').split('\n').map(item => item.trim()).filter(Boolean)];
    const minimumUnits = parseUnits(data.get('minimum'));
    const startTime = String(data.get('startTime') || '');
    const endTime = String(data.get('endTime') || '');
    const start = Date.parse(startTime);
    const end = Date.parse(endTime);
    if (!name || !names[0] || names.length > 12 || new Set(names.map(item => item.toLowerCase())).size !== names.length
      || !minimumUnits || !Number.isFinite(start) || !Number.isFinite(end) || start <= Date.now() || start >= end) {
      fail('Enter valid trip details, unique member names (up to 12), a positive minimum, and future start/end times.');
      return;
    }
    const members = names.map((memberName, index) => ({ id: 'm' + index, name: memberName }));
    const trip = {
      id: globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + '-' + Math.random().toString(36).slice(2),
      name, location, owner: 'm0', members, minimumUnits, startTime, endTime,
      depositUnits: Object.fromEntries(members.map(item => [item.id, 0])),
      approvalMode: data.get('mode') === 'everyone' ? 'everyone' : 'organizer',
      bills: [], nextBillId: 1, splitApprovals: [], revision: 1, reviewQuote: null, settled: false,
    };
    state.trip = trip;
    state.actor = trip.owner;
    state.view = 'overview';
    fallbackReview = null;
    sheet.close();
    commit(trip, 'Trip created. Deposit USDC before the start.');
  }

  function quickTopUp(trip, selection) {
    const changed = () => {
      render();
      notice('The top-up amount changed. Check the current amount before trying again.');
    };
    if (selection.trip !== trip.id || selection.member !== state.actor
      || selection.revision !== String(trip.revision) || !trip.reviewQuote
      || trip.settled || hasPendingBills(trip)) {
      changed();
      return;
    }
    const plan = settlementPlan(trip, trip.reviewQuote);
    const shortfall = plan.shortfalls.find(item => item.id === state.actor);
    if (plan.invalid || !shortfall || selection.units !== String(shortfall.units)) {
      changed();
      return;
    }
    updateFunds(trip, 'deposit', shortfall.units, notice,
      'Demo top-up recorded: ' + money(shortfall.units));
  }

  function updateFunds(trip, kind, units, fail, message) {
    if (isDemoTrip(trip)) {
      const funding = demoFunding(trip);
      const locked = Date.now() >= Math.min(Date.parse(trip.depositDeadline || trip.startTime), roomEndTime(trip));
      if (!demoFundReady(trip) || funding.closed || (kind === 'withdraw' && locked)
        || (kind === 'deposit' && trip.depositDeadline && funding.deadlineReached && !funding.started)) {
        return fail('Invalid amount or this vault action is unavailable.');
      }
    }
    const existing = depositUnits(trip, state.actor);
    if (!units || trip.settled || !['withdraw', 'deposit'].includes(kind)
      || (kind === 'withdraw' && (phase() !== 'Funding' || units > existing))) {
      fail('Invalid amount or this vault action is unavailable.');
      return;
    }
    const balance = existing + (kind === 'deposit' ? units : -units);
    const total = Object.values(trip.depositUnits).reduce((sum, amount) => sum + amount, 0) - existing + balance;
    if (!Number.isSafeInteger(total)) {
      fail('This amount exceeds the vault balance limit.');
      return;
    }
    trip.depositUnits[state.actor] = balance;
    if (isDemoTrip(trip) && trip.members.every(person => depositUnits(trip, person.id) >= trip.minimumUnits)) {
      trip.demoFundedAt ||= Date.now();
    }
    if (sheet.open) sheet.close();
    commit(trip, message || (kind === 'deposit' ? 'Demo deposit recorded' : 'Demo withdrawal recorded'));
  }

  function recordBill(trip, data, fail) {
    const label = String(data.get('label') || '').trim();
    const amount = Number(data.get('amount'));
    const payer = data.get('payer');
    const splitType = data.get('split_type') || 'equal';
    const vi = siteLanguage === 'vi';
    let participants = [];
    let customShares = null;

    if (splitType === 'custom') {
      customShares = {};
      let sum = 0;
      for (const m of trip.members) {
        const val = Number(data.get('custom_share_' + m.id)) || 0;
        if (val > 0) {
          customShares[m.id] = Math.round(val);
          participants.push(m.id);
          sum += customShares[m.id];
        }
      }
      if (sum !== amount) {
        fail(vi ? 'Tổng số tiền chia (' + vnd(sum) + ') phải bằng tổng hóa đơn (' + vnd(amount) + ')'
          : 'The sum of custom shares (' + vnd(sum) + ') must equal the total bill amount (' + vnd(amount) + ')');
        return;
      }
    } else {
      participants = data.getAll('participant');
    }

    if (trip.settled || !label || !Number.isSafeInteger(amount) || amount <= 0 || amount > 1e9
      || !member(payer) || !participants.length || new Set(participants).size !== participants.length
      || participants.some(id => !member(id))) {
      fail('Enter a valid amount, payer and at least one participant for an open trip.');
      return;
    }

    if (trip.shared || isDemoTrip(trip)) {
      const id = Number(data.get('editing'));
      changeRoom(trip, id ? 'bill.edit' : 'bill.add', { id, label, amount, payer, participants, splitType, customShares }, updated => {
        if (!updated) return;
        if (sheet.open) sheet.close();
        state.view = 'bills';
        render();
        notice(id ? 'Bill updated. A new 24-hour review has started.' : 'Bill posted for review.');
      }, fail);
      return;
    }

    trip.bills.push({ id: trip.nextBillId++, label, amount, payer, participants, splitType, customShares, approvals: [], status: 'pending' });
    invalidateSplit(trip);
    sheet.close();
    state.view = 'bills';
    commit(trip, 'Bill recorded. Waiting for approval.');
  }

  document.addEventListener('submit', event => {
    const form = event.target;
    // A form control named id can shadow the form's id property.
    const formId = form.getAttribute('id');
    if (!['create-form', 'fund-form', 'bill-form', 'fuji-deploy-form', 'fuji-funds-form', 'fuji-link-form', 'room-form', 'bill-feedback-form', 'bill-cancellation-form', 'room-rename-form'].includes(formId)) return;
    event.preventDefault();
    syncTrips();
    const data = new FormData(form);
    const fail = message => { form.querySelector('#sheet-error').textContent = ui(message); };
    if (formId === 'room-form') submitRoomForm(data, fail);
    else if (formId === 'bill-feedback-form') submitBillFeedback(data, fail);
    else if (formId === 'bill-cancellation-form') submitBillCancellation(data, fail);
    else if (formId === 'room-rename-form') submitRoomRename(data, fail);
    else if (formId === 'fuji-link-form') linkExistingVault(data, fail);
    else if (formId === 'fuji-deploy-form') deployFuji(data, fail);
    else if (formId === 'fuji-funds-form') fujiFunds(data, fail);
    else if (formId === 'create-form') createTrip(data, fail);
    else if (!state.trip) fail('Open a trip first.');
    else if (formId === 'fund-form') {
      if (!state.trip.shared) updateFunds(state.trip, data.get('kind'), parseUnits(data.get('amount')), fail);
    }
    else recordBill(state.trip, data, fail);
  });

  window.addEventListener('storage', event => {
    if (event.key !== KEY || storageUnavailable) return;
    const trip = state.trip;
    syncTrips();
    if (trip !== state.trip && sheet.open) sheet.close();
    render();
  });
  if (demoMode) fx = {
    rate: 25000, source: 'Fixed demo rate', updated: '', live: false, historical: false,
  };
  restoreWorkspace(loadWorkspace());
  if (!demoMode) discoverWallets();
  commit();
  showFirstVisitGuide();
  if (demoMode && new URLSearchParams(window.location?.search || '').has('join')) {
    startRoomFlow('join', new URLSearchParams(window.location.search).get('join'));
  }
  if (!demoMode) {
    refreshFX();
    enableRooms();
  }
})();

  }

  async function sendBillTopUpReminder(element) {
    const trip = state.trip;
    const form = element.closest('#bill-form[data-room]');
    if (isDemoTrip(trip)) return sendDemoReminder(trip, form);
    if (!trip?.shared || form?.dataset.room !== trip.id || sendingReminders.has(form) || !rooms.token) return;
    const draft = readBillDraft(form);
    if (!draft?.label) return;
    const feedback = form.querySelector('#bill-reminder-feedback');
    sendingReminders.add(form);
    if (feedback) feedback.textContent = ui('Sending reminder…');
    updateBillFundingForm();
    try {
      const { sent } = await roomApi('/rooms/' + trip.id + '/top-up-reminder', { ...draft, version: trip.version });
      if (feedback) feedback.textContent = ui(sent === 1 ? 'Reminder sent in TripVault.' : 'Reminders sent in TripVault.');
    } catch (error) {
      if (feedback) feedback.textContent = ui(walletError(error));
      if (error.status === 409) {
        await syncRooms();
        await refreshRoomFunding();
      }
    } finally {
      sendingReminders.delete(form);
      updateBillFundingForm();
    }
  }

  function reminderBalance(trip, reminder) {
    const funding = getDisplayedFunding(trip);
    if (!funding || funding.failed || !funding.rate || funding.closed) return null;
    return roomFundingShortfalls(trip, funding, reminder.draft).find(item => item.id === state.actor)?.units ?? 0;
  }

  function openTopUpReminder(id) {
    if (isDemoTrip()) {
      markRoomNotificationRead(state.trip.id + ':top-up:' + id);
      state.view = 'wallet';
      render();
      return openRoomNotifications();
    }
    const reminder = rooms.reminders.find(item => item.id === id);
    const trip = reminder && rooms.list.get(reminder.roomId);
    if (!trip) return;
    markRoomNotificationRead(trip.id + ':top-up:' + id);
    selectTrip(trip);
    state.view = 'wallet';
    render();
    openRoomNotifications();
    refreshRoomFunding();
  }

  async function payTopUpReminder(id, units) {
    if (isDemoTrip()) {
      const trip = state.trip;
      const reminder = trip.demoReminders?.find(item => item.id === id && item.recipient === state.actor);
      const needed = reminder && reminderBalance(trip, reminder);
      if (!needed || needed !== Number(units)) return notice('The amount changed. Check the latest reminder.');
      return updateFunds(trip, 'deposit', needed, notice);
    }
    const tripId = state.trip?.id;
    const token = rooms.token;
    if (!tripId || !token || walletSession.busy || payingReminder) return;
    payingReminder = true;
    render();
    try {
      if (!await syncRooms()) return notice('Could not check the latest reminder. Try again.');
      await refreshRoomFunding();
      const trip = state.trip;
      if (trip?.id !== tripId || token !== rooms.token || walletSession.busy) return;
      const reminder = rooms.reminders.find(item => item.id === id && item.roomId === tripId);
      const balance = reminder && reminderBalance(trip, reminder);
      if (!balance || balance !== Number(units)) {
        return notice('The amount changed. Check the latest reminder.');
      }
      if (sheet.open && sheet.querySelector('[data-room-notifications]')) sheet.close();
      await fujiDeposit(balance);
      await refreshRoomFunding();
    } finally {
      payingReminder = false;
      render();
      refreshNotificationSheet();
    }
  }

  async function topUpRoomFunding(element) {
    const trip = state.trip;
    if (!trip?.shared || walletSession.busy) return;
    const form = element.closest('#bill-form[data-room]');
    const draft = form ? readBillDraft(form) : null;
    const status = roomBillFunding(trip, draft, Number(form?.dataset.editing));
    const needed = status.shortfalls?.find(item => item.id === state.actor);
    if (needed) {
      await fujiDeposit(needed.units);
      await refreshRoomFunding();
    }
  }

  function fujiFaucetNotice() {
    return '<p class="notice">Get USDC for Avalanche Fuji using this wallet address, then refresh your balance. <a href="https://faucet.circle.com/" target="_blank" rel="noopener noreferrer">Open Circle faucet</a></p>';
  }

  document.addEventListener('input', updateBillFundingForm);
  document.addEventListener('change', updateBillFundingForm);

  const TRIP_PROGRESS_STEPS = ['Set up', 'Add funds', 'Record bills', 'Final payments', 'Done'];

  function tripProgress(trip) {
    if (isDemoTrip(trip)) return demoTripProgress(trip);
    const vault = currentVault();
    const funding = getDisplayedFunding(trip);
    const organizer = isRoomOrganizer(trip);
    const end = vault ? vault.end * 1000 : roomEndTime(trip);
    const now = vault ? vault.timestamp * 1000 : Date.now();
    const ended = Boolean(trip.endedAt) || (funding?.ended ?? (now >= end));
    const pendingBills = trip.bills.filter(bill => !['approved', 'rejected'].includes(bill.status)).length;

    if (roomFundingCancelled(trip)) {
      return { step: 4, title: 'Trip cancelled',
        message: trip.fuji?.address ? 'Someone was below the minimum at the deadline. Open Wallet to take back your deposit.'
          : 'The deposit deadline passed without a linked trip fund.', view: 'wallet' };
    }
    if (trip.settled || vault?.settled) {
      const index = vault?.members.indexOf(walletSession.account) ?? -1;
      return {
        step: 4, title: 'Group payments complete',
        message: vault?.settled && index >= 0 && vault.balances[index] === 0 ? 'Your balance in the trip fund is zero.'
          : 'Open Wallet to send any remaining balance to your wallet.',
        view: 'wallet',
      };
    }
    if ((vault && vault.timestamp >= vault.refundDeadline) || funding?.closed) {
      return { step: 4, title: 'Payment window closed', message: 'Open Wallet to check what you can take back.', view: 'wallet' };
    }
    if (!trip.fuji?.address) {
      if (!trip.locked && !ended) {
        return { step: 0, title: 'Invite your group',
          message: organizer ? 'Share the invite link or six-digit code below.'
            : 'The organizer sets up the trip fund once everyone has joined.',
          view: organizer ? 'wallet' : 'people',
          shortcut: organizer ? 'Go to vault setup' : 'View members',
          focus: organizer ? 'fuji-deploy' : '' };
      }
      return { step: 0, title: 'Set up the trip fund',
        message: organizer ? 'Open Wallet to create or link the fund for this trip.'
          : 'Waiting for the organizer to set up the trip fund.', view: 'wallet',
        shortcut: organizer ? 'Go to vault setup' : '',
        focus: organizer ? 'fuji-deploy' : '' };
    }

    if (!ended) {
      const balances = funding?.balances || vault?.balances;
      if (!balances) {
        return { step: 1, title: 'Check group deposits',
          message: funding?.failed ? 'Could not check balances. Open Wallet to refresh.' : 'Checking who has added the minimum.',
          view: 'wallet' };
      }
      const funded = balances.filter(units => units >= trip.minimumUnits).length;
      const needsTopUp = funding?.rate && roomFundingShortfalls(trip, funding).length > 0;
      if (funded < trip.members.length || needsTopUp) {
        return { step: 1, title: funded < trip.members.length ? 'Waiting for deposits' : 'Waiting for top-ups',
          message: funded < trip.members.length
            ? `${funded} of ${trip.members.length} members have added at least ${money(trip.minimumUnits)}.`
            : 'Someone needs to add funds before the group can save more bills.', view: 'wallet' };
      }
      if (trip.depositDeadline && !(funding?.started ?? (now >= Date.parse(trip.startTime)))) {
        return { step: 1, title: funding?.deadlineReached ? 'Trip confirmed' : 'Minimum deposits reached',
          message: funding?.deadlineReached ? 'The trip will begin at its scheduled start.'
            : 'Everyone has added the minimum. Deposits are checked again at the deadline.', view: 'wallet' };
      }
      return { step: 2, title: 'Record shared expenses',
        message: pendingBills ? `${pendingBills} ${pendingBills === 1 ? 'bill needs' : 'bills need'} approval.`
          : 'Add payments made outside TripVault as bills.', view: 'bills' };
    }

    if (pendingBills) {
      return { step: 3, title: 'Finish bill reviews',
        message: 'The trip has ended. Resolve any requested changes or removal requests before making final payments.', view: 'bills' };
    }
    if (!trip.reviewQuote || !trip.fuji.publishedRevision) {
      return { step: 3, title: 'Prepare final payments',
        message: organizer ? 'Open Final split to calculate and share what each person owes.'
          : 'Waiting for the organizer to share the final amounts.', view: 'split' };
    }
    if (!vault) {
      return { step: 3, title: 'Check final payments',
        message: 'Open Final split to check the latest approvals and top-ups.', view: 'split' };
    }
    if (!matchesFujiDraft(trip, vault)) {
      return { step: 3, title: 'Share updated amounts',
        message: organizer ? 'The amounts changed. Share the update in Final split.'
          : 'Waiting for the organizer to share the updated amounts.', view: 'split' };
    }

    const approved = vault.approvals.filter(Boolean).length;
    const short = vault.members.filter((_, index) => fujiShortfall(vault, index) > 0).length;
    if (approved < trip.members.length || short) {
      return { step: 3, title: 'Waiting for approvals or top-ups',
        message: `${approved} of ${trip.members.length} approved.` +
          (short ? ` ${short} ${short === 1 ? 'person still needs' : 'people still need'} to top up.` : ''),
        view: 'split' };
    }
    return { step: 3, title: 'Ready to make group payments',
      message: organizer ? 'Everyone is ready. Open Final split and choose Make group payments.'
        : 'Everyone is ready. The organizer can make the group payments.', view: 'split' };
  }

  function roomProgressPanel(trip) {
    const { step, title, message, view, shortcut, focus } = tripProgress(trip);
    const target = shortcut || { wallet: 'Open Wallet', bills: 'Open Bills', split: 'Open Final split' }[view];
    const nextAction = target ? btn(target, 'navigate', {
      data: `data-view="${view}"${focus ? ` data-focus="${focus}"` : ''}`,
    }) : '';
    const showEnd = showEarlyEndControl(trip);
    const canEnd = showEnd && canEndRoom(trip);
    const endAction = showEnd ? btn('End trip early', 'room-end', {
      tone: 'danger', disabled: !canEnd || walletSession.busy || trip.fuji?.lastTx?.phase === 'pending',
      data: canEnd ? '' : 'aria-describedby="trip-early-end-help"',
    }) : '';
    return `<section class="panel trip-progress" aria-labelledby="trip-progress-title">
      <h2 id="trip-progress-title">Trip progress</h2>
      <ol class="trip-progress-steps" aria-label="Trip steps">
        ${TRIP_PROGRESS_STEPS.map((label, index) => `<li${index === step ? ' aria-current="step"' : ''}>${label}</li>`).join('')}
      </ol>
      <div class="trip-progress-next">
        <div><h3>${title}</h3><p class="subtitle">${message}</p></div>
        ${nextAction || endAction ? `<div class="inline">${nextAction}${endAction}</div>` : ''}
      </div>
      ${showEnd && !canEnd ? '<p class="subtitle" id="trip-early-end-help">You can end the trip early once everyone has funded it and the trip starts.</p>' : ''}
    </section>`;
  }

  const ROOM_BILL_STATUS = {
    pending: 'Waiting for approval', approved: 'Approved', disputed: 'Changes requested',
    cancellation: 'Waiting for agreement to remove', rejected: 'Rejected · Handle separately',
  };

  function sameBillReview(previous, latest) {
    return Boolean(previous && latest && ['pending', 'disputed'].includes(latest.status)
      && previous.label === latest.label && previous.amount === latest.amount && previous.payer === latest.payer
      && previous.reviewBy === latest.reviewBy && JSON.stringify(previous.participants) === JSON.stringify(latest.participants));
  }

  function billSignInButton() {
    return '<div data-room-sign-in' + (rooms.token ? ' hidden' : '') + '>'
      + btn('Sign in again', 'room-reauthenticate', { tone: 'secondary' }) + '</div>';
  }

  function updateRoomSignInButton() {
    const control = sheet.querySelector('[data-room-sign-in]');
    if (control) control.hidden = Boolean(rooms.token);
  }

  function roomBillStatus(bill) {
    const status = ROOM_BILL_STATUS[bill.status] || 'Waiting for approval';
    if (bill.status !== 'pending' && bill.status !== 'disputed') return ui(status);
    const count = bill.participants.filter(id => bill.approvals.includes(id)).length;
    return ui(status + ' · ' + count + '/' + bill.participants.length + ' approved');
  }

  function showBillReviewError(message) {
    const error = sheet.querySelector('#bill-review-error');
    if (error) error.textContent = ui(message);
    notice(message);
  }

  function roomBillDetail(id, confirmation = '') {
    const trip = state.trip;
    const bill = trip.bills.find(item => item.id === id);
    if (!bill) return;
    const demo = isDemoTrip(trip);
    const reviewable = !trip.settled && !trip.reviewQuote && bill.status !== 'rejected';
    const editable = reviewable && ['pending', 'disputed'].includes(bill.status);
    const canReview = editable && bill.participants.includes(state.actor);
    const hasApproved = bill.approvals.includes(state.actor);
    const creator = bill.createdBy || bill.payer;
    const voters = [...new Set([creator, bill.payer, ...bill.participants])];
    const votes = bill.cancellation?.votes || [];
    const idData = `data-id="${id}"`;
    const comments = feedback => feedback?.map(item => row(userText(member(item.author)?.name || 'Member'), '', userText(item.comment))).join('') || '';
    const suggestions = (bill.feedback || []).map(item => {
      const responses = item.responses || [];
      const myResponse = responses.find(response => response.member === state.actor);
      const canRespond = (demo || rooms.canRespondToSuggestions) && editable && bill.status === 'disputed'
        && item.author !== state.actor && voters.includes(state.actor);
      const responseActions = canRespond ? [true, false].map(agree => btn(agree ? 'Agree' : 'Disagree', 'bill-feedback-vote', {
        tone: agree ? '' : 'danger',
        disabled: myResponse?.agree === agree,
        data: idData + ` data-author="${safe(item.author)}" data-suggestion="${safe(item.id)}" data-agree="${agree}"`,
      })).join('') : '';
      return `<div class="bill-suggestion">
        <strong>${userText(member(item.author)?.name || 'Member')}</strong>
        <p class="bill-cancellation-reason">${userText(item.comment)}</p>
        ${responses.map(response => `<p class="subtitle">${userText(member(response.member)?.name || 'Member')} <span aria-hidden="true">·</span>
          <span>${response.agree ? 'Agreed' : 'Disagreed'}</span></p>`).join('')}
        ${responseActions ? '<div class="inline">' + responseActions + '</div>' : ''}
      </div>`;
    }).join('');
    const history = bill.history?.map(item =>
      `<div>${row(userText(item.label), vnd(item.amount), 'Paid by ' + userText(member(item.payer)?.name))}${comments(item.feedback)}</div>`).join('');
    const splitLabel = ui(bill.splitType === 'custom' ? 'Custom split' : 'Equal split');
    const percentage = new Intl.NumberFormat(siteLanguage === 'vi' ? 'vi-VN' : 'en-US', {
      style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1,
    });
    const reviewRows = bill.participants.map(id => {
      const s = shares(bill).find(item => item.id === id);
      const amt = s ? s.amount : 0;
      const pct = bill.amount ? ` (${percentage.format(amt / bill.amount)})` : '';
      return row(userText(member(id).name), '<span class="bill-share-money">' + vnd(amt) + '</span>'
        + (pct ? '<small class="bill-share-percent">' + pct + '</small>' : ''),
        bill.autoApprovals?.includes(id) ? 'Automatically approved' : bill.approvals.includes(id) ? 'Approved' : 'Waiting for approval');
    }).join('');
    const reviewButtons = canReview
      ? (hasApproved ? '' : btn('Approve bill', 'approve-bill', { data: idData }))
        + btn('Suggest changes', 'bill-feedback', { tone: 'secondary', data: idData })
      : '';
    const editButton = editable && creator === state.actor ? btn('Edit bill', 'bill-edit', { tone: 'secondary', data: idData }) : '';
    const cancelButtons = reviewable && voters.includes(state.actor)
      ? (!votes.includes(state.actor) ? btn(bill.cancellation ? 'Agree to cancel' : 'Disagree and request cancellation', 'bill-cancel-yes',
        { tone: 'danger', data: idData }) : '') +
        (bill.cancellation ? btn('Keep bill', 'bill-cancel-no', { tone: 'secondary', data: idData }) : '')
      : '';
    sheetOpen({ user: bill.label }, roomBillStatus(bill), `<div class="stack" data-bill-review="${id}">
      ${row('Amount paid', vnd(bill.amount), 'Paid by ' + userText(member(bill.payer).name))}
      <section class="panel"><h3>${ui('People sharing this bill')} (${splitLabel})</h3>${reviewRows}</section>
      ${bill.status === 'pending' && bill.reviewBy ? `<p class="notice">Automatically approves at ${safe(formatTripTime(bill.reviewBy))} if nobody requests changes or asks to remove it.</p>` : ''}
      ${bill.status === 'approved' ? '<p class="subtitle">This bill has been approved. Suggestions are available while a bill is still being reviewed.</p>' : ''}
      ${suggestions ? `<section class="panel"><h3>Suggested changes</h3>${suggestions}</section>` : ''}
      ${confirmation ? `<p class="notice green" role="status">${safe(confirmation)}</p>` : ''}
      ${history ? `<details class="panel"><summary>Previous versions</summary>${history}</details>` : ''}
      ${bill.cancellation?.reason ? `<section class="notice warn bill-cancellation-note">
        <h3>Reason for cancellation</h3>
        <p>${userText(member(bill.cancellation.requestedBy)?.name || 'Member')}</p>
        <p class="bill-cancellation-reason">${userText(bill.cancellation.reason)}</p>
      </section>` : ''}
      ${bill.status === 'cancellation' ? `<div class="notice">
        <p>${votes.length} of ${voters.length} agreed to remove this bill.</p>
        <p>The bill creator, payer and everyone sharing the bill must agree to cancel it.</p>
      </div>` : ''}
      ${bill.status === 'rejected' ? '<p class="notice">Everyone involved agreed to handle this bill separately. It is excluded from the final amounts.</p>' : ''}
      <p id="bill-review-error" class="form-error" role="status"></p>
      ${reviewButtons || editButton ? `<div class="bill-actions">${reviewButtons}${editButton}</div>` : ''}
      ${cancelButtons ? `<div class="bill-actions bill-removal-actions${reviewButtons || editButton ? '' : ' solo'}">${cancelButtons}</div>` : ''}
      ${reviewable && !demo ? billSignInButton() : ''}
    </div>`);
  }

  function roomBillAction(action, id) {
    const trip = state.trip;
    const bill = (trip?.shared || isDemoTrip(trip)) && trip?.bills.find(item => item.id === id);
    if (!bill) return;
    if (action === 'bill-edit') return addBill(bill);
    if (action === 'bill-feedback') {
      return sheetOpen('Suggest changes', { user: bill.label }, `<form method="dialog" id="bill-feedback-form" class="stack">
        <input type="hidden" name="id" value="${id}">
        <label class="field">Reason or suggested change<textarea name="comment" rows="4" required maxlength="500" autofocus></textarea></label>
        <p id="sheet-error" class="form-error" role="status"></p>
        ${trip.shared ? billSignInButton() : ''}
        <button class="btn full" type="submit">Send suggestion</button>
      </form>`);
    }
    if (action === 'bill-cancel-yes' && !bill.cancellation) {
      return sheetOpen('Request bill cancellation', { user: bill.label }, `<form method="dialog" id="bill-cancellation-form" class="stack">
        <input type="hidden" name="id" value="${id}">
        <label class="field">Reason for cancellation<textarea name="reason" rows="4" required maxlength="500" autofocus></textarea></label>
        <p class="subtitle">Everyone in this trip can read your reason. The bill creator, payer and everyone sharing the bill must agree to cancel it.</p>
        <p id="sheet-error" class="form-error" role="status"></p>
        ${trip.shared ? billSignInButton() : ''}</form>`,
      '<button class="btn full danger" type="submit" form="bill-cancellation-form">Send cancellation request</button>');
    }
    changeRoom(trip, 'bill.cancel', { id, agree: action === 'bill-cancel-yes' }, updated => {
      if (updated) roomBillDetail(id);
    }, showBillReviewError);
  }

  function submitBillCancellation(data, fail) {
    const trip = state.trip;
    if (!trip?.shared && !isDemoTrip(trip)) return;
    if (trip.shared && !rooms.canSaveCancellationReason) return fail('The server needs an update to save the cancellation reason.');
    const id = Number(data.get('id'));
    const reason = String(data.get('reason') || '').trim();
    if (!reason) return fail('Enter a reason for cancellation.');
    changeRoom(trip, 'bill.cancel', { id, agree: true, reason }, updated => {
      if (updated) roomBillDetail(id);
    }, fail);
  }

  function respondToBillFeedback(id, { author, suggestion, agree }) {
    const trip = state.trip;
    if ((!trip?.shared || !rooms.canRespondToSuggestions) && !isDemoTrip(trip)) return;
    changeRoom(trip, 'bill.feedback-vote', { id, author, suggestion, agree: agree === 'true' }, updated => {
      if (updated && sheet.open) roomBillDetail(id, 'Your response was saved.');
    }, showBillReviewError);
  }

  async function submitBillFeedback(data, fail) {
    const id = Number(data.get('id'));
    if (!state.trip?.shared && !isDemoTrip()) return;
    if (rooms.busy) return fail('Another room action is in progress. Try again.');
    const comment = String(data.get('comment') || '').trim();
    if (!comment) return fail('Enter a reason or suggested change.');
    const button = sheet.querySelector('#bill-feedback-form button[type="submit"]');
    const form = button?.form;
    if (form && form.feedbackComment !== comment) {
      form.feedbackComment = comment;
      form.feedbackRequestId = globalThis.crypto?.randomUUID?.();
    }
    if (button) {
      button.disabled = true;
      button.textContent = ui('Sending suggestion…');
    }
    fail('');
    try {
      await changeRoom(state.trip, 'bill.feedback', { id, comment, requestId: form?.feedbackRequestId }, updated => {
        const bill = updated?.bills.find(item => item.id === id);
        if (!bill || !sheet.open) return;
        const creator = bill.createdBy || bill.payer;
        const message = creator !== state.actor
          ? 'Suggestion sent. The bill creator can see it in Notifications.'
          : 'Your suggestion was saved.';
        roomBillDetail(id, message);
        notice(message);
      }, fail);
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = ui('Send suggestion');
      }
    }
  }

  let notificationReadKey;
  let readNotifications;
  let migratedNotificationRooms;
  let notificationDismissedKey;
  let dismissedNotifications;
  let notificationAttention = false;
  let notificationAttentionTimer;

  const BILL_EVENT_HEADINGS = {
    'suggestion-agreed': 'Someone agreed with the suggestion',
    'suggestion-disagreed': 'Someone disagreed with the suggestion',
    'cancellation-requested': 'Bill removal requested',
    'cancellation-declined': 'Bill cancellation declined',
  };

  function billFeedbackNotifications(trip, bill, member, involved) {
    const entries = new Map();
    const add = (id, label, feedback) => entries.set(id, {
      id: 'feedback:' + bill.id + ':' + id, billId: bill.id, title: label,
      heading: 'Bill change requested', message: feedback.comment, userMessage: true,
      changeRequest: true,
      receivedAt: feedback.receivedAt,
      sender: trip.members.find(person => person.id === feedback.author)?.name,
    });
    for (const feedback of bill.feedbackLog || []) {
      if (isDemoTrip(trip) && (!feedback.recipients?.includes(member.id) || feedback.author === member.id)) continue;
      add(feedback.id, feedback.label, feedback);
    }
    if (involved) {
      const versions = [...(bill.history || []), bill];
      for (const version of versions) {
        for (const feedback of version.feedback || []) {
          if (feedback.author === member.id || entries.has(feedback.id)) continue;
          if (feedback.id) {
            add(feedback.id, version.label, feedback);
            continue;
          }
          let fingerprint = 0;
          for (const char of feedback.comment) fingerprint = Math.imul(fingerprint, 31) + char.codePointAt(0) | 0;
          add([feedback.author, version.reviewBy, fingerprint].join(':'), version.label, feedback);
        }
      }
    }
    return [...entries.values()].reverse();
  }

  function tripNotificationEntries(trip) {
    const member = isDemoTrip(trip) ? trip.members.find(item => item.id === state.actor)
      : trip.members.find(item => item.address === rooms.account);
    if (!member) return [];

    const bills = trip.bills.slice().reverse().flatMap(bill => {
      const involved = [bill.createdBy || bill.payer, bill.payer, ...bill.participants].includes(member.id);
      const feedback = billFeedbackNotifications(trip, bill, member, involved);
      const related = { billId: bill.id, title: bill.label };
      const review = (bill.notificationLog || [])
        .filter(event => !isDemoTrip(trip) || event.recipients?.includes(member.id)).map(event => ({
        ...related, title: event.label,
        id: (event.kind === 'cancellation-requested' ? 'removal' : 'bill-event') + ':' + bill.id + ':' + event.id,
        heading: BILL_EVENT_HEADINGS[event.kind], receivedAt: event.receivedAt,
        message: event.comment, userMessage: Boolean(event.comment),
        sender: trip.members.find(person => person.id === event.actor)?.name,
      }));
      if (involved && bill.status === 'pending' && bill.participants.includes(member.id)
        && !bill.approvals.includes(member.id) && (bill.createdBy || bill.payer) !== member.id) {
        review.push({ ...related, id: 'review:' + bill.id + ':' + bill.reviewBy,
          heading: 'Bill needs your approval',
          receivedAt: bill.reviewStartedAt || (bill.reviewBy ? bill.reviewBy - 86_400_000 : undefined),
          sender: trip.members.find(person => person.id === (bill.createdBy || bill.payer))?.name });
      }
      const cancellation = bill.cancellation;
      if (bill.status === 'cancellation' && cancellation && (involved || cancellation.reason)
        && !cancellation.votes.includes(member.id)
        && !review.some(item => item.id === 'removal:' + bill.id + ':' + cancellation.id)) {
        review.push({ ...related, id: 'removal:' + bill.id + ':' + (cancellation.id || bill.reviewBy),
          heading: 'Bill removal requested', message: cancellation.reason, userMessage: Boolean(cancellation.reason),
          receivedAt: cancellation.requestedAt,
          sender: trip.members.find(person => person.id === (cancellation.requestedBy || cancellation.votes[0]))?.name });
      }
      if (bill.status === 'rejected' && (involved || cancellation?.reason)) {
        review.push({ ...related, id: 'removed:' + bill.id, heading: 'Bill removed',
          receivedAt: cancellation?.resolvedAt,
          message: 'Everyone involved agreed to handle this bill separately. It is excluded from the final amounts.' });
      }
      return [...feedback, ...review];
    });

    const reminders = (isDemoTrip(trip) ? (trip.demoReminders || []).filter(reminder => reminder.recipient === member.id) : rooms.reminders)
      .filter(reminder => reminder.roomId === trip.id).map(reminder => ({
      id: 'top-up:' + reminder.id, reminder, heading: 'Top-up reminder', title: reminder.draft.label,
      sender: reminder.sender, receivedAt: reminder.receivedAt,
    }));

    const notices = trip.members.slice(trip.members.indexOf(member) + 1)
      .filter(person => Number.isSafeInteger(person.joinedAt) && person.joinedAt > 0)
      .map(person => ({
        id: 'member-joined:' + person.id, heading: 'New member joined',
        sender: person.name, receivedAt: person.joinedAt, view: 'people',
      }));
    if (roomFundingCancelled(trip)) {
      notices.push({ id: 'cancelled', heading: 'Trip cancelled', view: 'wallet',
        receivedAt: Date.parse(trip.depositDeadline),
        message: trip.fuji?.address || (isDemoTrip(trip) && demoFundReady(trip)) ? 'Someone was below the minimum at the deadline. Open Wallet to take back your deposit.'
          : 'The deposit deadline passed without a linked trip fund.' });
    } else if (trip.settled) {
      notices.push({ id: 'settled', heading: 'Group payments complete', view: 'wallet',
        receivedAt: trip.fuji?.settledAt || trip.settledAt,
        message: 'Open Wallet to send any remaining balance to your wallet.' });
    } else if (trip.billsClosedAt) {
      notices.push({ id: 'ended', heading: trip.endedAt ? 'Trip ended early' : 'Trip ended', view: trip.endedAt ? 'split' : 'bills',
        receivedAt: Date.parse(trip.billsClosedAt),
        message: trip.endedAt ? 'Open Final split to review the trip expenses.' : 'The trip has ended. Review any bills that are still open.' });
      if (trip.owner !== member.id && trip.fuji?.publishedRevision) {
        notices.push({ id: 'split:' + trip.fuji.publishedRevision, heading: 'Final amounts are ready to review',
          receivedAt: trip.fuji.publishedAt, view: 'split' });
      }
    } else if (trip.locked) {
      notices.push({ id: 'roster-locked', heading: 'Roster locked', view: 'people',
        receivedAt: trip.rosterLockedAt,
        message: 'The vault uses the member list saved at setup. Invitations are closed.' });
      if (trip.owner === member.id && trip.fuji?.address && trip.fuji.contractVersion < 2 && roomEndTime(trip) > Date.now()) {
        notices.push({ id: 'original-end', heading: 'Trip end', view: 'wallet',
          receivedAt: trip.fuji.linkedAt,
          message: 'This vault uses its original end time. Early ending is available for newly deployed vaults.' });
      }
      const funding = getDisplayedFunding(trip);
      if (funding && !funding.closed && !funding.failed) {
        const shortfall = roomFundingShortfalls(trip, funding).find(item => item.id === member.id);
        if (shortfall) notices.push({ id: 'funding:' + shortfall.units, heading: 'Your top-up',
          message: money(shortfall.units), view: 'wallet' });
      }
    }

    return [...bills, ...reminders, ...notices].map(item => ({
      ...item, id: trip.id + ':' + item.id, roomId: trip.id, roomName: trip.name,
    }));
  }

  function sampleNotificationTrip() {
    const trip = state.trip;
    return isDemoTrip(trip) ? trip : null;
  }

  function notificationAccount() {
    return sampleNotificationTrip() ? 'demo:' + state.actor : rooms.account;
  }

  function sampleNotifications(trip) {
    const sample = { roomId: trip.id, roomName: trip.name };
    const prefix = trip.id + ':' + trip.endTime + ':';
    const entries = tripNotificationEntries(trip);
    const funding = demoFunding(trip);
    if (!trip.settled && !funding.cancelled && demoFundReady(trip) && funding.balances.every(units => units >= trip.minimumUnits)) {
      entries.push({ ...sample, id: prefix + 'funded', heading: 'Minimum deposits reached', view: 'wallet',
        receivedAt: trip.demoFundedAt || Math.min(Date.now(), Date.parse(trip.startTime)) });
    }
    if (funding.ended && !trip.billsClosedAt && !trip.settled && !funding.cancelled) {
      entries.push({ ...sample, id: prefix + 'ended', heading: 'Trip ended', view: 'split',
        receivedAt: roomEndTime(trip), message: 'The trip has ended. Review any bills that are still open.' });
    }
    if (trip.reviewQuote && trip.demoPublishedRevision === trip.revision && !trip.settled && state.actor !== trip.owner) entries.push({ ...sample,
      id: prefix + 'split:' + trip.revision, heading: 'Final amounts are ready to review',
      receivedAt: trip.demoPublishedAt, view: 'split' });
    return entries;
  }

  function readRoomNotifications() {
    if (!notificationAccount()) return [];
    const dismissed = dismissedRoomNotifications();
    const sample = sampleNotificationTrip();
    const entries = sample ? sampleNotifications(sample) : [...rooms.list.values()].flatMap(tripNotificationEntries);
    const items = entries.filter(item => !dismissed.has(item.id));
    return items.sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0) || a.id.localeCompare(b.id));
  }

  function notificationIds() {
    return new Set(readRoomNotifications().map(item => item.id));
  }

  function dismissedRoomNotifications() {
    const key = 'tripvault-notifications-dismissed:' + notificationAccount();
    if (key !== notificationDismissedKey) {
      notificationDismissedKey = key;
      const saved = readStorage(key);
      dismissedNotifications = new Set(Array.isArray(saved) ? saved : []);
    }
    return dismissedNotifications;
  }

  function clearRoomNotifications() {
    if (!notificationAccount() || !sheet.open) return;
    const items = readRoomNotifications();
    if (!items.length) return;
    const dismissed = dismissedRoomNotifications();
    items.forEach(item => dismissed.add(item.id));
    try {
      localStorage.setItem(notificationDismissedKey, JSON.stringify([...dismissed]));
    } catch {}
    if (!refreshNotificationSheet()) openRoomNotifications();
  }

  window.addEventListener('storage', event => {
    if (!notificationAccount() || event.key !== notificationDismissedKey) return;
    notificationDismissedKey = undefined;
    if (!refreshNotificationSheet()) render();
  });

  function seenRoomNotifications() {
    const key = 'tripvault-notifications-read:' + notificationAccount();
    if (key !== notificationReadKey) {
      notificationReadKey = key;
      const saved = readStorage(key);
      readNotifications = new Set(Array.isArray(saved) ? saved : []);
      migratedNotificationRooms = new Set();
    }
    // Older versions stored read status under each trip.
    for (const id of rooms.list.keys()) {
      if (migratedNotificationRooms.has(id)) continue;
      migratedNotificationRooms.add(id);
      const previous = readStorage(key + ':' + id);
      if (Array.isArray(previous)) previous.forEach(item => readNotifications.add(id + ':' + item));
    }
    return readNotifications;
  }

  function roomBell() {
    if (!notificationAccount()) return '';
    const seen = seenRoomNotifications();
    const unreadCount = readRoomNotifications().filter(item => !seen.has(item.id)).length;
    const unread = unreadCount > 0;
    const badgeText = unreadCount > 9 ? '9+' : unreadCount;
    return `<button type="button" class="btn secondary trip-bell${unread && notificationAttention ? ' attention' : ''}" data-act="room-notifications"
      aria-label="${unread ? 'Notifications · Unread' : 'Notifications'}" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>
      </svg>${unread ? `<span class="trip-bell-dot" aria-hidden="true">${badgeText}</span>` : ''}
    </button>`;
  }

  function topUpNotificationDetails(trip, reminder) {
    const id = `data-id="${safe(reminder.id)}"`;
    if (!trip) return [`Requested ${money(reminder.units)}`, btn('Open trip', 'open-top-up-reminder', { tone: 'secondary', data: id })];
    if (trip.settled || getDisplayedFunding(trip)?.closed) return ['The trip fund is closed.', ''];
    const units = reminderBalance(trip, reminder);
    if (units === null) return [`Requested ${money(reminder.units)}. Check the current amount before adding funds.`,
      btn('Check amount', 'room-funding-refresh', { tone: 'secondary' })];
    if (!units) return ['You’ve added enough for this bill.', ''];
    const action = isDemoTrip(trip) ? btn('Top up ' + money(units), 'pay-top-up-reminder', { data: id + ` data-units="${units}"` })
      : walletSession.chain !== FUJI.id
      ? btn('Switch to Fuji', 'fuji-switch', { disabled: walletSession.busy })
      : btn('Top up ' + money(units), 'pay-top-up-reminder', {
        data: id + ` data-units="${units}"`,
        disabled: payingReminder || walletSession.busy || trip.fuji?.lastTx?.phase === 'pending',
      });
    return [`${money(units)} still needed`, action];
  }

  function notificationTime(timestamp) {
    if (!Number.isFinite(timestamp) || timestamp <= 0) return '<small class="notification-time">Time unavailable</small>';
    const date = new Date(timestamp);
    const minutes = Math.max(0, Math.floor((Date.now() - timestamp) / 60_000));
    const formatter = new Intl.RelativeTimeFormat(siteLanguage === 'vi' ? 'vi-VN' : 'en-US', { numeric: 'always' });
    let elapsed = ui('Just now');
    if (minutes >= 1440) elapsed = formatter.format(-Math.floor(minutes / 1440), 'day');
    else if (minutes >= 60) elapsed = formatter.format(-Math.floor(minutes / 60), 'hour');
    else if (minutes) elapsed = formatter.format(-minutes, 'minute');
    return `<small class="notification-time"><time datetime="${date.toISOString()}">${safe(formatTripTime(timestamp))}</time>
      <span aria-hidden="true"> · </span><span>${safe(elapsed)}</span></small>`;
  }

  function notificationCategory(item) {
    if (item.reminder || item.heading === 'Top-up reminder' || item.heading === 'Your top-up') {
      return 'notif-topup';
    }
    if (item.heading === 'Bill change requested' || item.heading === 'Bill needs your approval' || item.heading === 'Bill removal requested' || item.heading === 'Bill cancellation declined') {
      return 'notif-warning';
    }
    if (item.heading === 'Someone agreed with the suggestion' || item.heading === 'Group payments complete' || item.heading === 'Bill removed') {
      return 'notif-success';
    }
    return 'notif-info';
  }

  function roomNotificationsBody(trip, items, seen) {
    if (!items.length) {
      return `<div class="empty-notifications">
        <div class="empty-notif-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>
          </svg>
        </div>
        <h3>No notifications yet</h3>
        <p class="subtitle">All updates about funding, bills, and approvals will appear here.</p>
        <span style="display:none">You have no trip notifications.</span>
      </div>`;
    }
    return '<div class="inline notification-tools">' +
      btn('Clear notifications', 'clear-room-notifications', { tone: 'secondary' }) + '</div>' + items.map(item => {
      const current = trip?.id === item.roomId;
      const [message, action] = item.reminder ? topUpNotificationDetails(current ? trip : null, item.reminder) : [
        item.message, btn(item.billId ? 'Open bill' : item.view === 'split' ? 'Open Final split' : 'Open trip', 'open-room-notification',
          { tone: 'secondary', data: `data-id="${safe(item.id)}"` }),
      ];
      const context = [item.roomName, item.sender, item.title].filter(Boolean).map(userText).join(' · ');
      const category = notificationCategory(item);
      const isUnread = !seen.has(item.id);
      return `<article class="trip-notification ${category}${isUnread ? ' unread' : ''}"
        data-notification-id="${safe(item.id)}" data-act="mark-room-notification-read" data-id="${safe(item.id)}">
        <div class="notif-header">
          <button type="button" class="notif-title" data-act="mark-room-notification-read" data-id="${safe(item.id)}">
            ${isUnread ? '<span class="notif-dot" aria-hidden="true"></span>' : ''}
            <strong>${item.heading}</strong>
          </button>
          ${notificationTime(item.receivedAt)}
        </div>
        ${context ? '<span class="notif-context">' + context + '</span>' : ''}
        ${message ? '<small class="notif-message">' + (item.userMessage ? userText(message) : safe(message)) + '</small>' : ''}
        ${action ? '<div class="inline notif-actions">' + action + '</div>' : ''}
      </article>`;
    }).join('');
  }

  function openRoomNotifications() {
    if (!notificationAccount()) return;
    const seen = seenRoomNotifications();
    const items = readRoomNotifications();
    const markup = roomNotificationsBody(state.trip, items, seen);
    sheetOpen('Notifications', 'Your trips',
      '<div class="stack" data-room-notifications>' + markup + '</div>' + (sampleNotificationTrip() ? '' : billSignInButton()));
    const panel = sheet.querySelector('[data-room-notifications]');
    if (panel) panel.notificationMarkup = markup;
    render();
    if (!sampleNotificationTrip()) syncRooms();
  }

  function markRoomNotificationRead(id) {
    const seen = seenRoomNotifications();
    if (!id || seen.has(id)) return;
    seen.add(id);
    try {
      localStorage.setItem(notificationReadKey, JSON.stringify([...seen].slice(-2000)));
    } catch {}
    if (!refreshNotificationSheet()) render();
  }

  function refreshNotificationSheet(items = readRoomNotifications()) {
    const panel = sheet.open && sheet.querySelector('[data-room-notifications]');
    if (!panel) return false;
    const markup = roomNotificationsBody(state.trip, items, seenRoomNotifications());
    if (panel.notificationMarkup !== markup) {
      panel.innerHTML = markup;
      localizeUI(panel);
      panel.notificationMarkup = markup;
      render();
    }
    return true;
  }

  function updateRoomNotifications(previous) {
    if (!rooms.account) return;
    const seen = seenRoomNotifications();
    const items = readRoomNotifications();
    if (refreshNotificationSheet(items)) return;
    const incoming = items.filter(item => !previous.has(item.id) && !seen.has(item.id));
    if (!incoming.length) return;
    const message = incoming.some(item => item.changeRequest) ? 'New bill change request' : 'New trip notification';
    notificationAttention = true;
    clearTimeout(notificationAttentionTimer);
    notificationAttentionTimer = setTimeout(() => {
      notificationAttention = false;
      app.querySelector?.('.trip-bell')?.classList.remove('attention');
    }, 1800);
    render();
    const sheetAlert = sheet.open && sheet.querySelector('[data-sheet-notification]');
    if (sheetAlert) {
      sheetAlert.querySelector('[role="status"]').textContent = ui(message);
      sheetAlert.hidden = false;
    }
    notice(message);
  }

  function openRoomNotification(id) {
    const item = readRoomNotifications().find(notification => notification.id === id);
    if (!item) return openRoomNotifications();
    const sample = sampleNotificationTrip();
    const targetTrip = sample?.id === item.roomId ? sample : rooms.list.get(item.roomId);
    if (!targetTrip) return;
    markRoomNotificationRead(id);
    const actor = state.actor;
    selectTrip(targetTrip);
    if (isDemoTrip(targetTrip) && targetTrip.members.some(person => person.id === actor)) {
      state.actor = actor;
      save();
    }
    state.view = item.view || 'bills';
    render();
    window.scrollTo(0, 0);
    if (targetTrip.shared && ['wallet', 'split'].includes(item.view)) refreshVault();
    if (targetTrip.shared && item.view === 'split') refreshRoomFunding();
    if (item.billId) roomBillDetail(item.billId);
  }

  // Demo uses the shared trip components, with local balances and actions.
  const standaloneDemo = false;

  function demoModeBanner() {
    if (!demoMode) return '';
    return `<section class="demo-mode-banner" aria-label="${ui('Demo mode')}">
      <div><strong>Demo mode</strong><p>Balances and members are simulated in this mode.</p></div>
      ${standaloneDemo ? '' : '<a class="btn secondary" href="/" data-exit-demo>Connect a real wallet</a>'}
    </section>`;
  }

  function isDemoTrip(trip = state.trip) {
    return Boolean(trip && !trip.shared && (demoMode || trip.demoVersion === 2
      || trip.id === 'judges-sample' || (!trip.fuji && !walletSession.account)));
  }

  function demoFundReady(trip) {
    return trip.demoFundReady !== false;
  }

  function demoFunding(trip) {
    const now = Date.now();
    const balances = trip.members.map(person => depositUnits(trip, person.id));
    const deadlineReached = Boolean(trip.depositDeadline && now >= Date.parse(trip.depositDeadline));
    const cancelled = Boolean(trip.demoCancelled || (!trip.settled && deadlineReached &&
      (!demoFundReady(trip) || balances.some(units => units < trip.minimumUnits))));
    return { balances, rate: (trip.reviewQuote || fx).rate, cancelled, deadlineReached,
      started: now >= Date.parse(trip.startTime) && !cancelled,
      ended: now >= roomEndTime(trip),
      closed: cancelled || trip.settled || now >= roomEndTime(trip) + 7 * 86_400_000 };
  }

  function refreshDemoState(trip) {
    if (!isDemoTrip(trip)) return;
    let changed = false;
    if (!trip.billsClosedAt && roomEndTime(trip) <= Date.now()) {
      trip.billsClosedAt = new Date(roomEndTime(trip)).toISOString();
      changed = true;
    }
    if (demoFunding(trip).cancelled && !trip.demoCancelled) { trip.demoCancelled = true; changed = true; }
    for (const bill of trip.bills) {
      if (bill.status !== 'pending' || !bill.reviewBy || bill.reviewBy > Date.now() || trip.settled || trip.reviewQuote) continue;
      bill.autoApprovals = bill.participants.filter(id => !bill.approvals.includes(id));
      bill.approvals = [...new Set([...bill.approvals, ...bill.participants])];
      bill.status = 'approved';
      invalidateSplit(trip);
      changed = true;
    }
    if (changed) save(trip);
  }

  function changeDemoTrip(trip, type, fields = {}, completed, fail = notice) {
    if (type.startsWith('bill.')) return changeDemoBill(trip, type, fields, completed, fail);
    const owner = state.actor === trip.owner;
    if (type === 'room.rename-member') {
      const name = String(fields.name || '').trim();
      if (!name || name.length > 40) return fail('Enter a valid display name.');
      member(state.actor).name = name;
    } else if (type === 'room.rename') {
      if (!canRenameTrip(trip)) return fail('The trip name can only be changed before the deposit deadline.');
      const name = String(fields.name || '').trim();
      if (!name || name.length > 70) return fail('Enter a valid trip name.');
      trip.name = name;
    } else if (type === 'room.end') {
      if (!owner || !canEndRoom(trip)) return fail('This trip cannot be ended early.');
      trip.endedAt = new Date(Date.now()).toISOString();
      trip.billsClosedAt = trip.endedAt;
    } else return fail('This action is unavailable.');
    commit(trip);
    completed?.(trip);
    return trip;
  }

  function submitDemoRoom(data, fail) {
    const intent = rooms.intent;
    const displayName = String(data.get('displayName') || '').trim();
    if (!displayName || displayName.length > 40) return fail('Enter a valid display name.');
    let trip;
    if (intent?.kind === 'create') {
      const name = String(data.get('name') || '').trim();
      const deadline = Date.parse(String(data.get('depositDeadline') || ''));
      const start = Date.parse(String(data.get('startTime') || ''));
      const end = Date.parse(String(data.get('endTime') || ''));
      const minimum = parseUnits(data.get('minimum'));
      if (!name || name.length > 70 || !minimum || !(Date.now() < deadline && deadline < start && start < end)) {
        return fail('Set a minimum above zero, then choose a future deadline, a later start, and an end after the start.');
      }
      trip = { id: 'demo-' + Date.now().toString(36), name, location: String(data.get('location') || '').trim(),
        owner: 'm0', members: [{ id: 'm0', name: displayName }],
        code: String(100000 + (Date.now() % 900000)), invite: 'demo-invite-' + Date.now().toString(36),
        demoVersion: 2, minimumUnits: minimum, depositDeadline: new Date(deadline).toISOString(), startTime: new Date(start).toISOString(),
        endTime: new Date(end).toISOString(), depositUnits: { m0: 0 }, demoFundReady: false,
        approvalMode: 'everyone', bills: [], nextBillId: 1, splitApprovals: [], revision: 1, reviewQuote: null, settled: false };
      state.trip = trip;
      state.actor = 'm0';
    } else if (intent?.kind === 'join') {
      const key = String(data.get('key') || '').trim();
      trip = state.trips.find(item => !item.shared && (item.code === key || item.invite === key));
      if (!trip || trip.locked || roomDeadlinePassed(trip)) return fail('This invitation is invalid.');
      if (trip.members.length >= 12) return fail('This room has reached 12 members.');
      const id = 'm' + trip.members.length;
      trip.members.push({ id, name: displayName, joinedAt: Date.now() });
      trip.depositUnits[id] = 0;
      state.trip = trip;
      state.actor = id;
    } else return;
    rooms.intent = null;
    if (sheet.open) sheet.close();
    state.view = 'overview';
    commit(trip, intent.kind === 'create' ? 'Room created. Share the link or six-digit code.' : 'You joined the room.');
  }

  function handleDemoAction(action, selection = {}) {
    const trip = state.trip;
    if (!isDemoTrip(trip)) return;
    if (action === 'demo-deploy') {
      if (state.actor !== trip.owner || roomDeadlinePassed(trip)) return;
      return sheetOpen('Lock room roster', { user: trip.name },
        '<p class="notice">Lock the member list when everyone has joined. The Fuji vault uses these wallet addresses, and new members cannot join after locking.</p>' + roomMembers(trip),
        btn('Lock roster', 'demo-deploy-confirm', { tone: 'full' }));
    } else if (action === 'demo-deploy-confirm') {
      if (state.actor !== trip.owner || roomDeadlinePassed(trip)) return;
      if (sheet.open) sheet.close();
      trip.demoFundReady = true;
      trip.locked = true;
      trip.rosterLockedAt = Date.now();
      commit(trip, 'Vault verified and linked.');
    } else if (action === 'demo-refresh') {
      refreshDemoState(trip);
      render();
      notice('Trip status updated.');
    } else if (action === 'demo-review-plan') {
      if (state.actor !== trip.owner || !roomBillsClosed(trip) || !trip.reviewQuote || hasPendingBills(trip)) return;
      const draft = fujiDraft(trip);
      if (draft) paymentReviewSheet(trip, draft, 'demo-publish');
    } else if (action === 'demo-publish') {
      if (state.actor !== trip.owner || !trip.reviewQuote || hasPendingBills(trip)
        || String(trip.revision) !== selection.revision || !roomBillsClosed(trip)) return;
      trip.demoPublishedRevision = trip.revision;
      trip.demoPublishedAt = Date.now();
      trip.splitApprovals = [trip.owner];
      if (sheet.open) sheet.close();
      commit(trip);
    } else if (action === 'demo-start') {
      const funding = demoFunding(trip);
      if (state.actor !== trip.owner || !demoFundReady(trip) || funding.cancelled
        || funding.balances.some(units => units < trip.minimumUnits)) return;
      trip.depositDeadline = new Date(Date.now() - 120000).toISOString();
      trip.startTime = new Date(Date.now() - 60000).toISOString();
      commit(trip);
    }
  }

  function sendDemoReminder(trip, form) {
    if (form?.dataset.room !== trip.id || roomBillsClosed(trip)) return;
    const draft = readBillDraft(form);
    if (!draft?.label) return;
    const shortfalls = roomFundingShortfalls(trip, demoFunding(trip), draft).filter(item => item.id !== state.actor);
    for (const item of shortfalls) {
      const id = 'demo-reminder-' + Date.now() + '-' + item.id;
      const sameDraft = old => old.recipient === item.id && JSON.stringify(old.draft) === JSON.stringify(draft);
      trip.demoReminders = [...(trip.demoReminders || []).filter(old => !sameDraft(old)), {
        id, roomId: trip.id, recipient: item.id, units: item.units, draft,
        sender: member(state.actor).name, receivedAt: Date.now(),
      }];
    }
    save(trip);
    const feedback = form.querySelector('#bill-reminder-feedback');
    if (feedback) feedback.textContent = ui('Reminders sent in TripVault.');
    notice('Reminders sent in TripVault.');
  }

  function changeDemoBill(trip, type, fields, completed, fail) {
    refreshDemoState(trip);
    const actor = state.actor;
    const bill = trip.bills.find(item => item.id === fields.id);
    const creator = bill && (bill.createdBy || bill.payer);
    const voters = bill ? [...new Set([creator, bill.payer, ...bill.participants])] : [];
    const editable = bill && ['pending', 'disputed'].includes(bill.status);
    const reject = message => { fail(message); return null; };
    if (!trip.members.some(person => person.id === actor) || trip.settled || trip.reviewQuote) {
      return reject('This bill is closed for review.');
    }
    if (type !== 'bill.add' && (!bill || bill.status === 'rejected')) return reject('This bill is closed for review.');
    const stamp = Date.now();
    const eventId = () => 'demo-' + stamp + '-' + (trip.nextReviewEvent = (trip.nextReviewEvent || 0) + 1);
    const log = (kind, recipients, comment, id = eventId()) => {
      bill.notificationLog = [...(bill.notificationLog || []), {
        id, kind, actor, recipients: [...new Set(recipients)].filter(id => id !== actor),
        receivedAt: stamp, label: bill.label, comment,
      }].slice(-50);
    };
    const status = () => bill.cancellation ? 'cancellation' : bill.feedback?.length ? 'disputed'
      : bill.participants.every(id => bill.approvals.includes(id)) ? 'approved' : 'pending';
    if (type === 'bill.add' || type === 'bill.edit') {
      if (type === 'bill.edit' && (!editable || creator !== actor)) return reject('Only the bill creator can edit it.');
      const funding = roomBillFunding(trip, fields, type === 'bill.edit' ? bill.id : undefined);
      if (!funding.ready) return reject(funding.message);
      const next = {
        id: bill?.id ?? trip.nextBillId++, label: fields.label, amount: fields.amount, payer: fields.payer,
        participants: fields.participants, splitType: fields.splitType, customShares: fields.customShares,
        createdBy: actor, approvals: [], status: 'pending', reviewStartedAt: stamp, reviewBy: stamp + 86_400_000,
        feedbackLog: bill?.feedbackLog || [], notificationLog: bill?.notificationLog || [],
        history: bill ? [...(bill.history || []), {
          label: bill.label, amount: bill.amount, payer: bill.payer, feedback: bill.feedback || [],
        }].slice(-25) : [],
      };
      if (bill) trip.bills[trip.bills.indexOf(bill)] = next;
      else trip.bills.push(next);
    } else if (type === 'bill.feedback-vote') {
      const suggestion = bill.feedback?.find(item => item.id === fields.suggestion && item.author === fields.author);
      if (!editable || bill.status !== 'disputed' || !voters.includes(actor)
        || !suggestion || suggestion.author === actor || typeof fields.agree !== 'boolean') {
        return reject('This suggestion is closed for review.');
      }
      const responses = suggestion.responses || [];
      if (responses.find(item => item.member === actor)?.agree === fields.agree) return trip;
      suggestion.responses = [...responses.filter(item => item.member !== actor), { member: actor, agree: fields.agree }];
      log(fields.agree ? 'suggestion-agreed' : 'suggestion-disagreed', [suggestion.author, creator], suggestion.comment);
    } else if (type === 'bill.cancel') {
      if (!voters.includes(actor) || typeof fields.agree !== 'boolean') return reject('This bill is closed for review.');
      const existing = bill.cancellation;
      if (!fields.agree) {
        if (!existing) return reject('There is no request to remove this bill.');
        log('cancellation-declined', voters, existing.reason);
        delete bill.cancellation;
        bill.status = status();
        if (bill.status === 'pending') bill.reviewBy = stamp + 86_400_000;
      } else {
        if (!existing && (!String(fields.reason || '').trim() || String(fields.reason).length > 500)) {
          return reject('Enter a reason for cancellation.');
        }
        const cancellation = existing || { id: eventId(), previous: bill.status, votes: [],
          requestedBy: actor, reason: String(fields.reason).trim(), requestedAt: stamp };
        if (cancellation.votes.includes(actor)) return trip;
        cancellation.votes.push(actor);
        bill.cancellation = cancellation;
        bill.status = voters.every(id => cancellation.votes.includes(id)) ? 'rejected' : 'cancellation';
        if (!existing) log('cancellation-requested', trip.members.map(person => person.id), cancellation.reason, cancellation.id);
        if (bill.status === 'rejected') cancellation.resolvedAt = stamp;
      }
    } else if (type === 'bill.feedback' || type === 'bill.approve') {
      if (!bill.participants.includes(actor) || (!editable && !(type === 'bill.approve' && fields.approve === false && bill.status === 'approved'))) {
        return reject('This bill is closed for review.');
      }
      if (type === 'bill.feedback') {
        const comment = String(fields.comment || '').trim();
        if (!comment || comment.length > 500) return reject('Enter a reason or suggested change.');
        const active = bill.feedback || [];
        if (active.some(item => item.author === actor && item.comment === comment)) return trip;
        const feedback = { id: eventId(), author: actor, comment, receivedAt: stamp };
        bill.feedback = [...active.filter(item => item.author !== actor), feedback];
        bill.feedbackLog = [...(bill.feedbackLog || []), { ...feedback, label: bill.label,
          recipients: voters.filter(id => id !== actor) }].slice(-25);
        bill.approvals = bill.approvals.filter(id => id !== actor);
      } else {
        bill.feedback = (bill.feedback || []).filter(item => item.author !== actor);
        bill.approvals = fields.approve ? [...new Set([...bill.approvals, actor])] : bill.approvals.filter(id => id !== actor);
      }
      bill.status = status();
    } else return reject('This bill is closed for review.');
    invalidateSplit(trip);
    commit(trip);
    completed?.(trip);
    return trip;
  }

  function demoTripProgress(trip) {
    const funding = demoFunding(trip);
    if (funding.cancelled) return { step: 4, title: 'Trip cancelled',
      message: 'Open Wallet to check what you can take back.', view: 'wallet' };
    if (trip.settled) return { step: 4, title: 'Group payments complete',
      message: 'Open Wallet to send any remaining balance to your wallet.', view: 'wallet' };
    if (!demoFundReady(trip)) return { step: 0, title: 'Set up the trip fund',
      message: 'Open Wallet to create or link the fund for this trip.', view: 'wallet', shortcut: 'Go to vault setup' };
    if (!funding.started) return { step: 1, title: funding.balances.every(units => units >= trip.minimumUnits)
      ? 'Minimum deposits reached' : 'Waiting for deposits',
      message: 'Everyone must fund the trip before the deadline. Bills open at the scheduled start.', view: 'wallet' };
    if (Date.now() < roomEndTime(trip)) return { step: 2, title: 'Record shared expenses',
      message: 'Add payments made outside TripVault as bills.', view: 'bills' };
    if (hasPendingBills(trip)) return { step: 3, title: 'Finish bill reviews',
      message: 'Finish open bill reviews before making final payments.', view: 'bills' };
    return { step: 3, title: trip.reviewQuote ? 'Check final payments' : 'Prepare final payments',
      message: trip.reviewQuote ? 'Open Final split to check the latest approvals and top-ups.'
        : 'Open Final split to calculate and share what each person owes.', view: 'split' };
  }

  function demoWallet(trip) {
    const funding = demoFunding(trip);
    const units = depositUnits(trip, state.actor);
    const canDeposit = demoFundReady(trip) && !funding.closed
      && (!trip.depositDeadline || Date.now() < Date.parse(trip.depositDeadline) || funding.started);
    const canWithdraw = !funding.closed && units > 0
      && Date.now() < Math.min(Date.parse(trip.depositDeadline || trip.startTime), roomEndTime(trip));
    let controls = '';
    let content = '';
    if (!demoFundReady(trip)) {
      content = '<p class="notice">The organizer sets up the trip fund once everyone has joined.</p>';
      if (state.actor === trip.owner && !funding.cancelled) controls += btn('Deploy Fuji vault', 'demo-deploy');
    } else {
      if (canDeposit) controls += btn('Deposit USDC', 'deposit');
      if (canWithdraw) controls += btn('Withdraw my deposit', 'withdraw', { tone: 'secondary' });
      if ((trip.settled || funding.cancelled) && units > 0) controls += btn('Send ' + money(units) + ' to my wallet', 'claim');
      if (!trip.settled && !funding.cancelled) content += fujiDepositTiming({ timestamp: Math.floor(Date.now() / 1000),
        start: Date.parse(trip.startTime) / 1000, end: roomEndTime(trip) / 1000,
        minimum: trip.minimumUnits,
        depositDeadline: trip.depositDeadline ? Date.parse(trip.depositDeadline) / 1000 : undefined });
      if (funding.cancelled) content += '<p class="notice warn">Trip cancelled. At least one person was below the minimum at the deposit deadline. Each person can take back their own deposit.</p>';
    }
    const walletDetails = row(userText(member(state.actor).name), ui('Local demo'))
      + (demoFundReady(trip) ? row('Your balance in the trip fund', money(units)) : '');
    content += finalSplitDetails('funding', 'Funding progress', trip.members.map(person => row(userText(person.name),
      money(depositUnits(trip, person.id)), depositUnits(trip, person.id) >= trip.minimumUnits ? 'Minimum reached' : 'Below minimum')).join(''));
    return tripWalletPanel({ subtitle: 'These are simulated member balances, not real connected wallets.',
      walletDetails, content, controls,
      utilities: btn('Refresh balances', 'demo-refresh', { tone: 'ghost' }) });
  }

  function demoPaymentsPanel(trip, plan) {
    const pending = hasPendingBills(trip);
    const quote = trip.reviewQuote;
    const approved = trip.splitApprovals.includes(state.actor);
    const organizer = state.actor === trip.owner;
    const ended = Date.now() >= roomEndTime(trip);
    const published = trip.demoPublishedRevision === trip.revision;
    let message = '';
    let actions = '';
    let utilities = '';
    let reviewUtility = '';
    if (trip.settled) {
      const members = trip.members.map(person => person.id);
      const net = Object.fromEntries(members.map(id => [id, 0]));
      for (const transfer of plan.transfers) { net[transfer.from] -= transfer.units; net[transfer.to] += transfer.units; }
      message = fujiSettlementSummary(trip, { members, balances: members.map(id => depositUnits(trip, id)),
        payouts: trip.demoPayouts ? members.map(id => trip.demoPayouts[id]) : undefined, net: members.map(id => net[id]) }, true);
      const units = depositUnits(trip, state.actor);
      if (units > 0) actions = btn('Send ' + money(units) + ' to my wallet', 'claim');
    } else if (!ended) {
      message = '<p class="subtitle">Group payments can start after the trip ends.</p>'
        + '<p class="split-date">' + safe(formatTripTime(roomEndTime(trip))) + '</p>';
    } else if (pending) {
      message = '<p class="subtitle">Finish open bill reviews before making final payments.</p>';
      actions = btn('Review open bills', 'navigate', { data: 'data-view="bills"' });
    } else if (!quote) {
      message = '<p class="subtitle">The organizer prepares the split and locks the rate for approval.</p>';
      if (organizer) actions = btn('Calculate final amounts', 'prepare-split', { disabled: preparingTrip === trip });
    } else if (!published) {
      if (organizer) {
        actions = btn('Review payment amounts', 'demo-review-plan');
        reviewUtility = btn('Start a new review', 'reopen-split', { tone: 'ghost' });
      } else message = '<p class="subtitle">Waiting for the organizer to share the final amounts.</p>';
    } else {
      message = `<p class="subtitle">${trip.splitApprovals.length} of ${trip.members.length} approved.</p>`;
      actions = approved ? '' : btn('Approve my amount', 'approve-split', { disabled: plan.invalid });
      if (approved) utilities += btn('Undo my approval', 'revoke-split', { tone: 'danger cancel-approval' });
      const shortfall = plan.shortfalls.find(person => person.id === state.actor);
      if (approved && !shortfall) {
        if (trip.splitApprovals.length < trip.members.length || plan.shortfalls.length) message += '<p class="subtitle">Waiting for other members to approve or top up.</p>';
        else if (!organizer) message += '<p class="subtitle">The organizer can make the group payments now.</p>';
      }
      if (shortfall) actions += btn('Top up ' + money(shortfall.units), 'quick-top-up', {
        data: `data-trip="${safe(trip.id)}" data-member="${safe(state.actor)}" data-revision="${trip.revision}" data-units="${shortfall.units}"`,
      });
      if (organizer) {
        if (canSettle(trip, plan)) actions += btn('Make group payments', 'settle');
        reviewUtility = btn('Start a new review', 'reopen-split', { tone: 'ghost' });
      }
      if (plan.shortfalls.length) message += `<p class="subtitle">Top up the following balances before settlement.</p>
        ${plan.shortfalls.map(person => row(userText(member(person.id).name), money(person.units))).join('')}`;
      if (plan.invalid) message += '<p class="notice warn">The current transfers cannot be represented in USDC. Reopen the split and check the rate before settling.</p>';
    }
    const net = Object.fromEntries(trip.members.map(person => [person.id, 0]));
    for (const transfer of plan.transfers) {
      net[transfer.from] -= transfer.units;
      net[transfer.to] += transfer.units;
    }
    const personalAmount = quote && published && !trip.settled ? `<div class="split-amount"><span>Your amount</span><strong>${fujiPaymentAmount(net[state.actor])}</strong></div>` : '';
    const paymentDetails = quote && published && !trip.settled ? trip.members.map(person => row(userText(person.name), fujiPaymentAmount(net[person.id]),
      trip.splitApprovals.includes(person.id) ? 'Approved' : 'Waiting for approval')).join('') : '';
    return groupPaymentsPanel({ personalAmount, message, actions, paymentDetails,
      utilities: utilities + btn('Refresh status', 'demo-refresh', { tone: 'ghost' }) + reviewUtility,
      details: '<p class="subtitle">These are simulated member balances, not real connected wallets.</p>'
        + row(userText(member(state.actor).name), money(depositUnits(trip, state.actor))) });
  }

  const vietnamesePatterns = [
    [/^Deposited ([\d.,]+ USDC) · (Receives|Pays|Net) ([\d.,]+ USDC) · (.+)$/, (_, deposit, kind, amount, status) => 'Đã nạp ' + deposit + ' · ' + ({ Receives: 'Nhận ', Pays: 'Trả ', Net: 'Chênh lệch ' })[kind] + amount + ' · ' + ui(status)],

    [/^Claimed ([\d.,]+ USDC) \(simulation\)$/, (_, amount) => 'Đã nhận ' + amount + ' (mô phỏng)'],
    [/^(.+) · Current$/, (_, name) => name + ' · Đang chọn'],
    [/^(\d+) people$/, (_, count) => count + ' người'],
    [/^(\d+) members?( · (Shared room|Local demo))?$/, (_, count, suffix, kind) => count + ' thành viên' + (suffix ? ' · ' + ui(kind) : '')],

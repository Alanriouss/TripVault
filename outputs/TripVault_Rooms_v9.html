<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#f7f7fb" name="theme-color"/>
<meta content="Shared trip fund for groups: deposit USDC upfront, log bills as you go, and settle everyone in one step." name="description"/>
<title>TripVault · Shared Trip Fund</title>
<style>:root {
  --page: #f7f7fb;
  --paper: #fff;
  --ink: #211b35;
  --muted: #625b75;
  --subtle: #767085;
  --line: #e8e4ef;
  --accent: #5d45bf;
  --accent-dark: #4a339f;
  --tint: #eee9ff;
  --positive: #146b53;
  --positive-bg: #e7f6ee;
  --warning: #86531a;
  --warning-bg: #fff3dd;
  --danger: #a5374c;
  --danger-bg: #fff0f3;
  --radius: 20px;
  --shadow: 0 4px 16px #211b3506;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--page);
  font-synthesis: none;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 0; line-height: 1.45; }
body:has(dialog[open]) { overflow: hidden; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #a491ed; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.18; letter-spacing: -.035em; }
a { color: var(--accent-dark); }
small { font-size: 12px; }
.skip { position: fixed; z-index: 9; top: 8px; left: 8px; padding: 12px; background: white; transform: translateY(-160%); }
.skip:focus { transform: none; }
.shell { min-height: 100vh; }
.sidebar { display: none; }
.header { position: sticky; top: 0; z-index: 3; background: #f7f7fbf2; border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 65px; padding: 0 18px; }
.wordmark { display: inline-flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 810; letter-spacing: -.05em; }
.brand-mark { display: inline-grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; background: var(--accent); color: white; font-size: 16px; line-height: 1; }
.brand-mark::before { content: ""; width: 13px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; box-shadow: 3px -3px 0 -1px var(--accent), 4px -4px 0 -1px currentColor; }
.header-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.breadcrumb { display: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%; padding: 5px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.25; background: #f2eff8; color: #5f547b; }
.chip.green { color: var(--positive); background: var(--positive-bg); }
.chip.warn { color: var(--warning); background: var(--warning-bg); }
.chip.violet { color: var(--accent-dark); background: var(--tint); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.avatar { --av-bg: #e9dfff; --av-ink: #593cb0; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--av-bg); color: var(--av-ink); font-size: 13px; font-weight: 760; flex: 0 0 auto; }
.avatar.tone-1 { --av-bg: #e1f2e8; --av-ink: #21664b; }
.avatar.tone-2 { --av-bg: #ffe9dc; --av-ink: #8f482f; }
.avatar.tone-3 { --av-bg: #e5edff; --av-ink: #365893; }
.avatar-button { display: grid; place-items: center; background: transparent; border: 0; padding: 0; width: 44px; height: 44px; border-radius: 50%; }
.avatar-button:hover { background: var(--tint); }
.main { padding: 18px 16px 102px; width: min(100%, 1140px); margin: 0 auto; }

.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,#17112ae0 0%,#25193694 55%,#25203c2e 100%), linear-gradient(0deg,#18122bb3,transparent 65%); }
.hero .chip { color: #fff; background: #1f163b7f; border: 1px solid #ffffff52; backdrop-filter: blur(10px); }
.hero h1 { font-size: clamp(29px,7vw,49px); font-weight: 780; margin: 0 0 4px; overflow-wrap: anywhere; }
.hero-meta { display: flex; align-items: center; gap: 9px; color: #f1eafa; font-size: 13px; }
.avatar-stack { display: flex; padding-left: 3px; }
.avatar-stack .avatar { width: 24px; height: 24px; font-size: 10px; margin-left: -3px; border: 1.5px solid #3c3255; }
.metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin: 13px 0 0; }
.metric, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.metric { padding: 13px; }
.metric:last-child { grid-column: 1 / -1; background: #f0ebff; border-color: #e5dbfb; display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.metric-name { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 630; }
.metric strong { display: block; margin-top: 5px; font-size: clamp(20px,5.1vw,29px); letter-spacing: -.055em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.16; }
.metric:last-child strong { margin: 0; }
.metric small { margin-left: 3px; color: var(--muted); font-size: 10px; letter-spacing: 0; font-weight: 650; }
.icon { width: 19px; height: 19px; flex: 0 0 19px; display: inline-grid; place-items: center; position: relative; font-weight: 650; font-size: 18px; line-height: 1; }
.icon::before, .icon::after { box-sizing: border-box; }
.i-home::before { content: ""; width: 13px; height: 12px; border: 1.6px solid; border-top: 0; border-radius: 0 0 3px 3px; position: absolute; bottom: 2px; }
.i-home::after { content: ""; width: 10px; height: 10px; border-top: 1.6px solid; border-left: 1.6px solid; transform: rotate(45deg); position: absolute; top: 2px; }
.i-people::before { content: ""; width: 7px; height: 7px; border: 1.5px solid; border-radius: 50%; position: absolute; left: 4px; top: 1px; box-shadow: 6px 1px 0 -1px currentColor; }
.i-people::after { content: ""; width: 15px; height: 7px; border: 1.5px solid; border-bottom: 0; border-radius: 8px 8px 0 0; position: absolute; bottom: 2px; }
.i-bill::before { content: ""; width: 12px; height: 15px; border: 1.5px solid; border-radius: 2px; }
.i-bill::after { content: ""; position: absolute; width: 6px; height: 5px; border-top: 1.5px solid; border-bottom: 1.5px solid; }
.i-wallet::before { content: ""; width: 15px; height: 11px; border: 1.5px solid; border-radius: 3px; }
.i-wallet::after { content: ""; width: 3px; height: 3px; border-radius: 50%; background: currentColor; position: absolute; right: 4px; }
.i-split::before { content: "⇄"; }
.i-plus::before { content: "+"; }
.i-arrow::before { content: "→"; }
.i-back::before { content: "←"; }
.i-check::before { content: "✓"; }
.i-close::before { content: "×"; font-size: 22px; font-weight: 450; }
.i-link::before { content: "↗"; }
.panel { padding: 16px; }
.panel-head, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-head { margin-bottom: 11px; }
.panel-head h2, .section-head h2 { font-size: 20px; }
.panel-head p, .section-head p { color: var(--muted); font-size: 13px; margin-top: 5px; }
.section-head { margin: 0 0 16px; }
.section-head h1 { font-size: clamp(29px,7vw,40px); }
.section-head > div { min-width: 0; }
.overview-grid { display: grid; gap: 13px; margin-top: 13px; }
.overview-grid .next-card { order: -1; }
.overview-grid .pending-card { order: -1; }
.pending-card { display: grid; align-content: start; gap: 10px; }
.pending-card .panel-head { margin-bottom: 0; flex-wrap: wrap; }
.pending-card > .row { padding-top: 0; }
.next-card { display: grid; align-content: start; gap: 8px; }
.next-card h2 { font-size: 19px; }
.next-card p { color: var(--muted); font-size: 13px; }
.next-card .btn { width: fit-content; margin-top: 4px; }
.next-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--tint); color: var(--accent-dark); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; border: 1px solid transparent; border-radius: 12px; background: var(--accent); color: white; font-weight: 700; font-size: 13px; text-align: center; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--accent-dark); }
.btn.secondary { border-color: var(--line); background: white; color: var(--ink); }
.btn.secondary:hover:not(:disabled) { background: #f4f1fa; }
.btn.soft { background: var(--tint); color: var(--accent-dark); }
.btn.soft:hover:not(:disabled) { background: #e4dbfd; }
.btn.ghost { background: transparent; color: var(--accent-dark); padding: 0 8px; }
.btn.ghost:hover:not(:disabled) { background: var(--tint); }
.btn.danger { background: var(--danger-bg); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: #fbe1e8; }
.btn.full { width: 100%; }
.icon-button { width: 44px; min-width: 44px; min-height: 44px; padding: 0; }
.row, .bill-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; min-width: 0; }
.row + .row, .bill-row + .bill-row { border-top: 1px solid var(--line); }
.row { padding: 12px 0; }
.row:last-child { padding-bottom: 1px; }
.row-name, .bill-name { display: block; font-weight: 730; font-size: 14px; overflow-wrap: anywhere; }
.row-sub, .bill-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.row-label { display: flex; align-items: center; gap: 9px; min-width: 0; }
.row-value { font-size: 14px; font-weight: 760; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.row-value small { display: block; color: var(--muted); font-weight: 530; }
.bill-row { border: 0; width: 100%; background: transparent; text-align: left; color: var(--ink); padding: 12px 0; }
.bill-row:hover { background: #faf8ff; }
.bill-badge { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 12px; color: var(--accent-dark); background: var(--tint); }
/* nth-child bill-badge alternate removed in favor of status-based color */
.empty { padding: 17px 0; color: var(--muted); font-size: 14px; }
.stack { display: grid; gap: 13px; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.member-progress { height: 5px; margin-top: 8px; border-radius: 99px; background: #eeeaf5; overflow: hidden; }
.member-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.funding-summary { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.funding-summary strong { display: block; font-size: 29px; letter-spacing: -.045em; }
.funding-summary p { color: var(--muted); font-size: 13px; }
.notice { padding: 12px 13px; border-radius: 12px; font-size: 13px; background: var(--tint); color: #483489; }
.notice.warn { color: var(--warning); background: var(--warning-bg); }
.notice.danger { color: var(--danger); background: var(--danger-bg); }
.notice.green { color: var(--positive); background: var(--positive-bg); }
.vault-alert { display: flex; align-items: center; gap: 11px; }
.vault-alert .next-mark { flex: 0 0 34px; background: #ffebc6; color: var(--warning); }
.vault-alert p { margin-top: 2px; }
.metrics + .vault-alert { margin-top: 12px; }
.money-positive { color: var(--positive); }
.money-negative { color: var(--danger); }
.mobile-nav { position: fixed; z-index: 4; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 4px; padding: 7px 10px max(7px,env(safe-area-inset-bottom)); background: #fffffffa; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px #211b3508; }
.nav-btn { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; border: 0; border-radius: 13px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 680; min-height: 50px; padding: 6px 4px; }
.nav-btn[aria-current="page"] { color: var(--accent-dark); background: var(--tint); }
.nav-btn:hover:not([aria-current]) { background: #f4f1f9; }
.wizard { max-width: 600px; margin: 18px auto 0; }
.wizard-step { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); list-style: none; margin: 0 0 16px; padding: 0; gap: 6px; }
.wizard-step li { border-bottom: 3px solid #e1dce9; padding: 9px 4px; font-size: 12px; font-weight: 680; color: var(--muted); }
.wizard-step li.current { border-color: var(--accent); color: var(--accent-dark); }
.wizard h1 { font-size: 31px; margin: 0 0 7px; }
.wizard .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.field { display: grid; gap: 5px; font-weight: 700; font-size: 13px; min-width: 0; }
.field > input, .field > select, .input-affix { width: 100%; min-width: 0; min-height: 45px; border: 1px solid #d9d3e5; border-radius: 11px; background: white; color: var(--ink); padding: 9px 11px; font-size: 16px; font-weight: 520; }
.input-affix { display: flex; align-items: center; gap: 6px; padding: 0 11px; }
.input-affix input { background: transparent; padding: 8px 0; border: 0; flex: 1 1 60px; min-width: 0; width: 100%; color: var(--ink); }
.input-affix span { font-size: 11px; color: var(--muted); font-weight: 700; }
.input-affix:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px #e6dbff; }
.input-affix input:focus { outline: 0; }
.form-error { color: var(--danger); font-size: 13px; }
.form-error:empty { display: none; }
.wizard-footer { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 15px; }
.form-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: end; gap: 8px; }
dialog { width: min(100%,540px); max-width: 100%; margin: auto auto 0; padding: 0; border: 0; border-radius: 24px 24px 0 0; color: var(--ink); background: white; box-shadow: 0 12px 56px #221a354d; max-height: min(94dvh,850px); overflow: auto; overscroll-behavior: contain; }
dialog::backdrop { background: #21163472; backdrop-filter: blur(3px); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 17px; border-bottom: 1px solid var(--line); background: white; }
.sheet-head h2 { font-size: 24px; }
.sheet-head p { color: var(--muted); font-size: 12px; margin-top: 4px; }
.sheet-body { padding: 15px 17px; display: grid; gap: 13px; }
.sheet-footer { position: sticky; bottom: 0; z-index: 1; padding: 10px 17px max(11px,env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: white; }
.sheet-footer .btn { min-height: 47px; }
.guide-steps { display: grid; gap: 10px; margin: 0; padding-inline-start: 22px; }
.guide-steps li { padding-inline-start: 3px; font-size: 14px; }
.guide-steps li::marker { color: var(--accent-dark); font-weight: 700; }
.guide-steps strong { display: block; }
.guide-steps p { color: var(--muted); margin-top: 3px; }
.top-up-actions { margin-top: 8px; }
.top-up-actions .btn { white-space: normal; }
@media (max-width: 390px) {
  .header-demo { display: none; }

  const UINT256 = 1n << 256n;
  const REFUND_DELAY = 7 * 86400;
  const walletSession = {
    provider: null, name: '', account: '', chain: '', status: null, busy: false, vault: null,
    providers: new Map(), choices: [], listeners: [], generation: 0, vaultRead: 0, readingVault: false,
  };

  function isAddress(value) {
    return /^0x[0-9a-f]{40}$/i.test(value || '') && !/^0x0{40}$/i.test(value);
  }

  function isHash(value) {
    return /^0x[0-9a-f]{64}$/i.test(value || '');
  }

  function abiWord(value) {
    const number = BigInt(value);
    return (number < 0n ? UINT256 + number : number).toString(16).padStart(64, '0');
  }

  function abiArray(values) {
    return abiWord(values.length) + values.map(abiWord).join('');
  }

  function vaultCall(name, ...values) {
    return '0x' + VAULT.selectors[name] + values.map(abiWord).join('');
  }

  function abiDecodeSnapshot(result) {
    if (typeof result !== 'string' || !/^0x[0-9a-f]+$/i.test(result) || (result.length - 2) % 64) {
      throw new Error('Unexpected response from the Fuji vault.');
    }
    const data = result.slice(2);
    const word = index => {
      const hex = data.slice(index * 64, (index + 1) * 64);
      if (hex.length !== 64) throw new Error('Incomplete Fuji vault response.');
      return hex;
    };
    const number = index => Number(BigInt('0x' + word(index)));
    const array = (slot, convert) => {
      const offset = number(slot) / 32;
      const size = number(offset);
      if (!Number.isInteger(offset) || !Number.isInteger(size) || size < 0 || size > 12) {
        throw new Error('Unexpected member list in the Fuji vault.');
      }
      return Array.from({ length: size }, (_, index) => convert(word(offset + 1 + index)));
    };
    return {
      members: array(0, hex => '0x' + hex.slice(24).toLowerCase()),
      balances: array(1, hex => Number(BigInt('0x' + hex))),
      net: array(2, hex => {
        const units = BigInt('0x' + hex);
        return Number(units >= UINT256 / 2n ? units - UINT256 : units);
      }),
      approvals: array(3, hex => BigInt('0x' + hex) === 1n),
      hash: '0x' + word(4),
      start: number(5), end: number(6), minimum: number(7), settled: number(8) === 1,
    };
  }

  function walletProviders() {
    const discovered = [...walletSession.providers.values()];
    const legacy = [window.avalanche, ...(window.ethereum?.providers || [window.ethereum])];
    for (const provider of legacy) {
      if (!provider?.request || discovered.some(option => option.provider === provider)) continue;
      discovered.push({ provider, name: provider === window.avalanche ? 'Core' : provider.isMetaMask ? 'MetaMask' : 'Browser wallet' });
    }
    return discovered;
  }

  function discoverWallets() {
    window.addEventListener('eip6963:announceProvider', event => {
      const { info, provider } = event.detail || {};
      if (info?.uuid && typeof provider?.request === 'function') {
        walletSession.providers.set(info.uuid, { provider, name: String(info.name || 'Browser wallet') });
      }
    });
    requestWalletAnnouncements();
  }

  function requestWalletAnnouncements() {
    if (typeof window.dispatchEvent === 'function') {
      window.dispatchEvent(new Event('eip6963:requestProvider'));
    }
  }

  function request(provider, method, params) {
    return provider.request(params ? { method, params } : { method });

  function walletAccessDenied(error) {
    return Number(error?.code) === 4100

  function walletError(error) {
    if (walletAccessDenied(error)) return 'Allow TripVault to use this account in your wallet, then try again.';
    if (error?.code === 4001 || error?.code === 'ACTION_REJECTED') return 'Request declined in your wallet.';
    if (error?.code === -32002) return 'A wallet request is already open. Check your wallet extension.';
    const message = error?.shortMessage || error?.message || error?.data?.originalError?.message || 'Wallet request failed.';
    const rpcDetails = [message, error?.message, error?.data?.message, error?.data?.originalError?.message, error?.cause?.message].join(' ');

      const expected = normalizeFujiNonce(rpcDetails.match(/next nonce\s*:?\s*(0x[0-9a-f]+|[0-9]+)/i)?.[1]);
      const next = expected === null ? '' : ' Fuji reported the next number was ' + BigInt(expected) + '.';
      return 'Fuji already used this transaction number.' + next
        + ' Check wallet Activity for a confirmed deployment before trying again. You can link a confirmed vault.';
    }
    return String(message).slice(0, 260);
  }

  function walletStatus(tripId, phase, label, message = '', hash = '') {
    walletSession.status = { tripId, phase, label, message, hash };
    render();
  }

  function clearWallet() {
    for (const [provider, event, listener] of walletSession.listeners) provider.removeListener?.(event, listener);
    walletSession.listeners = [];
    walletSession.provider = null;
    walletSession.name = '';
    walletSession.account = '';
    walletSession.chain = '';
    walletSession.vault = null;
    walletSession.status = null;
    walletSession.generation++;
  }

  async function syncWallet(provider) {
    if (walletSession.provider !== provider) return;
    const generation = ++walletSession.generation;
    walletSession.vault = null;
    try {
      const [accounts, chain] = await Promise.all([
        request(provider, 'eth_accounts'), request(provider, 'eth_chainId'),
      ]);
      if (walletSession.provider !== provider || walletSession.generation !== generation) return;
      walletSession.account = isAddress(accounts?.[0]) ? accounts[0].toLowerCase() : '';
      walletSession.chain = String(chain).toLowerCase();
      roomWalletChanged();
      render();
      await refreshVault();
    } catch (error) {
      if (walletSession.provider !== provider || walletSession.generation !== generation) return;
      walletSession.account = '';
      walletSession.chain = '';
      roomWalletChanged();
      walletStatus(state.trip?.id, 'failed', 'Wallet connection', walletError(error));
    }
  }

  async function connectWallet(option) {
    if (!option || walletSession.busy) return;
    const { provider, name } = option;
    if (sheet.open) sheet.close();
    clearWallet();
    walletSession.busy = true;
    walletStatus(state.trip?.id, 'signature', 'Connect wallet', 'Approve the connection in your wallet.');
    try {
      const accounts = await request(provider, 'eth_requestAccounts');
      if (!isAddress(accounts?.[0])) throw new Error('Your wallet did not provide an account.');
      walletSession.provider = provider;
      walletSession.name = name;
      const changed = () => { syncWallet(provider); };
      const disconnected = () => { clearWallet(); roomWalletChanged(); render(); };
      for (const [event, listener] of [['accountsChanged', changed], ['chainChanged', changed], ['disconnect', disconnected]]) {
        provider.on?.(event, listener);
        walletSession.listeners.push([provider, event, listener]);
      }
      walletSession.status = null;
      await syncWallet(provider);
    } catch (error) {
      clearWallet();
      walletStatus(state.trip?.id, error?.code === 4001 ? 'rejected' : 'failed', 'Connect wallet', walletError(error));
    } finally {
      walletSession.busy = false;
      render();
    }
  }

  function chooseWallet() {
    requestWalletAnnouncements();
    const providers = walletProviders();
    walletSession.choices = providers;
    if (!providers.length) {
      const help = window.location?.protocol === 'file:'
        ? 'Open TripVault through the Rooms launcher to use it at http://127.0.0.1:8788/.'
        : 'Check that MetaMask or Core is enabled in this Firefox window, then reload this page.';
      sheetOpen('Connect Wallet', 'Avalanche Fuji testnet',
        '<p class="notice warn">No browser wallet detected. ' + help + '</p>',
        btn('Try again', 'fuji-connect', { tone: 'full' }),
      );
      return;
    }
    sheetOpen('Connect Wallet', 'Choose a wallet', '<div class="stack">' +
      providers.map((option, index) => btn(option.name, 'fuji-wallet-option', {
        tone: 'secondary full', data: 'data-id="' + index + '"',
      })).join('') + '</div>');
  }

  async function switchToFuji() {
    const provider = walletSession.provider;
    if (!provider || walletSession.busy) return;
    walletSession.busy = true;
    walletStatus(state.trip?.id, 'signature', 'Switch to Fuji', 'Approve the network change in your wallet.');
    try {
      try {
        await request(provider, 'wallet_switchEthereumChain', [{ chainId: FUJI.id }]);
      } catch (error) {
        if (Number(error?.code) !== 4902 && Number(error?.data?.originalError?.code) !== 4902) throw error;
        await request(provider, 'wallet_addEthereumChain', [{
          chainId: FUJI.id, chainName: 'Avalanche Fuji C-Chain',
          nativeCurrency: { name: 'Avalanche', symbol: 'AVAX', decimals: 18 },
          rpcUrls: [FUJI.rpc], blockExplorerUrls: [FUJI.explorer],
        }]);
        if (String(await request(provider, 'eth_chainId')).toLowerCase() !== FUJI.id) {
          await request(provider, 'wallet_switchEthereumChain', [{ chainId: FUJI.id }]);
        }
      }
      walletSession.status = null;
      await syncWallet(provider);
    } catch (error) {
      walletStatus(state.trip?.id, error?.code === 4001 ? 'rejected' : 'failed', 'Switch to Fuji', walletError(error));
    } finally {
      walletSession.busy = false;
      render();
    }
  }

  function walletContext() {
    return {
      provider: walletSession.provider, account: walletSession.account, tripId: state.trip?.id,
      vault: state.trip?.fuji?.address, shared: state.trip?.shared === true,
      depositDeadline: state.trip?.depositDeadline ? Math.floor(Date.parse(state.trip.depositDeadline) / 1000) : null,
    };
  }

  async function checkWallet(context) {
    if (!context.provider || !isAddress(context.account) || walletSession.provider !== context.provider) {
      throw new Error('Connect a wallet first.');
    }
    const [accounts, chain] = await Promise.all([
      request(context.provider, 'eth_accounts'), request(context.provider, 'eth_chainId'),
    ]);
    if (String(chain).toLowerCase() !== FUJI.id) throw new Error('Switch your wallet to Avalanche Fuji.');
    if (accounts?.[0]?.toLowerCase() !== context.account) throw new Error('The wallet account changed. Try again.');
  }

  function ethCall(context, address, data, block = 'latest') {
    return request(context.provider, 'eth_call', [{ to: address, data }, block]);
  }

  function fujiContractVersion(code) {
    const runtime = code?.toLowerCase();
    if (runtime === '0x' + VAULT.deadlineRuntime) return 3;
    if (runtime === '0x' + VAULT.runtime) return 2;
    return runtime === '0x' + VAULT.legacyRuntime ? 1 : 0;
  }

  function decodeFujiPayouts(raw, count) {
    const data = raw.slice(2);
    const value = index => Number(BigInt('0x' + data.slice(index * 64, (index + 1) * 64)));
    if (data.length !== (count + 2) * 64 || value(0) !== 32 || value(1) !== count) {
      throw new Error('Could not read the Fuji payout amounts.');
    }
    return Array.from({ length: count }, (_, index) => value(index + 2));
  }

      request(context.provider, 'eth_getCode', [context.vault, tag]),

      throw new Error('Could not read the Fuji vault.');
    }
    let refundDeadline = snapshot.end + REFUND_DELAY;
    const timestamp = Number(BigInt(block.timestamp));
    const depositDeadline = version === 3 ? context.depositDeadline : null;
    let cancelled = false;
    let payouts;
    if (version >= 2) {
      refundDeadline = Number(BigInt(await ethCall(context, context.vault, vaultCall('refundDeadline()'), tag)));
      if (snapshot.settled) {
        const rawPayouts = await ethCall(context, context.vault, vaultCall('payoutSnapshot()'), tag);
        payouts = decodeFujiPayouts(rawPayouts, snapshot.members.length);
      }
    }
    if (depositDeadline && timestamp >= depositDeadline) {
      cancelled = BigInt(await ethCall(context, context.vault, vaultCall('fundingFailed()'), tag)) === 1n;
    }
    await checkWallet(context);
    return {
      ...snapshot, version, refundDeadline, payouts, timestamp, depositDeadline, cancelled, usdc: BigInt(rawUsdc),
      account: context.account, address: context.vault, tripId: context.tripId,
    };
  }

  function currentVault() {
    const saved = walletSession.vault;
    if (walletSession.chain !== FUJI.id || !saved || saved.tripId !== state.trip?.id
      || saved.address !== state.trip?.fuji?.address || saved.account !== walletSession.account) return null;
    return saved;
  }

  function vaultViewState(vault) {
    if (!vault) return '';
    return JSON.stringify([
      vault.tripId, vault.account, vault.address, vault.version, vault.hash, vault.balances,
      vault.approvals, vault.net, vault.payouts, vault.settled, vault.cancelled, vault.usdc.toString(), vault.end,
      vault.depositDeadline && vault.timestamp >= vault.depositDeadline,
      vault.timestamp < vault.start, vault.timestamp >= vault.end, vault.timestamp >= vault.refundDeadline,
    ]);
  }

  async function refreshVault(silent = false) {
    const context = walletContext();
    const generation = walletSession.generation;
    if (!context.vault || !context.account || walletSession.chain !== FUJI.id
      || (silent && walletSession.readingVault)) return;
    const read = ++walletSession.vaultRead;
    walletSession.readingVault = true;
    const stillCurrent = () => walletSession.vaultRead === read && walletSession.generation === generation
      && state.trip?.id === context.tripId && walletSession.account === context.account
      && state.trip.fuji?.address === context.vault;
    try {
      const result = await fetchVault(context);
      if (stillCurrent()) {
        const changed = vaultViewState(currentVault()) !== vaultViewState(result);
        walletSession.vault = result;
        if (changed || !silent) render();
        return true;
      }
    } catch (error) {
      if (stillCurrent() && !silent) {
        walletSession.vault = null;
        if (!walletSession.busy) walletStatus(context.tripId, 'failed', 'Read Fuji vault', walletError(error));
      }
    } finally {
      if (walletSession.vaultRead === read) walletSession.readingVault = false;
    }
  }

  function rememberFujiTx(tripId, tx, address) {
    if (tripId?.startsWith('room-')) return rememberRoomTransaction(tripId, tx);
    syncTrips();
    const trip = state.trip?.id === tripId ? state.trip : availableTrips().find(item => item.id === tripId);
    if (!trip) return;
    if (trip.shared) return rememberRoomTransaction(trip.id, tx);
    trip.fuji = { ...trip.fuji, lastTx: tx };
    if (address) trip.fuji.address = address;
    if (tx.kind === 'fuji-publish' && tx.phase === 'confirmed') trip.fuji.publishedRevision = tx.revision;
    save(trip);
  }

  function transactionStatus(context, tx, phase, message, address) {
    const record = { ...tx, phase, message };
    if (record.hash) rememberFujiTx(context.tripId, record, address);
    walletStatus(context.tripId, phase, record.label, message, record.hash);
  }

  async function checkReceipt(context, tx, wait) {
    try {
      const attempts = wait ? 15 : 1;
      for (let attempt = 0; attempt < attempts; attempt++) {
        if (attempt) await new Promise(resolve => setTimeout(resolve, 1500));
        if (String(await request(context.provider, 'eth_chainId')).toLowerCase() !== FUJI.id) break;
        const receipt = await request(context.provider, 'eth_getTransactionReceipt', [tx.hash]);
        if (!receipt) continue;
        if (receipt.transactionHash?.toLowerCase() !== tx.hash.toLowerCase()
          || receipt.from?.toLowerCase() !== tx.from || !['0x0', '0x1'].includes(receipt.status)) {
          throw new Error('Unexpected Fuji transaction receipt.');
        }
        if (receipt.status === '0x0') {
          transactionStatus(context, tx, 'failed', 'The transaction reverted on Fuji.');
          return false;
        }
        if (tx.kind === 'deploy') {
          if (!isAddress(receipt.contractAddress)) throw new Error('Missing vault address in the Fuji receipt.');
          const code = await request(context.provider, 'eth_getCode', [receipt.contractAddress, 'latest']);
          if (!fujiContractVersion(code)) {
            transactionStatus(context, tx, 'failed', 'Fuji confirmed the transaction, but the deployed code could not be verified.');
            return false;
          }
        }
        await verifyRoomTransaction(context, tx);
        transactionStatus(context, tx, 'confirmed', 'Confirmed on Avalanche Fuji.',
          tx.kind === 'deploy' ? receipt.contractAddress.toLowerCase() : undefined);
        return true;
      }
      transactionStatus(context, tx, 'pending', 'Awaiting a Fuji receipt. Use Check transaction to refresh.');
    } catch (error) {
      transactionStatus(context, tx, 'pending', 'Receipt not available. ' + walletError(error));
    }
    return false;
  }

  function normalizeFujiNonce(value) {
    if (value && typeof value === 'object') value = value.result;
    const valid = typeof value === 'bigint' || (typeof value === 'number' && Number.isSafeInteger(value))
      || (typeof value === 'string' && /^(?:0x[0-9a-f]+|[0-9]+)$/i.test(value.trim()));
    if (!valid) return null;
    const count = BigInt(value);
    if (count < 0n || count >= (1n << 64n)) return null;
    return '0x' + count.toString(16);
  }

  async function nextFujiNonce(context) {
    if (context.shared) {
      if (rooms.account !== context.account || !rooms.token) return null;
      try {
        const result = await roomApi('/wallet/fuji-nonce');
        return normalizeFujiNonce(result.nonce);
      } catch {
        // Leave the number to the wallet if the server cannot verify it on Fuji.
        return null;
      }
    }
    let timeout;
    try {
      const result = await Promise.race([
        request(context.provider, 'eth_getTransactionCount', [context.account, 'pending']),
        new Promise(resolve => { timeout = setTimeout(() => resolve(null), 3000); }),
      ]);
      const nonce = normalizeFujiNonce(result);
      if (nonce !== null) return nonce;
    } catch {
      // Leave the number to the wallet in the standalone demo.
    } finally {
      clearTimeout(timeout);
    }
    return null;
  }

  function fujiGasFailure(error) {
    const nested = error?.data?.originalError;
    const parts = [error?.message, nested?.message, error?.data?.message, error?.data, nested?.data]
      .filter(value => typeof value === 'string').join(' ');
    if (/0xdba16ce8|InvalidSchedule/i.test(parts)) {
      return 'Fuji rejected the trip schedule. Check the deposit deadline, start time, and end time.';
    }
    if (/insufficient funds|insufficient balance|funds for gas/i.test(parts)) {
      return 'This wallet needs more Fuji test AVAX to pay the network fee.';
    }
    if (error?.code === 3 || nested?.code === 3 || /execution reverted|will fail|always failing transaction/i.test(parts)) {
      return 'Fuji would reject this transaction. Check the trip status and try again.';
    }
    return '';
  }

  async function estimateFujiGas(context, transaction) {
    const valid = value => typeof value === 'string' && /^0x[0-9a-f]+$/i.test(value)
      && BigInt(value) >= 21_000n && BigInt(value) < (1n << 64n);
    let estimate;
    let timeout;
    try {
      estimate = await Promise.race([
        request(context.provider, 'eth_estimateGas', [transaction]),
        new Promise(resolve => { timeout = setTimeout(() => resolve(null), 3000); }),
      ]);
    } catch (error) {
      const reason = fujiGasFailure(error);
      if (reason) throw new Error(reason);
    } finally {
      clearTimeout(timeout);
    }
    if (!valid(estimate)) {
      const controller = new AbortController();
      const stop = setTimeout(() => controller.abort(), 5000);
      let result;
      try {
        const response = await fetch(FUJI.rpc, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_estimateGas', params: [transaction] }),
        });
        if (response.ok) result = await response.json();
      } catch {
        // Report a missing estimate in TripVault if both sources are unavailable.
      } finally {
        clearTimeout(stop);
      }
      if (!valid(result?.result)) {
        throw new Error(fujiGasFailure(result?.error) || 'Could not estimate the Fuji network fee. Check your connection and try again.');
      }
      estimate = result.result;
    }
    const gas = (BigInt(estimate) * 115n + 99n) / 100n;
    return '0x' + gas.toString(16);
  }

  async function sendFuji(context, label, kind, to, data, revision) {
    await checkWallet(context);
    if (state.trip?.id !== context.tripId) throw new Error('Return to the original trip to continue.');
    const transaction = { from: context.account, data };
    if (to) transaction.to = to;
    const gas = await estimateFujiGas(context, transaction);
    await checkWallet(context);
    if (state.trip?.id !== context.tripId) throw new Error('Return to the original trip to continue.');
    const nonce = await nextFujiNonce(context);
    await checkWallet(context);
    if (state.trip?.id !== context.tripId) throw new Error('Return to the original trip to continue.');
    if (kind === 'deploy' && context.depositDeadline && Date.now() >= context.depositDeadline * 1000) {
      throw new Error('The deposit deadline has passed.');
    }
    const params = { ...transaction, gas };
    const tx = { kind, label, from: context.account, revision };
    transactionStatus(context, tx, 'signature', 'Review and confirm in your wallet.');
    if (nonce !== null) params.nonce = nonce;
    const hash = await request(context.provider, 'eth_sendTransaction', [params]);
    if (!isHash(hash)) throw new Error('The wallet did not return a transaction hash.');
    tx.hash = hash;
    transactionStatus(context, tx, 'pending', 'Submitted. Waiting for a Fuji receipt.');
    return checkReceipt(context, tx, true);
  }

  async function withFuji(label, task, allowPending = false) {
    if (walletSession.busy || !state.trip) return;
    syncTrips();
    if (!allowPending && state.trip?.fuji?.lastTx?.phase === 'pending') {
      notice('Check the pending Fuji transaction first.');
      return;
    }
    const context = walletContext();
    walletSession.busy = true;
    render();
    try {
      await checkWallet(context);
      await task(context);
      await refreshVault();
    } catch (error) {
      walletStatus(context.tripId, error?.code === 4001 ? 'rejected' : 'failed', label, walletError(error));
    } finally {
      walletSession.busy = false;
      render();
      if (context.shared && state.trip?.id === context.tripId) refreshRoomFunding();
    }
  }

  function openFujiDeploy() {
    const trip = state.trip;
    if (!trip || trip.fuji?.address || state.actor !== trip.owner
      || walletSession.chain !== FUJI.id || !walletSession.account
      || (trip.shared && (!trip.locked || trip.members[0].address !== walletSession.account))) return;
    sheetOpen('Deploy Fuji vault', { user: trip.name },
      `<form id="fuji-deploy-form" class="stack">
        <p class="notice">This deploys a testnet vault for the wallets below. Verify each address before signing. Each wallet is responsible for its own deposits and approvals.</p>
        ${trip.shared ? roomMembers(trip) : trip.members.map((member, index) =>
          `<label class="field">${safe(member.name)}${index ? '' : ' · Organizer'}
            <input class="wallet-field" name="address" value="${index ? '' : walletSession.account}" placeholder="0x…" required pattern="0x[0-9a-fA-F]{40}" ${index ? '' : 'readonly'}>
          </label>`).join('')}
        <p id="sheet-error" class="form-error"></p>
      </form>`,
      '<button class="btn full" type="submit" form="fuji-deploy-form">Review deployment in wallet</button>',
    );
  }

  function deployFuji(data, fail) {
    const trip = state.trip;
    const members = trip?.shared ? trip.members.map(member => member.address)
      : data.getAll('address').map(value => String(value).trim().toLowerCase());
    if (!trip || trip.fuji?.address || state.actor !== trip.owner
      || (trip.shared && !trip.locked) || members.length !== trip.members.length
      || members[0] !== walletSession.account || !members.every(isAddress) || new Set(members).size !== members.length) {
      fail('Enter a different valid wallet address for each member, including the connected organizer.');
      return;
    }
    const start = Math.floor(Date.parse(trip.startTime) / 1000);
    const end = Math.floor(roomEndTime(trip) / 1000);
    const deadline = Math.floor(Date.parse(trip.depositDeadline) / 1000);
    if (deadline && Date.now() >= deadline * 1000) return fail('The deposit deadline has passed.');
    const calldata = deadline
      ? '0x' + VAULT.deadlineBytecode + abiWord(160) + abiWord(deadline) + abiWord(start)
        + abiWord(end) + abiWord(trip.minimumUnits) + abiArray(members)
      : '0x' + VAULT.bytecode + abiWord(128) + abiWord(start) + abiWord(end)
        + abiWord(trip.minimumUnits) + abiArray(members);
    sheet.close();
    withFuji('Deploy Fuji vault', context => sendFuji(context, 'Deploy Fuji vault', 'deploy', null, calldata));
  }

  function openFujiFunds(kind) {
    const vault = currentVault();
    const index = vault?.members.indexOf(walletSession.account) ?? -1;
    const withdraw = kind === 'withdraw';
    if (index < 0 || walletSession.busy || (withdraw ? !canWithdrawFuji(vault, index) : !canDepositFuji(vault))) return;
    sheetOpen(withdraw ? 'Withdraw my deposit' : 'Deposit USDC', 'Avalanche Fuji',
      `<form class="stack" id="fuji-funds-form">
        <input name="kind" type="hidden" value="${kind}">
        <label class="field">Amount (test USDC)<input name="amount" type="number" min="0.000001" step="0.000001" required></label>
        ${withdraw ? '' : '<p class="notice">Your wallet may first ask you to approve this exact USDC allowance. The deposit is a separate transaction.</p>'}
        <p id="sheet-error" class="form-error"></p>
      </form>`,
      '<button class="btn full" type="submit" form="fuji-funds-form">Continue in wallet</button>',
    );
  }

  function fujiDeposit(units, topUpHash) {
    return withFuji('Deposit USDC', async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (index < 0 || !canDepositFuji(vault)) {
        throw new Error('This wallet cannot deposit into the vault.');
      }
      if (topUpHash && (topUpHash !== vault.hash || fujiShortfall(vault, index) !== units
        || state.trip?.id !== context.tripId || !matchesFujiDraft(state.trip, vault))) {
        throw new Error('The amount due changed. Refresh the vault before topping up.');
      }
      if (BigInt(units) > vault.usdc) {
        const available = money(Number(vault.usdc));
        throw new Error(`Your wallet has ${available} on Fuji. This deposit needs ${money(units)}. Get test USDC from the Circle faucet and try again.`);
      }
      const allowance = BigInt(await ethCall(context, FUJI.usdc,
        vaultCall('allowance(address,address)', context.account, context.vault)));
      if (allowance < BigInt(units)) {
        const approved = await sendFuji(context, 'Approve ' + money(units), 'allowance', FUJI.usdc,
          vaultCall('approve(address,uint256)', context.vault, units));
        if (!approved) return;
      }
      const calldata = topUpHash ? vaultCall('depositForPlan(uint256,bytes32)', units, topUpHash)
        : vaultCall('deposit(uint256)', units);
      await sendFuji(context, 'Deposit ' + money(units), 'deposit', context.vault, calldata);
    });
  }

  function fujiFunds(data, fail) {
    const kind = data.get('kind');
    const units = parseUnits(data.get('amount'));
    if (!units || !['deposit', 'withdraw'].includes(kind)) return fail('Enter a valid amount of test USDC.');
    sheet.close();
    if (kind === 'deposit') return fujiDeposit(units);
    withFuji('Withdraw test USDC', async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (!canWithdrawFuji(vault, index)) {
        throw new Error('You can take back your deposit only before the withdrawal deadline.');
      }
      if (units > vault.balances[index]) throw new Error('Enter an amount up to your balance in the trip fund.');
      await sendFuji(context, 'Withdraw ' + money(units), 'withdraw', context.vault, vaultCall('withdraw(uint256)', units));
    });
  }

  function fujiShortfall(vault, index) {
    return Math.max(0, Math.max(vault.minimum, -(vault.net[index] || 0)) - vault.balances[index]);
  }

  function fujiDraft(trip) {
    if (!trip.reviewQuote || hasPendingBills(trip)) return null;
    const plan = settlementPlan(trip, trip.reviewQuote);
    if (plan.invalid) return null;
    const net = new Map(trip.members.map(member => [member.id, 0n]));
    for (const item of plan.transfers) {
      net.set(item.from, net.get(item.from) - BigInt(item.units));
      net.set(item.to, net.get(item.to) + BigInt(item.units));
    }
    const result = [...net.values()].map(Number);
    return result.every(Number.isSafeInteger) ? result : null;
  }

  function matchesFujiDraft(trip, vault) {
    const draft = fujiDraft(trip);
    return Boolean(draft && trip.fuji?.publishedRevision === String(trip.revision)
      && draft.length === vault.net.length && draft.every((units, index) => units === vault.net[index]));
  }

  function openFujiPlan(vault) {
    const trip = state.trip;
    const draft = trip && fujiDraft(trip);
    if (!draft || vault?.members[0] !== walletSession.account || vault.members.length !== draft.length
      || vault.timestamp < vault.end || vault.timestamp >= vault.refundDeadline || vault.settled
      || (vault.net.length && matchesFujiDraft(trip, vault))) return;
    paymentReviewSheet(trip, draft, 'fuji-publish');
  }

  function fujiSettlementAction(action, selection) {
    const trip = state.trip;
    const displayed = currentVault();
    if (!trip || !displayed) return;
    const labels = {
      'fuji-publish': 'Share amounts for approval', 'fuji-approve': 'Approve my amount',
      'fuji-revoke': 'Undo my approval', 'fuji-settle': 'Make group payments', 'fuji-claim': 'Send balance to my wallet',
    };
    if (sheet.open) sheet.close();
    withFuji(labels[action], async context => {
      const vault = await fetchVault(context);
      const index = vault.members.indexOf(context.account);
      if (index < 0) throw new Error('Connect a wallet that belongs to this vault.');
      let calldata;
      if (action === 'fuji-publish') {
        syncTrips();
        const latest = state.trip;
        const draft = latest?.id === context.tripId && fujiDraft(latest);
        if (!draft || String(latest.revision) !== selection.revision || draft.length !== vault.members.length
          || index !== 0 || vault.timestamp < vault.end || vault.settled || vault.timestamp >= vault.refundDeadline) {
          throw new Error('The amounts changed or cannot be shared yet. Review them again.');
        }
        if (vault.net.length && matchesFujiDraft(latest, vault)) throw new Error('These amounts are already shared.');
        calldata = vaultCall('propose(int256[])', 32) + abiArray(draft);
      } else if (action === 'fuji-claim') {
        if (vault.balances[index] <= 0 || (!vault.settled && !vault.cancelled && vault.timestamp < vault.refundDeadline)) {
          throw new Error('There is no claimable balance yet.');
        }
        calldata = vaultCall('claim()');
      } else {
        if (!vault.net.length || vault.hash !== selection.hash || vault.settled) {
          throw new Error('The Fuji proposal changed. Review the latest amounts.');
        }
        if (vault.timestamp < vault.end || vault.timestamp >= vault.refundDeadline) {
          throw new Error('The Fuji settlement window is closed.');
        }
        syncTrips();
        if (action !== 'fuji-revoke' && (state.trip?.id !== context.tripId || !matchesFujiDraft(state.trip, vault))) {
          throw new Error('The amounts changed. The organizer needs to share the updated amounts first.');
        }
        if (action === 'fuji-settle') {
          if (index !== 0 || !vault.approvals.every(Boolean)
            || vault.members.some((_, position) => fujiShortfall(vault, position) > 0)) {
            throw new Error('Everyone needs to approve their amount and add enough USDC before the organizer can pay.');
          }
          calldata = vaultCall('settle(bytes32)', vault.hash);
        } else {
          calldata = vaultCall('approve(bytes32,bool)', vault.hash, action === 'fuji-approve' ? 1 : 0);
        }
      }
      await sendFuji(context, labels[action], action, context.vault, calldata, selection.revision);
    });
  }

  function checkFujiTransaction() {
    const trip = state.trip;
    const tx = trip?.fuji?.lastTx;
    if (tx?.phase !== 'pending' || !isHash(tx.hash)) return;
    withFuji(tx.label, context => checkReceipt(context, tx, false), true);
  }

  function fujiTransactionCard(trip) {
    const visible = walletSession.status;
    const status = visible && visible.tripId === trip?.id ? visible : trip?.fuji?.lastTx;
    if (!status) return '';
    const names = {
      signature: 'Awaiting signature', pending: 'Pending', confirmed: 'Confirmed', failed: 'Failed', rejected: 'Declined',
    };
    const style = status.phase === 'confirmed' ? ' green' : status.phase === 'signature' ? '' : ' warn';
    const link = isHash(status.hash)
      ? `<p><a href="${FUJI.explorer}/tx/${status.hash}" target="_blank" rel="noopener noreferrer">View on Fuji Explorer</a></p>` : '';
    return `<div class="notice${style}" role="status">
      <p><strong>${safe(names[status.phase])} · ${safe(status.label)}</strong></p>
      <p>${safe(status.message)}</p>${link}
    </div>`;
  }

  function fujiSettlementSummary(trip, vault, compact = false) {
    const settlement = trip.fuji?.settlementTx;
    const explorerLink = isHash(settlement)
      ? ` <a href="${FUJI.explorer}/tx/${settlement}" target="_blank" rel="noopener noreferrer">View settlement on Fuji</a>` : '';
    const rows = vault.members.map((address, position) => {
      const remaining = vault.balances[position];
      const allocation = vault.payouts?.[position];
      const net = vault.net[position] || 0;
      const label = userText(trip.members[position]?.name || address);
      const summary = allocation === undefined
        ? (remaining > 0 ? 'Available to claim' : 'No balance left to claim')
        : allocation === 0 ? 'No payout'
          : remaining > 0 ? 'Available to claim · ' + money(remaining)
            : 'Claimed · ' + money(allocation);
      const distribution = allocation === undefined ? ''
        : 'Deposited ' + money(allocation - net) + ' · ' +
          (net > 0 ? 'Receives ' : net < 0 ? 'Pays ' : 'Net ') + money(Math.abs(net)) + ' · ';
      return row(label, money(allocation ?? remaining), distribution + summary);
    }).join('');
    return `<p class="notice green">Group payments are complete. Each person can move their remaining test USDC to their wallet.${explorerLink}</p>
      ${compact ? finalSplitDetails('payouts', 'What each person gets back', rows)
        : '<div><h3>What each person gets back</h3>' + rows + '</div>'}`;
  }

  function fujiWithdrawalDeadline(vault) {
    return Math.min(vault.depositDeadline || vault.start, vault.end);
  }

  function canDepositFuji(vault) {
    return !vault.settled && !vault.cancelled && vault.timestamp < vault.refundDeadline
      && (!vault.depositDeadline || vault.timestamp < vault.depositDeadline || vault.timestamp >= vault.start);
  }

  function fujiPaymentAmount(units) {
    return units < 0 ? 'Pays ' + money(-units) : units > 0 ? 'Gets ' + money(units) : 'No payment';
  }

  function canWithdrawFuji(vault, index) {
    return Boolean(vault && index >= 0 && !vault.settled && vault.balances[index] > 0
      && vault.timestamp < fujiWithdrawalDeadline(vault));
  }

  function fujiDepositTiming(vault) {
    if (vault.timestamp < fujiWithdrawalDeadline(vault)) {
      const deadline = safe(formatTripTime(fujiWithdrawalDeadline(vault) * 1000));
      return `<p class="notice">Add at least <strong>${money(vault.minimum)}</strong> by <strong>${deadline}</strong>.
        You can take back your own deposit before then.</p>`;
    }
    if (vault.timestamp < vault.end) {
      if (vault.depositDeadline && vault.timestamp < vault.start) {
        return '<p class="notice">The trip is confirmed. Deposits are locked until the scheduled start, when top-ups open.</p>';
      }
      return '<p class="notice">Withdrawals are locked. You can still add USDC if you need to top up.</p>';
    }
    return '<p class="notice">The trip has ended. Withdrawals stay locked while the group reviews payments. You can still top up.</p>';
  }

  let refreshingTripStatus;

  async function refreshTripStatus() {
    if (refreshingTripStatus || walletSession.busy) return;
    const trip = state.trip;
    const account = walletSession.account;
    refreshingTripStatus = { id: trip?.id, account };
    render();
    try {
      const roomOk = !trip?.shared || await syncRooms();
      if (state.trip?.id !== trip?.id || walletSession.account !== account) return;
      const fundingRequired = trip?.shared && rooms.token && !state.trip?.settled;
      const [vaultOk, fundingOk] = await Promise.all([
        refreshVault(), fundingRequired ? refreshRoomFunding() : true,
      ]);
      if (state.trip?.id !== trip?.id || walletSession.account !== account) return;
      notice(roomOk && vaultOk && fundingOk ? 'Trip status updated.' : 'Could not fully refresh trip status. Try again.');
    } finally {
      refreshingTripStatus = null;
      render();
    }
  }

  function tripWalletPanel({ subtitle, walletDetails = '', paymentDetails = '', content = '', controls = '', transaction = '', utilities = '' }) {
    return `<section class="panel stack trip-settings-panel trip-wallet-panel">

  function groupPaymentsPanel({ personalAmount = '', message = '', content = '', actions = '', transaction = '', paymentDetails = '', utilities = '', details = '' }) {

  function finalSplitReview(trip, plan) {
    const review = { message: '', action: '', secondary: '' };
    if (trip.settled || roomFundingCancelled(trip) || (!trip.fuji?.address && trip.depositDeadline)) return review;
    const vault = currentVault();
    if (vault && (vault.settled || vault.cancelled || vault.timestamp >= vault.refundDeadline)) return review;

    if (!roomBillsClosed(trip)) {
      review.message = `<p class="subtitle">Group payments can start after the trip ends.</p>
        <p class="split-date">${safe(formatTripTime(roomEndTime(trip)))}</p>`;
    } else if (hasPendingBills(trip)) {
      review.message = '<p class="notice warn">Finish open bill reviews before making final payments.</p>';
      review.action = btn('Review open bills', 'navigate', { data: 'data-view="bills"' });
    } else if (!trip.reviewQuote) {
      review.message = '<p class="subtitle">The organizer prepares the split and locks the rate for approval.</p>';
      if (canPrepare(trip)) {
        const fetching = preparingTrip === trip;
        review.action = btn(fetching ? 'Checking exchange rate…' : 'Calculate final amounts', 'prepare-split', { disabled: fetching });
      }
      if (canUseFallback(fallbackReview)) {
        review.message = `<div class="notice warn">
          <p>Market rate unavailable. You can retry or prepare the split with this reference.</p>
          <p>${safe(fxLabel(fallbackReview.quote))}</p>
        </div>`;
        review.secondary = btn('Use fallback rate', 'use-fallback', { tone: 'secondary' });
      }

      if (plan.invalid) review.message = '<p class="notice warn">The current transfers cannot be represented in USDC. Reopen the split and check the rate before settling.</p>';

        review.message = '<p class="subtitle">Waiting for the organizer to share the final amounts.</p>';

    return tripWalletPanel({ subtitle: trip?.shared ? 'This trip uses test USDC on Avalanche Fuji.'

  function handleFujiAction(action, selection) {
    switch (action) {
      case 'fuji-connect': chooseWallet(); break;
      case 'fuji-wallet-option': connectWallet(walletSession.choices[Number(selection.id)]); break;
      case 'fuji-switch': switchToFuji(); break;
      case 'fuji-disconnect': clearWallet(); roomWalletChanged(); render(); break;
      case 'fuji-refresh': refreshTripStatus(); break;
      case 'fuji-check': checkFujiTransaction(); break;
      case 'fuji-deploy':
        if (state.trip?.shared) roomLockForDeploy(state.trip);
        else openFujiDeploy();
        break;
      case 'fuji-deposit': openFujiFunds('deposit'); break;
      case 'fuji-withdraw': openFujiFunds('withdraw'); break;
      case 'fuji-top-up': {
        const units = Number(selection.units);
        if (isHash(selection.hash) && Number.isSafeInteger(units) && units > 0) fujiDeposit(units, selection.hash);
        break;
      }
      case 'fuji-plan': openFujiPlan(currentVault()); break;
      case 'fuji-publish':
      case 'fuji-approve':
      case 'fuji-revoke':
      case 'fuji-settle':
      case 'fuji-claim':
        fujiSettlementAction(action, selection);
        break;
    }
  }


  const ROOM_AUTH_KEY = 'tripvault-room-auth';
  const ROOM_TX_KEY = 'tripvault-room-transactions';
  const rooms = {
    online: false, canDelete: false, canBulkDelete: false, canEnd: false, canSendTopUpReminders: false,
    canSaveCancellationReason: false, canRespondToSuggestions: false,
    account: '', token: '', list: new Map(), reminders: [], removed: new Set(), intent: null,
    busy: false, refreshing: false, timer: null, lastVaultPoll: 0, lastFundingPoll: 0, transactions: {},
  };

  function roomStorage(key, value) {
    try {
      if (arguments.length === 1) return JSON.parse(sessionStorage.getItem(key));
      if (value === null) sessionStorage.removeItem(key);
      else sessionStorage.setItem(key, JSON.stringify(value));
    } catch {
      return null;
    }
  }

  function availableTrips() {
    return [...state.trips, ...rooms.list.values()];
  }

  async function roomApi(path, body, token = rooms.token, timeoutMs = 0) {
    const headers = { Accept: 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const controller = timeoutMs ? new AbortController() : null;
    const timeout = controller ? setTimeout(() => controller.abort(), timeoutMs) : null;
    try {
      const response = await fetch('/api' + path, {
        method: body === undefined ? 'GET' : 'POST', headers, cache: 'no-store', signal: controller?.signal,
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) throw Object.assign(new Error(data.error || 'Room request failed.'), { status: response.status });
      return data;
    } catch (error) {
      if (controller?.signal.aborted) throw new Error('The server took too long to respond. Try again.');
      throw error;
    } finally {
      if (timeout !== null) clearTimeout(timeout);
    }
  }

  function roomTxKey(id, address) {
    return id + ':' + address;
  }

  function keepRoom(incoming, select = false) {
    if (rooms.removed.has(incoming.id)) return;
    const member = incoming.members.find(item => item.address === rooms.account);
    if (!member) return;
    const cached = rooms.list.get(incoming.id);
    const selected = select || state.trip?.id === incoming.id;
    const current = cached?.version > incoming.version ? cached : incoming;
    const previousAddress = cached?.fuji?.address;
    const tx = rooms.transactions[roomTxKey(incoming.id, rooms.account)];
    const next = { ...current, fuji: tx ? { ...current.fuji, lastTx: tx } : current.fuji };
    const changed = !cached || JSON.stringify(cached) !== JSON.stringify(next);
    if (changed) rooms.list.set(next.id, next);
    if (selected && (changed || select)) {
      if (select && state.trip?.id !== next.id) state.view = 'overview';
      state.trip = next;
      state.actor = member.id;
    }
    if (changed || select) {
      render();
      const billDetail = selected && !rooms.busy && sheet.open && sheet.querySelector('[data-bill-review]');
      if (billDetail) roomBillDetail(Number(billDetail.dataset.billReview));
    }
    if (selected && next.fuji?.address && (select || previousAddress !== next.fuji.address || cached?.settled !== next.settled)) refreshVault();
    if (selected && (select || cached?.version !== next.version)) refreshRoomFunding();
  }

  function forgetRoom(id, message = '') {
    rooms.removed.add(id);
    selectedTrips.delete(id);
    const listed = rooms.list.delete(id);
    if (state.trip?.id === id) selectTrip(null);
    else if (listed) render();
    if (message) notice(message);
  }

  function clearRoomSession() {
    clearTripSelection();
    rooms.account = '';
    rooms.token = '';
    rooms.list.clear();
    rooms.reminders = [];
    roomStorage(ROOM_AUTH_KEY, null);
    if (state.trip?.shared) {
      if (sheet.open) sheet.close();
      state.trip = null;
      state.actor = null;
      state.view = 'overview';
    }
    render();
  }

  function expireRoomSignIn() {
    rooms.token = '';
    roomStorage(ROOM_AUTH_KEY, null);
    if (!state.trip?.shared || rooms.account !== walletSession.account) clearRoomSession();
    else render();
  }

  async function syncRooms() {
    const token = rooms.token;
    if (!token || rooms.account !== walletSession.account) return false;
    if (rooms.refreshing?.token === token) return rooms.refreshing.promise;
    const known = new Map(rooms.list);
    const refresh = { token, promise: loadRooms(token, known) };
    rooms.refreshing = refresh;
    try {
      return await refresh.promise;
    } finally {
      if (rooms.refreshing === refresh) rooms.refreshing = null;
    }
  }

  async function loadRooms(token, known) {
    try {
      const { rooms: active, reminders = [] } = await roomApi('/rooms', undefined, token, 8000);
      if (token !== rooms.token || rooms.account !== walletSession.account) return false;
      const previousNotifications = notificationIds();
      const remindersChanged = JSON.stringify(rooms.reminders) !== JSON.stringify(reminders);
      rooms.reminders = reminders;
      const current = new Set(active.map(room => room.id));
      for (const room of active) keepRoom(room);
      for (const [id, snapshot] of known) {
        if (!current.has(id) && rooms.list.get(id) === snapshot) {
          forgetRoom(id, state.trip?.id === id ? 'The organizer deleted this trip.' : '');
        }
      }
      if (remindersChanged) {
        render();
        if (rooms.reminders.some(reminder => reminder.roomId === state.trip?.id)) refreshRoomFunding();
      }
      updateRoomNotifications(previousNotifications);
      return true;
    } catch (error) {
      if (token === rooms.token && error.status === 401) {
        expireRoomSignIn();
        notice('Room sign-in expired. Sign in again with your wallet.');
      }
      return false;
    }
  }

  function pollRooms() {
    clearTimeout(rooms.timer);
    if (!rooms.online || !rooms.token) return;
    rooms.timer = setTimeout(async () => {
      await syncRooms();
      if (state.trip?.shared && (['overview', 'bills'].includes(state.view)
        || rooms.reminders.some(reminder => reminder.roomId === state.trip.id))
        && Date.now() - rooms.lastFundingPoll >= 6000) {
        rooms.lastFundingPoll = Date.now();
        refreshRoomFunding();
      }
      if (state.trip?.shared && state.trip.fuji?.address
        && (['wallet', 'split'].includes(state.view)
          || (state.view === 'overview' && roomEndTime(state.trip) <= Date.now() && !state.trip.settled))
        && !walletSession.busy && Date.now() - rooms.lastVaultPoll >= 6000) {
        rooms.lastVaultPoll = Date.now();
        refreshVault(true);
      }
      pollRooms();
    }, 2000);
  }

  function roomWalletChanged() {
    if (!rooms.online) return;
    const account = walletSession.account;
    if (rooms.account && account !== rooms.account) clearRoomSession();
    const saved = roomStorage(ROOM_AUTH_KEY);
    if (account && !rooms.token && saved?.address === account && typeof saved.token === 'string') {
      rooms.account = account;
      rooms.token = saved.token;
      syncRooms();
      pollRooms();
    }
    if (rooms.intent) showRoomIntent();
  }

  async function enableRooms() {
    if (!['http:', 'https:'].includes(window.location?.protocol)) return;
    try {
      const status = await roomApi('/health');
      if (status.rooms !== true) return;
      rooms.online = true;
      rooms.canDelete = status.deleteTrip === true;
      rooms.canBulkDelete = status.bulkDelete === true;
      rooms.canEnd = status.endTrip === true;
      rooms.canSendTopUpReminders = status.topUpReminders === true;
      rooms.canSaveCancellationReason = status.billCancellationReason === true;
      rooms.canRespondToSuggestions = status.suggestionResponses === true;
      rooms.transactions = roomStorage(ROOM_TX_KEY) || {};
      roomWalletChanged();
      const invite = new URLSearchParams(window.location.search).get('join');
      if (invite) {
        if (!/^(?:\d{6}|[A-Za-z0-9_-]{32})$/.test(invite)) {
          notice('This invitation is invalid.');
        } else {
          if (guideOpen && sheet.open) pendingGuideInvite = invite;
          else startRoomFlow('join', invite);
        }
      }
      window.addEventListener('focus', syncRooms);
      window.addEventListener('pageshow', syncRooms);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') syncRooms();
      });
      render();
    } catch {
      // The standalone HTML still supports the local demo.
    }
  }

  function walletAuthMessage(message) {
    return '0x' + Array.from(new TextEncoder().encode(message), byte => byte.toString(16).padStart(2, '0')).join('');
  }

  async function signPersonalMessage(provider, message, account) {
    const hex = walletAuthMessage(message);
    const checksummed = message.split('\n')[1] || account;
    const attempts = [
      [hex, checksummed],
      [hex, account],
      [checksummed, hex],
      [account, hex],
      [message, checksummed],
      [message, account],
    ];
    let lastError = null;
    for (const params of attempts) {
      try {
        return await request(provider, 'personal_sign', params);
      } catch (err) {
        lastError = err;
        if (err?.code === 4001 || Number(err?.code) === 4100 || err?.code === 'ACTION_REJECTED') throw err;
      }
    }
    throw lastError;
  }

  async function authenticateRoomWallet() {
    const context = walletContext();
    await checkWallet(context);
    if (rooms.token && rooms.account === context.account) return rooms.token;
    const challenge = await roomApi('/auth/challenge', { address: context.account }, '');
    await checkWallet(context);
    const signature = await signPersonalMessage(context.provider, challenge.message, context.account);
    await checkWallet(context);
    const auth = await roomApi('/auth/verify', { nonce: challenge.nonce, signature }, '');
    if (auth.address !== walletSession.account) throw new Error('The wallet account changed. Try again.');
    rooms.account = auth.address;
    rooms.token = auth.token;
    roomStorage(ROOM_AUTH_KEY, auth);
    pollRooms();
    return auth.token;
  }

  function localDatetimeValue(minutesFromNow) {
    const d = new Date(Date.now() + minutesFromNow * 60 * 1000);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatRelativeDuration(ms) {
    if (ms <= 0) return '0p';
    if (ms < 3_600_000) return `${Math.max(1, Math.round(ms / 60_000))} phút`;
    if (ms < 86_400_000) {
      const h = Math.floor(ms / 3_600_000);
      const m = Math.round((ms % 3_600_000) / 60_000);
      return m > 0 ? `${h}h ${m}p` : `${h} giờ`;
    }
    const days = (ms / 86_400_000).toFixed(1).replace('.0', '');
    return `${days} ngày`;
  }

  function formatTimeSimple(d) {
    if (!d || isNaN(d.getTime())) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())} (${pad(d.getDate())}/${pad(d.getMonth() + 1)})`;
  }

  function updateRoomTimeTimeline(form = sheet.querySelector('#room-form')) {
    if (!form) return;
    const container = form.querySelector('#room-time-timeline');
    if (!container) return;
    const deadlineInput = form.querySelector('input[name="depositDeadline"]');
    const startInput = form.querySelector('input[name="startTime"]');
    const endInput = form.querySelector('input[name="endTime"]');
    if (!deadlineInput || !startInput || !endInput) return;

    const nowLocal = localDatetimeValue(0);
    deadlineInput.min = nowLocal;
    if (deadlineInput.value) startInput.min = deadlineInput.value;
    if (startInput.value) endInput.min = startInput.value;

    const dVal = deadlineInput.value ? new Date(deadlineInput.value) : null;
    const sVal = startInput.value ? new Date(startInput.value) : null;
    const eVal = endInput.value ? new Date(endInput.value) : null;

    if (!dVal || !sVal || !eVal || isNaN(dVal.getTime()) || isNaN(sVal.getTime()) || isNaN(eVal.getTime())) {
      container.innerHTML = '<p class="notice" style="margin:0;">Vui lòng chọn đủ 3 mốc thời gian để xem tiến trình.</p>';
      return;
    }

    const now = Date.now();
    let error = '';
    if (dVal.getTime() <= now) {
      error = '⚠️ Hạn nạp tiền phải ở thời điểm tương lai.';
      deadlineInput.setAttribute('aria-invalid', 'true');
    } else {
      deadlineInput.removeAttribute('aria-invalid');
    }

    if (sVal.getTime() < dVal.getTime()) {
      error = '⚠️ Giờ bắt đầu chuyến đi phải sau hạn nạp quỹ.';
      startInput.setAttribute('aria-invalid', 'true');
    } else {
      startInput.removeAttribute('aria-invalid');
    }

    if (eVal.getTime() <= sVal.getTime()) {
      error = '⚠️ Giờ kết thúc phải sau giờ bắt đầu.';
      endInput.setAttribute('aria-invalid', 'true');
    } else {
      endInput.removeAttribute('aria-invalid');
    }

    const tzOffsetMinutes = -new Date().getTimezoneOffset();
    const tzSign = tzOffsetMinutes >= 0 ? '+' : '-';
    const tzHours = Math.floor(Math.abs(tzOffsetMinutes) / 60);
    const tzString = `GMT${tzSign}${tzHours}`;

    if (error) {
      container.innerHTML = `<div class="timeline-header">
          <span>⏱️ Tiến trình thời gian</span>
          <span class="timeline-badge">${tzString}</span>
        </div>
        <div class="timeline-error">${error}</div>`;
      return;
    }

    const depositWindow = formatRelativeDuration(dVal.getTime() - now);
    const tripDuration = formatRelativeDuration(eVal.getTime() - sVal.getTime());

    container.innerHTML = `<div class="timeline-header">
        <span>⏱️ Tiến trình thời gian (Dự kiến)</span>
        <span class="timeline-badge">${tzString}</span>
      </div>
      <div class="timeline-items">
        <div class="timeline-item">
          <strong>⏳ Hạn nạp tiền</strong>
          <span>${formatTimeSimple(dVal)}</span>
          <span style="color:var(--accent-dark); font-weight:600;">(còn ${depositWindow})</span>
        </div>
        <div class="timeline-arrow">→</div>
        <div class="timeline-item">
          <strong>🚀 Khởi hành</strong>
          <span>${formatTimeSimple(sVal)}</span>
          <span>(Mở hóa đơn & top-up)</span>
        </div>
        <div class="timeline-arrow">→</div>
        <div class="timeline-item">
          <strong>🏁 Chốt sổ & Chia tiền</strong>
          <span>${formatTimeSimple(eVal)}</span>
          <span style="color:var(--positive); font-weight:600;">(Thời lượng: ${tripDuration})</span>
        </div>
      </div>`;
  }

        customDtState.viewYear = cur.getFullYear();
        customDtState.viewMonth = cur.getMonth();
        customDtState.selectedYear = cur.getFullYear();
        customDtState.selectedMonth = cur.getMonth();
        customDtState.selectedDay = cur.getDate();
        customDtState.hours = cur.getHours();
        customDtState.minutes = cur.getMinutes();
      }

      customDtState.selectedYear = now.getFullYear();
      customDtState.selectedMonth = now.getMonth();
      customDtState.selectedDay = now.getDate();
      customDtState.hours = now.getHours();

  function renderCustomDtPickerModal() {
    let overlay = sheet ? sheet.querySelector('#custom-dt-picker-overlay') : document.getElementById('custom-dt-picker-overlay');

      });

    const vi = siteLanguage === 'vi';

      ? ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12']
      : ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const weekDays = vi ? ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'] : ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
    const fieldTitles = {
      depositDeadline: vi ? '⏳ Hạn chốt nạp quỹ' : '⏳ Deposit Deadline',
      startTime: vi ? '🚀 Giờ khởi hành' : '🚀 Trip Start Time',
      endTime: vi ? '🏁 Giờ kết thúc chuyến đi' : '🏁 Trip End Time',
    };
    const titleText = fieldTitles[customDtState.targetName] || (vi ? 'Chọn thời gian' : 'Select Date & Time');

    const year = customDtState.viewYear;
    const month = customDtState.viewMonth;
    const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const now = new Date();
    const todayY = now.getFullYear();
    const todayM = now.getMonth();
    const todayD = now.getDate();

    let gridHtml = '';
    for (let i = 0; i < firstDay; i++) {
      gridHtml += '<span class="custom-dt-weekday"></span>';
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const isPast = new Date(year, month, day, 23, 59, 59) < now;
      const isSelected = (year === customDtState.selectedYear && month === customDtState.selectedMonth && day === customDtState.selectedDay);
      const isToday = (year === todayY && month === todayM && day === todayD);
      const classes = ['custom-dt-day'];
      if (isSelected) classes.push('selected');
      if (isToday) classes.push('today');

      gridHtml += `<button type="button" class="${classes.join(' ')}"${isPast ? ' disabled' : ''} data-dt-act="select-day" data-day="${day}">${day}</button>`;
    }

    const pad = n => String(n).padStart(2, '0');
    const hoursStr = pad(customDtState.hours);
    const minStr = pad(customDtState.minutes);

    const tzOffsetMinutes = -new Date().getTimezoneOffset();
    const tzSign = tzOffsetMinutes >= 0 ? '+' : '-';
    const tzHours = Math.floor(Math.abs(tzOffsetMinutes) / 60);
    const tzString = `GMT${tzSign}${tzHours}`;

    overlay.innerHTML = `
      <div class="custom-dt-card" role="document">
        <div class="custom-dt-head">
          <h3>${titleText}</h3>
          <button type="button" class="btn ghost" style="width:32px;height:32px;padding:0;min-height:0;" data-dt-act="cancel" aria-label="Đóng">✕</button>
        </div>
        <div class="custom-dt-month-nav">
          <button type="button" class="custom-dt-nav-btn" data-dt-act="prev-month" aria-label="Tháng trước">‹</button>
          <strong>${monthNames[month]} ${year}</strong>
          <button type="button" class="custom-dt-nav-btn" data-dt-act="next-month" aria-label="Tháng sau">›</button>
        </div>
        <div class="custom-dt-grid" role="grid">
          ${weekDays.map(w => `<span class="custom-dt-weekday">${w}</span>`).join('')}
          ${gridHtml}
        </div>
        <div class="custom-dt-time-section">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; font-weight:700; color:var(--muted);">${vi ? '🕒 GIỜ VÀ PHÚT:' : '🕒 TIME (HOURS : MINS):'}</span>
            <span class="timeline-badge">${tzString}</span>
          </div>
          <div class="custom-dt-time-steppers">
            <div class="custom-dt-stepper">
              <button type="button" class="custom-dt-stepper-btn" data-dt-act="hour-minus" aria-label="Giảm giờ">−</button>
              <span class="custom-dt-stepper-value">${hoursStr}</span>
              <button type="button" class="custom-dt-stepper-btn" data-dt-act="hour-plus" aria-label="Tăng giờ">+</button>

            <span class="custom-dt-colon">:</span>
            <div class="custom-dt-stepper">
              <button type="button" class="custom-dt-stepper-btn" data-dt-act="min-minus" aria-label="Giảm phút">−</button>
              <span class="custom-dt-stepper-value">${minStr}</span>
              <button type="button" class="custom-dt-stepper-btn" data-dt-act="min-plus" aria-label="Tăng phút">+</button>
            </div>
          </div>
          <div class="custom-dt-quick-strip">
            <button type="button" class="custom-dt-quick-btn" data-dt-act="quick-add" data-min="120">+2h</button>
            <button type="button" class="custom-dt-quick-btn" data-dt-act="quick-add" data-min="1440">+1d</button>
            <button type="button" class="custom-dt-quick-btn" data-dt-act="quick-add" data-min="4320">+3d</button>
            <button type="button" class="custom-dt-quick-btn" data-dt-act="quick-add" data-min="10080">+7d</button>
            <button type="button" class="custom-dt-quick-btn" data-dt-act="quick-eod">23:59</button>
          </div>
        </div>
        <div class="custom-dt-footer">
          <button type="button" class="btn secondary" data-dt-act="cancel">${vi ? 'Hủy' : 'Cancel'}</button>
          <button type="button" class="btn" data-dt-act="confirm">${vi ? 'Áp dụng' : 'Apply'}</button>
        </div>
      </div>
    `;

    overlay.onclick = e => {
      const btn = e.target.closest('[data-dt-act]');
      if (!btn) {
        if (!e.target.closest('.custom-dt-card')) closeCustomDateTimePicker();
        return;
      }
      e.stopPropagation();
      const act = btn.dataset.dtAct;
      if (act === 'cancel') {
        closeCustomDateTimePicker();
      } else if (act === 'confirm') {
        const p = n => String(n).padStart(2, '0');
        const formatted = `${customDtState.selectedYear}-${p(customDtState.selectedMonth + 1)}-${p(customDtState.selectedDay)}T${p(customDtState.hours)}:${p(customDtState.minutes)}`;
        if (customDtState.targetInput) {
          customDtState.targetInput.value = formatted;
          const form = customDtState.targetInput.closest('form');
          if (form) {
            form.querySelectorAll('[data-act="room-preset-time"]').forEach(b => b.setAttribute('aria-pressed', 'false'));
            updateRoomTimeTimeline(form);
